name: Add Personal Profile Commercial Offer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-profile-offer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add commercial offer safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          helper_marker = (
              "# ASTROVIBE PERSONAL PROFILE COMMERCIAL OFFER"
          )

          if helper_marker not in source:
              settings_definition = re.search(
                  r'(?m)^def settings_menu'
                  r'$$language="fr"$$:',
                  source,
              )

              if not settings_definition:
                  raise SystemExit(
                      "ERROR: settings_menu was not found."
                  )

              helper_lines = [
                  "",
                  "",
                  "# ============================================",
                  "# ASTROVIBE PERSONAL PROFILE COMMERCIAL OFFER",
                  "# ============================================",
                  "",
                  "PROFILE_OFFER_BUTTONS = {",
                  '    "fr": "✨ Mon Profil AstroVibe",',
                  '    "en": "✨ My AstroVibe Profile",',
                  "}",
                  "",
                  "PROFILE_UNLOCK_BUTTONS = {",
                  (
                      '    "fr": '
                      '"✨ Débloquer mon Profil · 390 ⭐",'
                  ),
                  (
                      '    "en": '
                      '"✨ Unlock My Profile · 390 ⭐",'
                  ),
                  "}",
                  "",
                  "",
                  "def personal_profile_offer_text(language):",
                  "    if language == \"en\":",
                  "        return (",
                  (
                      '            "✨ YOUR ASTROVIBE '
                      'PERSONAL PROFILE\\n\\n"'
                  ),
                  (
                      '            "Your Sun sign is only '
                      'one part of your story. 🌌\\n\\n"'
                  ),
                  (
                      '            "Discover a personalised '
                      'astrological reading built from your "'
                  ),
                  (
                      '            "birth information and '
                      'your natal chart.\\n\\n"'
                  ),
                  (
                      '            "🔮 YOUR PROFILE '
                      'EXPLORES:\\n\\n"'
                  ),
                  (
                      '            "☀️ Sun\\nYour identity and '
                      'self-expression\\n\\n"'
                  ),
                  (
                      '            "🌙 Moon\\nYour emotional '
                      'world and deeper needs\\n\\n"'
                  ),
                  (
                      '            "☿ Mercury\\nYour way of '
                      'thinking and communicating\\n\\n"'
                  ),
                  (
                      '            "♀ Venus\\nYour way of '
                      'loving and your values\\n\\n"'
                  ),
                  (
                      '            "♂ Mars\\nYour energy, '
                      'desires and motivation\\n\\n"'
                  ),
                  (
                      '            "♃ Jupiter\\nYour potential '
                      'for expansion\\n\\n"'
                  ),
                  (
                      '            "♄ Saturn\\nYour '
                      'responsibilities and areas of growth\\n\\n"'
                  ),
                  (
                      '            "♅ Uranus\\nYour need for '
                      'freedom and change\\n\\n"'
                  ),
                  (
                      '            "♆ Neptune\\nYour imagination '
                      'and intuition\\n\\n"'
                  ),
                  (
                      '            "♇ Pluto\\nYour deeper '
                      'transformations\\n\\n"'
                  ),
                  (
                      '            "✨ IF YOUR EXACT BIRTH TIME '
                      'IS KNOWN:\\n\\n"'
                  ),
                  (
                      '            "⬆️ Your Ascendant\\n"'
                  ),
                  (
                      '            "🏠 Your astrological '
                      'houses\\n"'
                  ),
                  (
                      '            "🪐 The life areas connected '
                      'to your placements\\n\\n"'
                  ),
                  (
                      '            "🌍 Available in French '
                      'and English\\n\\n"'
                  ),
                  (
                      '            "🔓 One-time purchase\\n"'
                  ),
                  (
                      '            "💎 No Premium subscription '
                      'required\\n\\n"'
                  ),
                  (
                      '            "⭐ LAUNCH PRICE: '
                      '390 STARS\\n\\n"'
                  ),
                  (
                      '            "👇 Unlock your AstroVibe '
                      'Personal Profile"'
                  ),
                  "        )",
                  "",
                  "    return (",
                  (
                      '        "✨ TON PROFIL ASTROVIBE '
                      'PERSONNEL\\n\\n"'
                  ),
                  (
                      '        "Ton signe solaire n’est qu’une '
                      'partie de ton histoire. 🌌\\n\\n"'
                  ),
                  (
                      '        "Découvre une lecture '
                      'astrologique personnalisée construite "'
                  ),
                  (
                      '        "à partir de tes informations de '
                      'naissance et de ton thème natal.\\n\\n"'
                  ),
                  (
                      '        "🔮 TON PROFIL EXPLORE :\\n\\n"'
                  ),
                  (
                      '        "☀️ Soleil\\nTon identité et ta '
                      'manière de t’affirmer\\n\\n"'
                  ),
                  (
                      '        "🌙 Lune\\nTon univers émotionnel '
                      'et tes besoins profonds\\n\\n"'
                  ),
                  (
                      '        "☿ Mercure\\nTa façon de penser '
                      'et de communiquer\\n\\n"'
                  ),
                  (
                      '        "♀ Vénus\\nTa manière d’aimer '
                      'et tes valeurs\\n\\n"'
                  ),
                  (
                      '        "♂ Mars\\nTon énergie, tes désirs '
                      'et ta motivation\\n\\n"'
                  ),
                  (
                      '        "♃ Jupiter\\nTon potentiel '
                      'd’expansion\\n\\n"'
                  ),
                  (
                      '        "♄ Saturne\\nTes responsabilités '
                      'et tes zones de construction\\n\\n"'
                  ),
                  (
                      '        "♅ Uranus\\nTon besoin de liberté '
                      'et de changement\\n\\n"'
                  ),
                  (
                      '        "♆ Neptune\\nTon imagination '
                      'et ton intuition\\n\\n"'
                  ),
                  (
                      '        "♇ Pluton\\nTes transformations '
                      'profondes\\n\\n"'
                  ),
                  (
                      '        "✨ SI TON HEURE DE NAISSANCE '
                      'EST CONNUE :\\n\\n"'
                  ),
                  (
                      '        "⬆️ Ton Ascendant\\n"'
                  ),
                  (
                      '        "🏠 Tes maisons '
                      'astrologiques\\n"'
                  ),
                  (
                      '        "🪐 Les domaines de vie associés '
                      'à tes placements\\n\\n"'
                  ),
                  (
                      '        "🌍 Disponible en français '
                      'et en anglais\\n\\n"'
                  ),
                  (
                      '        "🔓 Achat unique\\n"'
                  ),
                  (
                      '        "💎 Aucun abonnement Premium '
                      'nécessaire\\n\\n"'
                  ),
                  (
                      '        "⭐ PRIX DE LANCEMENT : '
                      '390 STARS\\n\\n"'
                  ),
                  (
                      '        "👇 Débloque ton Profil '
                      'AstroVibe Personnel"'
                  ),
                  "    )",
                  "",
                  "",
                  "def personal_profile_offer_menu(language):",
                  "    markup = types.ReplyKeyboardMarkup(",
                  "        resize_keyboard=True",
                  "    )",
                  "",
                  "    markup.row(",
                  "        types.KeyboardButton(",
                  (
                      "            PROFILE_UNLOCK_BUTTONS["
                  ),
                  (
                      '                "en" if language == "en" '
                      'else "fr"'
                  ),
                  "            ]",
                  "        )",
                  "    )",
                  "",
                  "    markup.row(",
                  "        types.KeyboardButton(",
                  (
                      '            get_text('
                      'language, "back_button")'
                  ),
                  "        )",
                  "    )",
                  "",
                  "    return markup",
                  "",
              ]

              helper_block = "\n".join(
                  helper_lines
              )

              source = (
                  source[
                      :settings_definition.start()
                  ]
                  + helper_block
                  + "\n"
                  + source[
                      settings_definition.start():
                  ]
              )

          settings_pattern = re.compile(
              r'(?ms)'
              r'^(?P<definition>def settings_menu'
              r'$$language="fr"$$:\n)'
              r'(?P<body>.*?)'
              r'^(?P<return_indent>[ \t]+)'
              r'return markup'
          )

          settings_match = settings_pattern.search(
              source
          )

          if not settings_match:
              raise SystemExit(
                  "ERROR: full settings_menu "
                  "function was not found."
              )

          settings_body = settings_match.group(
              "body"
          )

          offer_button_code = (
              'get_text(language, "profile_offer_button")'
          )

          if offer_button_code not in settings_body:
              back_row_pattern = re.compile(
                  r'(?ms)'
                  r'^(?P<indent>[ \t]+)'
                  r'markup\.row\(\n'
                  r'.*?'
                  r'get_text\('
                  r'language,\s*"back_button"'
                  r'\)'
                  r'.*?'
                  r'^(?P=indent)\)\n'
              )

              back_match = back_row_pattern.search(
                  settings_body
              )

              if not back_match:
                  raise SystemExit(
                      "ERROR: settings back button "
                      "row was not found."
                  )

              indent = back_match.group(
                  "indent"
              )

              offer_row = "\n".join(
                  [
                      indent + "markup.row(",
                      indent + "    types.KeyboardButton(",
                      (
                          indent
                          + "        PROFILE_OFFER_BUTTONS["
                      ),
                      (
                          indent
                          + '            "en" '
                          + 'if language == "en" '
                          + 'else "fr"'
                      ),
                      indent + "        ]",
                      indent + "    )",
                      indent + ")",
                      "",
                  ]
              )

              settings_body = (
                  settings_body[
                      :back_match.start()
                  ]
                  + offer_row
                  + settings_body[
                      back_match.start():
                  ]
              )

              source = (
                  source[
                      :settings_match.start("body")
                  ]
                  + settings_body
                  + source[
                      settings_match.end("body"):
                  ]
              )

          handler_marker = (
              "# PERSONAL PROFILE COMMERCIAL HANDLER"
          )

          if handler_marker not in source:
              birth_condition_pattern = re.compile(
                  r'(?m)'
                  r'^(?P<indent>[ \t]+)'
                  r'(?P<keyword>elif)'
                  r'(?P<condition>[^\n]*'
                  r'"birth_info_button"'
                  r'[^\n]*):\s*$'
              )

              condition_match = (
                  birth_condition_pattern.search(
                      source
                  )
              )

              if not condition_match:
                  raise SystemExit(
                      "ERROR: birth_info_button "
                      "handler branch was not found."
                  )

              indent = condition_match.group(
                  "indent"
              )

              condition = condition_match.group(
                  "condition"
              )

              expression_match = re.search(
                  r'(?P<expression>.+?)'
                  r'\s*==\s*'
                  r'get_text\('
                  r'language,\s*"birth_info_button"'
                  r'\)',
                  condition,
              )

              if not expression_match:
                  raise SystemExit(
                      "ERROR: could not identify "
                      "the handler text expression."
                  )

              text_expression = (
                  expression_match.group(
                      "expression"
                  ).strip()
              )

              handler_lines = [
                  indent
                  + "# PERSONAL PROFILE COMMERCIAL HANDLER",
                  indent
                  + "elif "
                  + text_expression
                  + " in PROFILE_OFFER_BUTTONS.values():",
                  indent
                  + "    bot.send_message(",
                  indent
                  + "        message.chat.id,",
                  indent
                  + "        personal_profile_offer_text(",
                  indent
                  + "            language",
                  indent
                  + "        ),",
                  indent
                  + "        reply_markup="
                  + "personal_profile_offer_menu(",
                  indent
                  + "            language",
                  indent
                  + "        )",
                  indent
                  + "    )",
                  indent
                  + "    return",
                  "",
                  indent
                  + "elif "
                  + text_expression
                  + " in PROFILE_UNLOCK_BUTTONS.values():",
                  indent
                  + "    if language == \"en\":",
                  indent
                  + "        pending_message = (",
                  indent
                  + '            "⭐ Telegram Stars payment "',
                  indent
                  + '            "will be available shortly."',
                  indent
                  + "        )",
                  indent
                  + "    else:",
                  indent
                  + "        pending_message = (",
                  indent
                  + '            "⭐ Le paiement Telegram Stars "',
                  indent
                  + '            "sera disponible prochainement."',
                  indent
                  + "        )",
                  "",
                  indent
                  + "    bot.send_message(",
                  indent
                  + "        message.chat.id,",
                  indent
                  + "        pending_message,",
                  indent
                  + "        reply_markup=settings_menu(",
                  indent
                  + "            language",
                  indent
                  + "        )",
                  indent
                  + "    )",
                  indent
                  + "    return",
                  "",
              ]

              handler_block = "\n".join(
                  handler_lines
              )

              source = (
                  source[
                      :condition_match.start()
                  ]
                  + handler_block
                  + source[
                      condition_match.start():
                  ]
              )

          compile(
              source,
              "bot.py",
              "exec"
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Commercial Profile offer "
              "added and validated."
          )
          PY

      - name: Compile AstroVibe
        run: |
          python -m py_compile bot.py
          python -m py_compile personal_profile_engine.py
          python -m py_compile personal_profile_v2_engine.py
          python -m py_compile natal_chart_engine.py
          python -m py_compile natal_profile_interpreter.py
          git diff --check

      - name: Verify commercial offer
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          checks = (
              "ASTROVIBE PERSONAL PROFILE COMMERCIAL OFFER",
              "PROFILE_OFFER_BUTTONS",
              "PROFILE_UNLOCK_BUTTONS",
              "personal_profile_offer_text",
              "personal_profile_offer_menu",
              "PERSONAL PROFILE COMMERCIAL HANDLER",
              "TON PROFIL ASTROVIBE PERSONNEL",
              "YOUR ASTROVIBE PERSONAL PROFILE",
              "390 STARS",
              "390 ⭐",
          )

          for expected in checks:
              if expected not in source:
                  raise SystemExit(
                      "ERROR: missing commercial "
                      "offer element: "
                      + expected
                  )

              print(
                  "OK:",
                  expected
              )

          print(
              "COMMERCIAL OFFER VERIFIED"
          )
          PY

      - name: Show bot diff
        run: |
          git diff --check
          git diff -- bot.py

      - name: Commit validated commercial offer
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot.py

          git commit -m "Add Personal Profile commercial offer"

          git push origin HEAD:main
