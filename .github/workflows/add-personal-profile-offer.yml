name: Add Personal Profile Commercial Offer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-profile-offer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch commercial offer with AST
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          marker = (
              "# ASTROVIBE COMMERCIAL PROFILE OFFER V2"
          )

          if marker in source:
              print(
                  "Commercial offer is already installed."
              )

              compile(
                  source,
                  "bot.py",
                  "exec"
              )

              raise SystemExit(0)

          tree = ast.parse(
              source,
              filename="bot.py"
          )

          settings_functions = [
              node
              for node in tree.body
              if isinstance(
                  node,
                  ast.FunctionDef
              )
              and node.name == "settings_menu"
          ]

          if len(settings_functions) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one "
                  "settings_menu function, found "
                  + str(
                      len(settings_functions)
                  )
              )

          settings_function = settings_functions[0]

          return_nodes = [
              node
              for node in settings_function.body
              if isinstance(
                  node,
                  ast.Return
              )
              and isinstance(
                  node.value,
                  ast.Name
              )
              and node.value.id == "markup"
          ]

          if len(return_nodes) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one "
                  "return markup in settings_menu, found "
                  + str(
                      len(return_nodes)
                  )
              )

          return_node = return_nodes[0]

          if settings_function.end_lineno is None:
              raise SystemExit(
                  "ERROR: settings_menu end line "
                  "is unavailable."
              )

          helper_block = r'''
          # ============================================
          # ASTROVIBE COMMERCIAL PROFILE OFFER V2
          # ============================================

          PROFILE_OFFER_BUTTONS = {
              "fr": "✨ Mon Profil AstroVibe",
              "en": "✨ My AstroVibe Profile",
          }

          PROFILE_UNLOCK_BUTTONS = {
              "fr": "✨ Débloquer mon Profil · 390 ⭐",
              "en": "✨ Unlock My Profile · 390 ⭐",
          }


          def personal_profile_offer_text(language):
              if language == "en":
                  return (
                      "✨ YOUR ASTROVIBE PERSONAL PROFILE\n\n"
                      "Your Sun sign is only one part "
                      "of your story. 🌌\n\n"
                      "Discover a personalised astrological "
                      "reading built from your birth information "
                      "and natal chart.\n\n"
                      "🔮 YOUR PROFILE EXPLORES:\n\n"
                      "☀️ Sun\n"
                      "Your identity and self-expression\n\n"
                      "🌙 Moon\n"
                      "Your emotional world and deeper needs\n\n"
                      "☿ Mercury\n"
                      "Your way of thinking and communicating\n\n"
                      "♀ Venus\n"
                      "Your way of loving and your values\n\n"
                      "♂ Mars\n"
                      "Your energy, desires and motivation\n\n"
                      "♃ Jupiter\n"
                      "Your potential for expansion\n\n"
                      "♄ Saturn\n"
                      "Your responsibilities and areas "
                      "of growth\n\n"
                      "♅ Uranus\n"
                      "Your need for freedom and change\n\n"
                      "♆ Neptune\n"
                      "Your imagination and intuition\n\n"
                      "♇ Pluto\n"
                      "Your deeper transformations\n\n"
                      "✨ IF YOUR EXACT BIRTH TIME IS KNOWN:\n\n"
                      "⬆️ Your Ascendant\n"
                      "🏠 Your astrological houses\n"
                      "🪐 The life areas connected "
                      "to your placements\n\n"
                      "🌍 Available in French and English\n\n"
                      "🔓 One-time purchase\n"
                      "💎 No Premium subscription required\n\n"
                      "⭐ LAUNCH PRICE: 390 STARS\n\n"
                      "👇 Unlock your AstroVibe Personal Profile"
                  )

              return (
                  "✨ TON PROFIL ASTROVIBE PERSONNEL\n\n"
                  "Ton signe solaire n’est qu’une partie "
                  "de ton histoire. 🌌\n\n"
                  "Découvre une lecture astrologique "
                  "personnalisée construite à partir de tes "
                  "informations de naissance et de ton "
                  "thème natal.\n\n"
                  "🔮 TON PROFIL EXPLORE :\n\n"
                  "☀️ Soleil\n"
                  "Ton identité et ta manière de t’affirmer\n\n"
                  "🌙 Lune\n"
                  "Ton univers émotionnel et tes besoins "
                  "profonds\n\n"
                  "☿ Mercure\n"
                  "Ta façon de penser et de communiquer\n\n"
                  "♀ Vénus\n"
                  "Ta manière d’aimer et tes valeurs\n\n"
                  "♂ Mars\n"
                  "Ton énergie, tes désirs et ta motivation\n\n"
                  "♃ Jupiter\n"
                  "Ton potentiel d’expansion\n\n"
                  "♄ Saturne\n"
                  "Tes responsabilités et tes zones "
                  "de construction\n\n"
                  "♅ Uranus\n"
                  "Ton besoin de liberté et de changement\n\n"
                  "♆ Neptune\n"
                  "Ton imagination et ton intuition\n\n"
                  "♇ Pluton\n"
                  "Tes transformations profondes\n\n"
                  "✨ SI TON HEURE DE NAISSANCE "
                  "EST CONNUE :\n\n"
                  "⬆️ Ton Ascendant\n"
                  "🏠 Tes maisons astrologiques\n"
                  "🪐 Les domaines de vie associés "
                  "à tes placements\n\n"
                  "🌍 Disponible en français et en anglais\n\n"
                  "🔓 Achat unique\n"
                  "💎 Aucun abonnement Premium nécessaire\n\n"
                  "⭐ PRIX DE LANCEMENT : 390 STARS\n\n"
                  "👇 Débloque ton Profil AstroVibe Personnel"
              )


          def personal_profile_offer_menu(language):
              markup = types.ReplyKeyboardMarkup(
                  resize_keyboard=True
              )

              language_key = (
                  "en"
                  if language == "en"
                  else "fr"
              )

              markup.row(
                  types.KeyboardButton(
                      PROFILE_UNLOCK_BUTTONS[
                          language_key
                      ]
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "back_button"
                      )
                  )
              )

              return markup


          '''

          helper_block = (
              helper_block.replace(
                  "\n          ",
                  "\n"
              ).lstrip()
          )

          settings_button_block = r'''
              markup.row(
                  types.KeyboardButton(
                      PROFILE_OFFER_BUTTONS[
                          "en"
                          if language == "en"
                          else "fr"
                      ]
                  )
              )

          '''

          settings_button_block = (
              settings_button_block.replace(
                  "\n          ",
                  "\n"
              ).lstrip()
          )

          handlers_block = r'''

          # ============================================
          # ASTROVIBE PROFILE OFFER HANDLERS
          # ============================================

          @bot.message_handler(
              func=lambda message: (
                  message.text
                  in PROFILE_OFFER_BUTTONS.values()
              )
          )
          def show_personal_profile_offer(message):
              user_id = message.from_user.id

              language = get_user_language(
                  user_id
              )

              bot.send_message(
                  message.chat.id,
                  personal_profile_offer_text(
                      language
                  ),
                  reply_markup=personal_profile_offer_menu(
                      language
                  )
              )


          @bot.message_handler(
              func=lambda message: (
                  message.text
                  in PROFILE_UNLOCK_BUTTONS.values()
              )
          )
          def personal_profile_payment_preview(message):
              user_id = message.from_user.id

              language = get_user_language(
                  user_id
              )

              if language == "en":
                  preview_text = (
                      "⭐ Telegram Stars payment "
                      "will be available shortly."
                  )
              else:
                  preview_text = (
                      "⭐ Le paiement Telegram Stars "
                      "sera disponible prochainement."
                  )

              bot.send_message(
                  message.chat.id,
                  preview_text,
                  reply_markup=settings_menu(
                      language
                  )
              )


          '''

          handlers_block = (
              handlers_block.replace(
                  "\n          ",
                  "\n"
              ).lstrip()
          )

          lines = source.splitlines(
              keepends=True
          )

          helper_position = (
              settings_function.lineno - 1
          )

          return_position = (
              return_node.lineno - 1
          )

          handlers_position = (
              settings_function.end_lineno
          )

          insertions = [
              (
                  handlers_position,
                  "\n"
                  + handlers_block
              ),
              (
                  return_position,
                  settings_button_block
              ),
              (
                  helper_position,
                  helper_block
                  + "\n"
              ),
          ]

          for position, content in sorted(
              insertions,
              key=lambda item: item[0],
              reverse=True,
          ):
              lines.insert(
                  position,
                  content
              )

          updated = "".join(
              lines
          )

          compile(
              updated,
              "bot.py",
              "exec"
          )

          if marker not in updated:
              raise SystemExit(
                  "ERROR: commercial marker "
                  "was not inserted."
              )

          if updated.count(
              "PROFILE_OFFER_BUTTONS"
          ) < 3:
              raise SystemExit(
                  "ERROR: offer button integration "
                  "is incomplete."
              )

          if updated.count(
              "PROFILE_UNLOCK_BUTTONS"
          ) < 3:
              raise SystemExit(
                  "ERROR: unlock button integration "
                  "is incomplete."
              )

          path.write_text(
              updated,
              encoding="utf-8"
          )

          print(
              "AST commercial offer patch applied."
          )

          print(
              "settings_menu lines:",
              settings_function.lineno,
              "-",
              settings_function.end_lineno
          )

          print(
              "return markup line:",
              return_node.lineno
          )
          PY

      - name: Compile AstroVibe
        run: |
          python -m py_compile bot.py
          python -m py_compile personal_profile_engine.py
          python -m py_compile personal_profile_v2_engine.py
          python -m py_compile natal_chart_engine.py
          python -m py_compile natal_profile_interpreter.py
          python -m py_compile birth_location_engine.py
          git diff --check

      - name: Verify commercial offer
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          expected = (
              "ASTROVIBE COMMERCIAL PROFILE OFFER V2",
              "PROFILE_OFFER_BUTTONS",
              "PROFILE_UNLOCK_BUTTONS",
              "personal_profile_offer_text",
              "personal_profile_offer_menu",
              "ASTROVIBE PROFILE OFFER HANDLERS",
              "show_personal_profile_offer",
              "personal_profile_payment_preview",
              "TON PROFIL ASTROVIBE PERSONNEL",
              "YOUR ASTROVIBE PERSONAL PROFILE",
              "390 STARS",
              "390 ⭐",
          )

          for item in expected:
              if item not in source:
                  raise SystemExit(
                      "ERROR: missing commercial "
                      "element: "
                      + item
                  )

              print(
                  "OK:",
                  item
              )

          tree = ast.parse(
              source,
              filename="bot.py"
          )

          settings_functions = [
              node
              for node in tree.body
              if isinstance(
                  node,
                  ast.FunctionDef
              )
              and node.name == "settings_menu"
          ]

          assert len(
              settings_functions
          ) == 1

          print(
              "COMMERCIAL OFFER VERIFIED"
          )
          PY

      - name: Show bot diff
        run: |
          git diff --check
          git diff -- bot.py

      - name: Commit validated commercial offer
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot.py

          git commit -m "Add Personal Profile commercial offer"

          git push origin HEAD:main
