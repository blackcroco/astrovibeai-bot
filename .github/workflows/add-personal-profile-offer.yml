name: Add Personal Profile Commercial Offer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-profile-offer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch commercial offer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          marker = (
              "# ASTROVIBE COMMERCIAL PROFILE OFFER V1"
          )

          if marker not in source:
              settings_match = re.search(
                  r'(?m)^def\s+settings_menu\s*\(',
                  source,
              )

              if not settings_match:
                  raise SystemExit(
                      "ERROR: settings_menu function "
                      "was not found."
                  )

              helper = r'''
          # ============================================
          # ASTROVIBE COMMERCIAL PROFILE OFFER V1
          # ============================================

          PROFILE_OFFER_BUTTONS = {
              "fr": "✨ Mon Profil AstroVibe",
              "en": "✨ My AstroVibe Profile",
          }

          PROFILE_UNLOCK_BUTTONS = {
              "fr": "✨ Débloquer mon Profil · 390 ⭐",
              "en": "✨ Unlock My Profile · 390 ⭐",
          }


          def personal_profile_offer_text(language):
              if language == "en":
                  return (
                      "✨ YOUR ASTROVIBE PERSONAL PROFILE\n\n"
                      "Your Sun sign is only one part of your story. 🌌\n\n"
                      "Discover a personalised astrological reading built "
                      "from your birth information and natal chart.\n\n"
                      "🔮 YOUR PROFILE EXPLORES:\n\n"
                      "☀️ Sun\n"
                      "Your identity and self-expression\n\n"
                      "🌙 Moon\n"
                      "Your emotional world and deeper needs\n\n"
                      "☿ Mercury\n"
                      "Your way of thinking and communicating\n\n"
                      "♀ Venus\n"
                      "Your way of loving and your values\n\n"
                      "♂ Mars\n"
                      "Your energy, desires and motivation\n\n"
                      "♃ Jupiter\n"
                      "Your potential for expansion\n\n"
                      "♄ Saturn\n"
                      "Your responsibilities and areas of growth\n\n"
                      "♅ Uranus\n"
                      "Your need for freedom and change\n\n"
                      "♆ Neptune\n"
                      "Your imagination and intuition\n\n"
                      "♇ Pluto\n"
                      "Your deeper transformations\n\n"
                      "✨ IF YOUR EXACT BIRTH TIME IS KNOWN:\n\n"
                      "⬆️ Your Ascendant\n"
                      "🏠 Your astrological houses\n"
                      "🪐 The life areas connected to your placements\n\n"
                      "🌍 Available in French and English\n\n"
                      "🔓 One-time purchase\n"
                      "💎 No Premium subscription required\n\n"
                      "⭐ LAUNCH PRICE: 390 STARS\n\n"
                      "👇 Unlock your AstroVibe Personal Profile"
                  )

              return (
                  "✨ TON PROFIL ASTROVIBE PERSONNEL\n\n"
                  "Ton signe solaire n’est qu’une partie "
                  "de ton histoire. 🌌\n\n"
                  "Découvre une lecture astrologique personnalisée "
                  "construite à partir de tes informations de naissance "
                  "et de ton thème natal.\n\n"
                  "🔮 TON PROFIL EXPLORE :\n\n"
                  "☀️ Soleil\n"
                  "Ton identité et ta manière de t’affirmer\n\n"
                  "🌙 Lune\n"
                  "Ton univers émotionnel et tes besoins profonds\n\n"
                  "☿ Mercure\n"
                  "Ta façon de penser et de communiquer\n\n"
                  "♀ Vénus\n"
                  "Ta manière d’aimer et tes valeurs\n\n"
                  "♂ Mars\n"
                  "Ton énergie, tes désirs et ta motivation\n\n"
                  "♃ Jupiter\n"
                  "Ton potentiel d’expansion\n\n"
                  "♄ Saturne\n"
                  "Tes responsabilités et tes zones de construction\n\n"
                  "♅ Uranus\n"
                  "Ton besoin de liberté et de changement\n\n"
                  "♆ Neptune\n"
                  "Ton imagination et ton intuition\n\n"
                  "♇ Pluton\n"
                  "Tes transformations profondes\n\n"
                  "✨ SI TON HEURE DE NAISSANCE EST CONNUE :\n\n"
                  "⬆️ Ton Ascendant\n"
                  "🏠 Tes maisons astrologiques\n"
                  "🪐 Les domaines de vie associés à tes placements\n\n"
                  "🌍 Disponible en français et en anglais\n\n"
                  "🔓 Achat unique\n"
                  "💎 Aucun abonnement Premium nécessaire\n\n"
                  "⭐ PRIX DE LANCEMENT : 390 STARS\n\n"
                  "👇 Débloque ton Profil AstroVibe Personnel"
              )


          def personal_profile_offer_menu(language):
              markup = types.ReplyKeyboardMarkup(
                  resize_keyboard=True
              )

              key = (
                  "en"
                  if language == "en"
                  else "fr"
              )

              markup.row(
                  types.KeyboardButton(
                      PROFILE_UNLOCK_BUTTONS[key]
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "back_button"
                      )
                  )
              )

              return markup


          '''

              helper = (
                  helper.replace(
                      "\n          ",
                      "\n"
                  ).lstrip()
              )

              source = (
                  source[:settings_match.start()]
                  + helper
                  + source[settings_match.start():]
              )

          settings_pattern = re.compile(
              r'(?ms)'
              r'^(?P<head>def\s+settings_menu\s*$$[^\n]*$$:\n)'
              r'(?P<body>.*?)'
              r'^(?P<indent>[ \t]+)return\s+markup\s*$'
          )

          settings_match = settings_pattern.search(
              source
          )

          if not settings_match:
              raise SystemExit(
                  "ERROR: complete settings_menu "
                  "could not be detected."
              )

          body = settings_match.group("body")

          if "PROFILE_OFFER_BUTTONS" not in body:
              back_pattern = re.compile(
                  r'(?ms)'
                  r'^(?P<indent>[ \t]+)'
                  r'markup\.row\(\n'
                  r'.*?'
                  r'"back_button"'
                  r'.*?'
                  r'^(?P=indent)\)\n'
              )

              back_match = back_pattern.search(
                  body
              )

              if not back_match:
                  raise SystemExit(
                      "ERROR: Back row was not found "
                      "inside settings_menu."
                  )

              indent = back_match.group(
                  "indent"
              )

              new_row = "\n".join(
                  [
                      indent + "markup.row(",
                      indent + "    types.KeyboardButton(",
                      indent + "        PROFILE_OFFER_BUTTONS[",
                      indent + '            "en"',
                      indent + '            if language == "en"',
                      indent + '            else "fr"',
                      indent + "        ]",
                      indent + "    )",
                      indent + ")",
                      "",
                  ]
              )

              body = (
                  body[:back_match.start()]
                  + new_row
                  + body[back_match.start():]
              )

              source = (
                  source[:settings_match.start("body")]
                  + body
                  + source[settings_match.end("body"):]
              )

          handler_marker = (
              "# ASTROVIBE PROFILE OFFER MESSAGE HANDLER"
          )

          if handler_marker not in source:
              handler = r'''

          # ============================================
          # ASTROVIBE PROFILE OFFER MESSAGE HANDLER
          # ============================================

          @bot.message_handler(
              func=lambda message: (
                  message.text
                  in PROFILE_OFFER_BUTTONS.values()
              )
          )
          def show_personal_profile_offer(message):
              create_or_update_user(message)

              user_id = message.from_user.id
              language = get_user_language(user_id)

              bot.send_message(
                  message.chat.id,
                  personal_profile_offer_text(
                      language
                  ),
                  reply_markup=personal_profile_offer_menu(
                      language
                  )
              )


          @bot.message_handler(
              func=lambda message: (
                  message.text
                  in PROFILE_UNLOCK_BUTTONS.values()
              )
          )
          def personal_profile_payment_preview(message):
              create_or_update_user(message)

              user_id = message.from_user.id
              language = get_user_language(user_id)

              if language == "en":
                  text = (
                      "⭐ Telegram Stars payment "
                      "will be available shortly."
                  )
              else:
                  text = (
                      "⭐ Le paiement Telegram Stars "
                      "sera disponible prochainement."
                  )

              bot.send_message(
                  message.chat.id,
                  text,
                  reply_markup=settings_menu(
                      language
                  )
              )


          '''

              handler = (
                  handler.replace(
                      "\n          ",
                      "\n"
                  ).lstrip()
              )

              source = (
                  source.rstrip()
                  + "\n\n"
                  + handler
              )

          compile(
              source,
              "bot.py",
              "exec"
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Commercial offer patch applied."
          )
          PY

      - name: Compile AstroVibe
        run: |
          python -m py_compile bot.py
          python -m py_compile personal_profile_engine.py
          python -m py_compile personal_profile_v2_engine.py
          python -m py_compile natal_chart_engine.py
          python -m py_compile natal_profile_interpreter.py
          python -m py_compile birth_location_engine.py
          git diff --check

      - name: Verify commercial offer
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          required = (
              "ASTROVIBE COMMERCIAL PROFILE OFFER V1",
              "PROFILE_OFFER_BUTTONS",
              "PROFILE_UNLOCK_BUTTONS",
              "personal_profile_offer_text",
              "personal_profile_offer_menu",
              "ASTROVIBE PROFILE OFFER MESSAGE HANDLER",
              "TON PROFIL ASTROVIBE PERSONNEL",
              "YOUR ASTROVIBE PERSONAL PROFILE",
              "390 STARS",
              "390 ⭐",
          )

          for item in required:
              if item not in source:
                  raise SystemExit(
                      "ERROR: missing: "
                      + item
                  )

              print(
                  "OK:",
                  item
              )

          print(
              "COMMERCIAL OFFER VERIFIED"
          )
          PY

      - name: Show bot diff
        run: |
          git diff --check
          git diff -- bot.py

      - name: Commit validated commercial offer
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot.py

          git commit -m "Add Personal Profile commercial offer"

          git push origin HEAD:main
