name: Build AstroVibe Personal Profile V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-profile-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Personal Profile V2 engine
        run: |
          cat > personal_profile_v2_engine.py <<'PY'
          # ============================================
          # ASTROVIBE - PERSONAL PROFILE V2 ENGINE
          # Profil qualitatif V1 + thème natal réel
          # ============================================

          from personal_profile_engine import (
              generate_personal_profile as generate_personal_profile_v1,
          )

          from natal_chart_engine import (
              calculate_natal_chart,
          )

          from natal_profile_interpreter import (
              interpret_natal_chart,
              format_natal_interpretation,
          )


          def generate_personal_profile_v2(
              sign,
              language="fr",
              birth_date=None,
              birth_time=None,
              birth_time_known=None,
              birth_place=None,
              birth_timezone=None,
              birth_latitude=None,
              birth_longitude=None,
          ):
              language = (
                  language
                  if language in ("fr", "en")
                  else "fr"
              )

              base_profile = generate_personal_profile_v1(
                  sign=sign,
                  language=language,
                  birth_date=birth_date,
                  birth_time=birth_time,
                  birth_time_known=birth_time_known,
                  birth_place=birth_place,
              )

              natal_data_available = (
                  birth_date is not None
                  and bool(birth_place)
                  and bool(birth_timezone)
                  and birth_latitude is not None
                  and birth_longitude is not None
              )

              if not natal_data_available:
                  return base_profile

              try:
                  natal_chart = calculate_natal_chart(
                      birth_date=birth_date,
                      birth_time=birth_time,
                      birth_time_known=birth_time_known,
                      birth_place=birth_place,
                      birth_timezone=birth_timezone,
                      birth_latitude=birth_latitude,
                      birth_longitude=birth_longitude,
                  )

                  if not natal_chart.get("calculated"):
                      return base_profile

                  natal_interpretation = interpret_natal_chart(
                      natal_chart,
                      language=language,
                  )

                  if not natal_interpretation.get("available"):
                      return base_profile

                  natal_text = format_natal_interpretation(
                      natal_interpretation,
                      language=language,
                  )

                  if not natal_text:
                      return base_profile

                  if language == "en":
                      separator_title = (
                          "🌌 YOUR PERSONAL NATAL CHART"
                      )
                  else:
                      separator_title = (
                          "🌌 TON THÈME NATAL PERSONNALISÉ"
                      )

                  return (
                      base_profile
                      + "\n\n"
                      + separator_title
                      + "\n\n"
                      + natal_text
                  )

              except Exception as error:
                  print(
                      "AstroVibe natal profile fallback:",
                      type(error).__name__,
                      str(error),
                  )

                  return base_profile
          PY

      - name: Compile all engines
        run: |
          python -m py_compile personal_profile_v2_engine.py
          python -m py_compile personal_profile_engine.py
          python -m py_compile natal_chart_engine.py
          python -m py_compile natal_profile_interpreter.py
          python -m py_compile birth_location_engine.py
          git diff --check

      - name: Test French V2 exact time
        run: |
          python - <<'PY'
          from datetime import date, time

          from personal_profile_v2_engine import (
              generate_personal_profile_v2,
          )

          profile = generate_personal_profile_v2(
              sign="leo",
              language="fr",
              birth_date=date(2000, 8, 15),
              birth_time=time(14, 35),
              birth_time_known=True,
              birth_place="Vannes, FR",
              birth_timezone="Europe/Paris",
              birth_latitude=47.65688,
              birth_longitude=-2.76205,
          )

          assert profile
          assert "PROFIL ASTROVIBE PERSONNEL" in profile
          assert "TON THÈME NATAL PERSONNALISÉ" in profile
          assert "PROFIL NATAL ASTROVIBE" in profile

          assert "Soleil" in profile
          assert "Lune" in profile
          assert "Mercure" in profile
          assert "Vénus" in profile
          assert "Mars" in profile
          assert "Jupiter" in profile
          assert "Saturne" in profile
          assert "Uranus" in profile
          assert "Neptune" in profile
          assert "Pluton" in profile
          assert "Ascendant" in profile

          print("French V2 length:", len(profile))
          print("FRENCH V2 TEST PASSED")
          PY

      - name: Test English V2 exact time
        run: |
          python - <<'PY'
          from datetime import date, time

          from personal_profile_v2_engine import (
              generate_personal_profile_v2,
          )

          profile = generate_personal_profile_v2(
              sign="leo",
              language="en",
              birth_date=date(2000, 8, 15),
              birth_time=time(14, 35),
              birth_time_known=True,
              birth_place="Vannes, FR",
              birth_timezone="Europe/Paris",
              birth_latitude=47.65688,
              birth_longitude=-2.76205,
          )

          assert profile
          assert "ASTROVIBE PERSONAL PROFILE" in profile
          assert "YOUR PERSONAL NATAL CHART" in profile
          assert "ASTROVIBE NATAL PROFILE" in profile

          assert "Sun" in profile
          assert "Moon" in profile
          assert "Mercury" in profile
          assert "Venus" in profile
          assert "Mars" in profile
          assert "Jupiter" in profile
          assert "Saturn" in profile
          assert "Uranus" in profile
          assert "Neptune" in profile
          assert "Pluto" in profile
          assert "Ascendant" in profile

          print("English V2 length:", len(profile))
          print("ENGLISH V2 TEST PASSED")
          PY

      - name: Test V2 unknown birth time
        run: |
          python - <<'PY'
          from datetime import date

          from personal_profile_v2_engine import (
              generate_personal_profile_v2,
          )

          profile = generate_personal_profile_v2(
              sign="leo",
              language="fr",
              birth_date=date(2000, 8, 15),
              birth_time=None,
              birth_time_known=False,
              birth_place="Vannes, FR",
              birth_timezone="Europe/Paris",
              birth_latitude=47.65688,
              birth_longitude=-2.76205,
          )

          assert profile

          assert "TON THÈME NATAL PERSONNALISÉ" in profile
          assert "PROFIL NATAL ASTROVIBE" in profile

          assert "Soleil" in profile
          assert "Lune" in profile

          assert (
              "Ascendant — Expression extérieure"
              not in profile
          )

          print("Unknown-time V2 length:", len(profile))
          print("UNKNOWN TIME V2 TEST PASSED")
          PY

      - name: Test V1 fallback
        run: |
          python - <<'PY'
          from personal_profile_v2_engine import (
              generate_personal_profile_v2,
          )

          profile = generate_personal_profile_v2(
              sign="leo",
              language="fr",
          )

          assert profile
          assert "PROFIL ASTROVIBE PERSONNEL" in profile

          assert (
              "TON THÈME NATAL PERSONNALISÉ"
              not in profile
          )

          print("Fallback length:", len(profile))
          print("V1 FALLBACK TEST PASSED")
          PY

      - name: Commit validated V2 engine
        run: |
          git diff --check

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add personal_profile_v2_engine.py

          git commit -m "Add AstroVibe Personal Profile V2 engine"

          git push origin HEAD:main
