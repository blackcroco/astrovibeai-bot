      - name: Test simulated transactional reward
        run: |
          python - <<'PY'
          from referral_engine import (
              finalize_pending_referral,
          )


          class FakeCursor:
              def __init__(self):
                  self.fetches = [
                      (
                          77,
                          111,
                          222,
                          50,
                          20,
                          "pending",
                      ),
                      [
                          (
                              111,
                              100,
                              1,
                              "Aries",
                          ),
                          (
                              222,
                              10,
                              1,
                              "Leo",
                          ),
                      ],
                  ]
                  self.calls = []
                  self.rowcount = 1

              def execute(
                  self,
                  query,
                  params=None,
              ):
                  self.calls.append(
                      (
                          query,
                          params,
                      )
                  )

                  if (
                      "UPDATE referrals"
                      in query
                  ):
                      self.rowcount = 1

              def fetchone(self):
                  return self.fetches.pop(0)

              def fetchall(self):
                  return self.fetches.pop(0)

              def close(self):
                  pass


          class FakeConnection:
              def __init__(self):
                  self.cursor_instance = (
                      FakeCursor()
                  )
                  self.committed = False
                  self.rolled_back = False

              def cursor(self):
                  return self.cursor_instance

              def commit(self):
                  self.committed = True

              def rollback(self):
                  self.rolled_back = True

              def close(self):
                  pass


          connection = FakeConnection()

          def fake_level(points):
              if points >= 100:
                  return 2

              return 1


          result = finalize_pending_referral(
              lambda: connection,
              referred_user_id=222,
              calculate_level=fake_level,
          )

          assert result["success"] is True
