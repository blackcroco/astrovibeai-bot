          assert connection.rolled_back is False

          queries = [
              call[0]
              for call
              in connection
              .cursor_instance
              .calls
          ]

          assert any(
              "FROM referrals" in query
              and "FOR UPDATE" in query
              for query in queries
          )

          assert any(
              "FROM users" in query
              and "FOR UPDATE" in query
              for query in queries
          )

