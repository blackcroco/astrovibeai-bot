          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = set()

          for line in result.stdout.splitlines():
              if not line.strip():
                  continue

              path = line[3:].strip()

              changed.add(path)

          expected = {
              "bot.py",
              "referral_engine.py",
          }

          assert changed == expected, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print(
              "ONLY EXPECTED FILES CHANGED:",
              sorted(changed),
          )
