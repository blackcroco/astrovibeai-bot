              ):
                  pass

              def fetchone(self):
                  return self.fetches.pop(0)

              def fetchall(self):
                  return self.fetches.pop(0)

              def close(self):
                  pass


          class FakeConnection:
              def __init__(self):
                  self.rolled_back = False

              def cursor(self):
                  return FakeCursor()

              def commit(self):
                  raise AssertionError(
                      "Incomplete registration "
                      "must not commit"
                  )

              def rollback(self):
                  self.rolled_back = True

              def close(self):
                  pass


          connection = FakeConnection()

          result = finalize_pending_referral(
              lambda: connection,
              referred_user_id=222,
              calculate_level=lambda points: 1,
