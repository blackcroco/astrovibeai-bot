name: Connect Tested Stars Handlers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-stars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate current production
        run: |
          python -m py_compile bot.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py

      - name: Build connection script
        run: |
          cat > /tmp/connect_stars.py <<'PY'
          from pathlib import Path
          import ast

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          marker = "# TESTED STARS HANDLERS CONNECTION"

          if marker in source:
              compile(source, "bot.py", "exec")
              print("Already connected.")
              raise SystemExit(0)

          tree = ast.parse(
              source,
              filename="bot.py",
          )

          callbacks = [
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name
              == "handle_profile_unlock_preview"
          ]

          if len(callbacks) != 1:
              raise SystemExit(
                  "Expected one unlock callback; found "
                  + str(len(callbacks))
              )

          callback = callbacks[0]

          body_start = callback.body[0].lineno - 1
          body_end = callback.end_lineno

          body = [
              "    language = get_user_language(",
              "        call.from_user.id",
              "    )",
              "",
              "    from profile_stars_handlers import (",
              "        send_profile_invoice,",
              "    )",
              "",
              "    send_profile_invoice(",
              "        bot,",
              "        call,",
              "        language,",
              "    )",
          ]

          lines = source.splitlines(
              keepends=True
          )

          lines[
              body_start:body_end
          ] = [
              "\n".join(body) + "\n"
          ]

          updated = "".join(lines)

          init_marker = "# INITIALISATION"

          if init_marker not in updated:
              raise SystemExit(
                  "INITIALISATION marker missing."
              )

          handlers = [
              "",
              "# ============================================",
              "# TESTED STARS HANDLERS CONNECTION",
              "# ============================================",
              "",
              "@bot.pre_checkout_query_handler(",
              "    func=lambda query: (",
              "        isinstance(",
              "            query.invoice_payload,",
              "            str",
              "        )",
              "        and query.invoice_payload.startswith(",
              '            "astrovibe_profile_v2:"',
              "        )",
              "    )",
              ")",
              "def astro_profile_pre_checkout(query):",
              "    from profile_stars_handlers import (",
              "        process_profile_pre_checkout,",
              "    )",
              "",
              "    process_profile_pre_checkout(",
              "        bot,",
              "        query,",
              "    )",
              "",
              "",
              "@bot.message_handler(",
              '    content_types=["successful_payment"]',
              ")",
              "def astro_profile_successful_payment(message):",
              "    payment = message.successful_payment",
              "",
              "    if not isinstance(",
              "        payment.invoice_payload,",
              "        str,",
              "    ):",
              "        return",
              "",
              "    if not payment.invoice_payload.startswith(",
              '        "astrovibe_profile_v2:"',
              "    ):",
              "        return",
              "",
              "    language = get_user_language(",
              "        message.from_user.id",
              "    )",
              "",
              "    from profile_stars_handlers import (",
              "        process_profile_successful_payment,",
              "    )",
              "",
              "    process_profile_successful_payment(",
              "        bot,",
              "        message,",
              "        language,",
              "    )",
              "",
              "",
          ]

          updated = updated.replace(
              init_marker,
              "\n".join(handlers)
              + init_marker,
              1,
          )

          compile(
              updated,
              "bot.py",
              "exec",
          )

          required = (
              marker,
              "send_profile_invoice",
              "process_profile_pre_checkout",
              "process_profile_successful_payment",
              '"successful_payment"',
          )

          for item in required:
              if item not in updated:
                  raise SystemExit(
                      "Missing connection: "
                      + item
                  )

          path.write_text(
              updated,
              encoding="utf-8",
          )

          print("Tested Stars handlers connected.")
          PY

      - name: Apply minimal connection
        run: |
          python /tmp/connect_stars.py

      - name: Compile patched project
        run: |
          python -m py_compile bot.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile personal_profile_v2_engine.py
          git diff --check

      - name: Verify payment connection
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          ast.parse(source)

          required = (
              "TESTED STARS HANDLERS CONNECTION",
              "send_profile_invoice",
              "process_profile_pre_checkout",
              "process_profile_successful_payment",
          )

          for item in required:
              assert item in source
              print("OK:", item)

          print("PAYMENT CONNECTION VERIFIED")
          PY

      - name: Verify 390 XTR
        run: |
          python - <<'PY'
          from profile_stars_payment import (
              build_profile_invoice,
          )

          invoice = build_profile_invoice(
              123456789,
              "fr",
          )

          assert invoice["currency"] == "XTR"
          assert invoice["prices"][0]["amount"] == 390

          print("390 XTR VERIFIED")
          PY

      - name: Commit validated connection
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Connect tested Stars payment handlers"
          git push origin HEAD:main
