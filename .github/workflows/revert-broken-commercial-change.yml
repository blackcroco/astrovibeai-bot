name: Revert Broken Commercial Change

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-working-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore bot.py before broken commit
        run: |
          git checkout eda0167^ -- bot.py

      - name: Validate restored bot.py
        run: |
          python -m py_compile bot.py
          echo "bot.py syntax is valid"

      - name: Show restored changes
        run: |
          git status --short
          git diff --check
          git diff -- bot.py

      - name: Commit restored bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py restoration was required."
            exit 0
          fi

          git commit -m "Restore bot.py before broken commercial change"
          git push origin HEAD:main
