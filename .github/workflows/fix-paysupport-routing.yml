name: Fix Payment Support Routing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-paysupport-routing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f paysupport_engine.py
          test -f paysupport_flow.py
          test -f terms_engine.py
          echo "REQUIRED FILES OK"

      - name: Create AST routing fix
        run: |
          cat > /tmp/fix_routing.py <<'PY'
          import ast
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(
              encoding="utf-8"
          )

          tree = ast.parse(source)

          menu_function = None

          for node in tree.body:
              if (
                  isinstance(node, ast.FunctionDef)
                  and node.name == "menu"
              ):
                  menu_function = node
                  break

          if menu_function is None:
              raise RuntimeError(
                  "menu(message) not found"
              )

          support_if = None
          terms_if = None

          for node in ast.walk(
              menu_function
          ):
              if not isinstance(node, ast.If):
                  continue

              test_source = ast.get_source_segment(
                  source,
                  node.test,
              )

              if not test_source:
                  continue

              compact = "".join(
                  test_source.split()
              )

              if (
                  'command_name=="/paysupport"'
                  in compact
              ):
                  support_if = node

              if (
                  'command_name=="/terms"'
                  in compact
              ):
                  terms_if = node

          if support_if is None:
              raise RuntimeError(
                  "Paysupport condition not found"
              )

          if terms_if is None:
              raise RuntimeError(
                  "Terms condition not found"
              )

          lines = source.splitlines(
              keepends=True
          )

          support_start = (
              support_if.lineno - 1
          )

          if (
              support_start > 0
              and
              "ASTROVIBE PAYSUPPORT ROUTING"
              in lines[support_start - 1]
          ):
              support_start -= 1

          support_end = (
              support_if.end_lineno
          )

          support_lines = lines[
              support_start:support_end
          ]

          del lines[
              support_start:support_end
          ]

          updated_source = "".join(
              lines
          )

          updated_tree = ast.parse(
              updated_source
          )

          updated_menu = None

          for node in updated_tree.body:
              if (
                  isinstance(node, ast.FunctionDef)
                  and node.name == "menu"
              ):
                  updated_menu = node
                  break

          updated_terms = None

          for node in ast.walk(
              updated_menu
          ):
              if not isinstance(node, ast.If):
                  continue

              test_source = ast.get_source_segment(
                  updated_source,
                  node.test,
              )

              if not test_source:
                  continue

              compact = "".join(
                  test_source.split()
              )

              if (
                  'command_name=="/terms"'
                  in compact
              ):
                  updated_terms = node
                  break

          if updated_terms is None:
              raise RuntimeError(
                  "Terms condition disappeared "
                  "after support extraction"
              )

          insertion_index = (
              updated_terms.lineno - 1
          )

          lines[
              insertion_index:
              insertion_index
          ] = support_lines

          fixed_source = "".join(
              lines
          )

          ast.parse(fixed_source)

          path.write_text(
              fixed_source,
              encoding="utf-8",
          )

          print(
              "PAYSUPPORT ROUTING MOVED "
              "BEFORE TERMS"
          )
          PY

      - name: Validate fix script
        run: |
          python -m py_compile /tmp/fix_routing.py

      - name: Apply routing fix
        run: |
          python /tmp/fix_routing.py

      - name: Compile complete stack
        run: |
          python -m py_compile bot.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_flow.py
          python -m py_compile terms_engine.py
          python -m py_compile premium_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py

      - name: Verify routing order with AST
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          tree = ast.parse(source)

          menu = next(
              node
              for node in tree.body
              if (
                  isinstance(
                      node,
                      ast.FunctionDef,
                  )
                  and node.name == "menu"
              )
          )

          command_line = None
          support_line = None
          terms_line = None

          for node in ast.walk(menu):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if (
                          isinstance(
                              target,
                              ast.Name,
                          )
                          and target.id
                          == "command_name"
                      ):
                          if (
                              command_line is None
                          ):
                              command_line = (
                                  node.lineno
                              )

              if isinstance(node, ast.If):
                  test_source = (
                      ast.get_source_segment(
                          source,
                          node.test,
                      )
                  )

                  if not test_source:
                      continue

                  compact = "".join(
                      test_source.split()
                  )

                  if (
                      'command_name=="/paysupport"'
                      in compact
                  ):
                      support_line = node.lineno

                  if (
                      'command_name=="/terms"'
                      in compact
                  ):
                      terms_line = node.lineno

          assert command_line is not None
          assert support_line is not None
          assert terms_line is not None

          assert (
              command_line
              < support_line
              < terms_line
          ), (
              "Incorrect command order: "
              f"{command_line}, "
              f"{support_line}, "
              f"{terms_line}"
          )

          assert source.count(
              'command_name == "/paysupport"'
          ) == 1

          print("ROUTING ORDER OK")
          print(
              "command_name:",
              command_line,
          )
          print(
              "paysupport:",
              support_line,
          )
          print(
              "terms:",
              terms_line,
          )
          PY

      - name: Verify support integration
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "ASTROVIBE PAYSUPPORT ROUTING",
              'command_name == "/paysupport"',
              "ASTROVIBE PAYSUPPORT CALLBACK",
              "handle_paysupport_category",
              "register_next_step_handler",
              "create_paysupport_ticket",
              "create_support_ticket",
              "get_ticket_created_text",
              "get_db_connection",
          )

          for marker in required:
              assert marker in source, marker
              print("SUPPORT OK:", marker)
          PY

      - name: Verify Terms Profile Premium
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              'command_name == "/terms"',
              "ASTROVIBE TERMS COMMAND",
              "astrovibe_profile_v2:",
              "process_successful_profile_purchase",
              "send_personal_profile",
              "astrovibe_premium:",
              "createInvoiceLink",
              "process_successful_premium_payment",
          )

          for marker in required:
              assert marker in source, marker
              print("PRESERVED:", marker)
          PY

      - name: Remove Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {"bot.py"}, (
              "Unexpected files: "
              + repr(sorted(changed))
          )

          print("ONLY BOT.PY CHANGED")
          PY

      - name: Show routing change
        run: |
          git diff -- bot.py

      - name: Commit routing fix
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py change."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Fix payment support command routing"
          git push
