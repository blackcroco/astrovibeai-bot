name: Test AstroVibe Notifications

on:
  workflow_dispatch:

jobs:
  test-notifications:
    runs-on: ubuntu-latest

    steps:
            - name: Trigger AstroVibe notifications
        env:
          NOTIFICATION_SECRET: ${{ secrets.NOTIFICATION_SECRET }}
        run: |
          curl --fail-with-body \
            -H "X-Notification-Secret: ${NOTIFICATION_SECRET}" \
            "https://astrovibeai-bot.onrender.com/notifications/run"
