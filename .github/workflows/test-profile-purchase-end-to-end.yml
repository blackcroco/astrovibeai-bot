name: Test Profile Purchase End To End

on:
  workflow_dispatch:

jobs:
  test-profile-purchase-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile AstroVibe payment stack
        run: |
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py
          python -m py_compile personal_profile_v2_engine.py
          python -m py_compile bot.py

      - name: Test invoice to successful payment flow
        run: |
          python - <<'PY'
          from types import SimpleNamespace

          from profile_stars_payment import (
              build_profile_invoice,
              validate_profile_pre_checkout,
              validate_profile_successful_payment,
          )

          user_id = 123456789

          invoice = build_profile_invoice(
              user_id=user_id,
              language="fr",
          )

          assert invoice["currency"] == "XTR"

          assert (
              invoice["prices"][0]["amount"]
              == 390
          )

          assert invoice["payload"] == (
              "astrovibe_profile_v2:"
              "123456789"
          )

          print("INVOICE OK")

          checkout = (
              validate_profile_pre_checkout(
                  payload=invoice["payload"],
                  currency="XTR",
                  total_amount=390,
                  telegram_user_id=user_id,
              )
          )

          assert checkout["valid"] is True

          print("PRE-CHECKOUT OK")

          payment = (
              validate_profile_successful_payment(
                  payload=invoice["payload"],
                  currency="XTR",
                  total_amount=390,
                  telegram_payment_charge_id=(
                      "TEST_CHARGE_ASTROVIBE_001"
                  ),
                  telegram_user_id=user_id,
              )
          )

          assert payment["valid"] is True

          assert payment["user_id"] == user_id

          assert payment["amount"] == 390

          assert payment["currency"] == "XTR"

          assert (
              payment[
                  "telegram_payment_charge_id"
              ]
              == "TEST_CHARGE_ASTROVIBE_001"
          )

          print("SUCCESSFUL PAYMENT OK")
          print("PAYMENT FLOW PASSED")
          PY

      - name: Test invalid payment protection
        run: |
          python - <<'PY'
          from profile_stars_payment import (
              validate_profile_pre_checkout,
          )

          payload = (
              "astrovibe_profile_v2:"
              "123456789"
          )

          wrong_amount = (
              validate_profile_pre_checkout(
                  payload=payload,
                  currency="XTR",
                  total_amount=391,
                  telegram_user_id=123456789,
              )
          )

          assert (
              wrong_amount["valid"]
              is False
          )

          wrong_currency = (
              validate_profile_pre_checkout(
                  payload=payload,
                  currency="USD",
                  total_amount=390,
                  telegram_user_id=123456789,
              )
          )

          assert (
              wrong_currency["valid"]
              is False
          )

          wrong_user = (
              validate_profile_pre_checkout(
                  payload=payload,
                  currency="XTR",
                  total_amount=390,
                  telegram_user_id=999999999,
              )
          )

          assert (
              wrong_user["valid"]
              is False
          )

          print("INVALID PAYMENTS REJECTED")
          PY

      - name: Test purchase ownership simulation
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          from profile_purchase_engine import (
              PROFILE_PRODUCT_ID,
              PROFILE_PRICE_STARS,
              PROFILE_CURRENCY,
          )

          purchases = []

          def has_purchase(user_id):
              return any(
                  purchase["user_id"]
                  == user_id
                  and purchase["product_id"]
                  == PROFILE_PRODUCT_ID
                  for purchase in purchases
              )

          def record_purchase(
              user_id,
              charge_id,
          ):
              if has_purchase(user_id):
                  return False

              if any(
                  purchase["charge_id"]
                  == charge_id
                  for purchase in purchases
              ):
                  return False

              purchases.append(
                  {
                      "user_id": user_id,
                      "product_id": (
                          PROFILE_PRODUCT_ID
                      ),
                      "amount": (
                          PROFILE_PRICE_STARS
                      ),
                      "currency": (
                          PROFILE_CURRENCY
                      ),
                      "charge_id": charge_id,
                      "purchased_at": (
                          datetime.now(
                              timezone.utc
                          )
                      ),
                  }
              )

              return True

          user_id = 123456789

          assert (
              has_purchase(user_id)
              is False
          )

          print("USER NOT OWNER")

          first_purchase = record_purchase(
              user_id,
              "TEST_CHARGE_001",
          )

          assert first_purchase is True

          assert has_purchase(
              user_id
          ) is True

          print("USER IS NOW OWNER")

          second_purchase = record_purchase(
              user_id,
              "TEST_CHARGE_002",
          )

          assert second_purchase is False

          duplicate_charge = record_purchase(
              999999999,
              "TEST_CHARGE_001",
          )

          assert duplicate_charge is False

          assert len(purchases) == 1

          print("DOUBLE PURCHASE REJECTED")
          print("DUPLICATE CHARGE REJECTED")
          print("OWNERSHIP FLOW PASSED")
          PY

      - name: Verify production wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          bot_source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          required = (
              "has_purchased_profile",
              "record_profile_purchase",
              "process_successful_profile_purchase",
              "send_personal_profile(",
              "get_db_connection",
          )

          for marker in required:
              assert marker in bot_source, marker
              print("OK:", marker)

          print(
              "PRODUCTION WIRING VERIFIED"
          )
          PY

      - name: Final zero-cost validation
        run: |
          echo "======================================"
          echo "ASTROVIBE PROFILE PURCHASE TEST PASSED"
          echo "======================================"
          echo "Invoice: 390 XTR"
          echo "Successful payment simulation: OK"
          echo "Permanent ownership simulation: OK"
          echo "Double purchase protection: OK"
          echo "Duplicate charge protection: OK"
          echo "Real Stars spent: 0"
