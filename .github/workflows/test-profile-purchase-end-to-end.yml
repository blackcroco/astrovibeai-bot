      - name: Verify production wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          bot_source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          delivery_source = Path(
              "profile_purchase_delivery.py"
          ).read_text(
              encoding="utf-8"
          )

          engine_source = Path(
              "profile_purchase_engine.py"
          ).read_text(
              encoding="utf-8"
          )

          bot_required = (
              "has_purchased_profile",
              "process_successful_profile_purchase",
              "send_personal_profile(",
              "get_db_connection",
          )

          for marker in bot_required:
              assert marker in bot_source, marker
              print(
                  "BOT OK:",
                  marker
              )

          delivery_required = (
              "record_profile_purchase",
              "process_successful_profile_purchase",
          )

          for marker in delivery_required:
              assert marker in delivery_source, marker
              print(
                  "DELIVERY OK:",
                  marker
              )

          engine_required = (
              "record_profile_purchase",
              "has_purchased_profile",
              "ON CONFLICT DO NOTHING",
          )

          for marker in engine_required:
              assert marker in engine_source, marker
              print(
                  "ENGINE OK:",
                  marker
              )

          print(
              "PRODUCTION WIRING VERIFIED"
          )
          PY
