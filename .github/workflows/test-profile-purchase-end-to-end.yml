name: Test Profile Purchase End To End

on:
  workflow_dispatch:

jobs:
  test-profile-purchase-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile payment stack
        run: python -m py_compile profile_stars_payment.py profile_stars_handlers.py profile_purchase_engine.py profile_purchase_delivery.py personal_profile_v2_engine.py bot.py

      - name: Test invoice flow
        run: python -c "from profile_stars_payment import build_profile_invoice; x=build_profile_invoice(user_id=123456789, language='fr'); assert x['currency']=='XTR'; assert x['prices'][0]['amount']==390; assert x['payload']=='astrovibe_profile_v2:123456789'; print('INVOICE OK')"

      - name: Test pre checkout
        run: python -c "from profile_stars_payment import validate_profile_pre_checkout; x=validate_profile_pre_checkout(payload='astrovibe_profile_v2:123456789', currency='XTR', total_amount=390, telegram_user_id=123456789); assert x['valid'] is True; print('PRE-CHECKOUT OK')"

      - name: Test successful payment
        run: python -c "from profile_stars_payment import validate_profile_successful_payment; x=validate_profile_successful_payment(payload='astrovibe_profile_v2:123456789', currency='XTR', total_amount=390, telegram_payment_charge_id='TEST_CHARGE_ASTROVIBE_001', telegram_user_id=123456789); assert x['valid'] is True; assert x['user_id']==123456789; assert x['amount']==390; assert x['currency']=='XTR'; print('SUCCESSFUL PAYMENT OK')"

      - name: Test wrong amount protection
        run: python -c "from profile_stars_payment import validate_profile_pre_checkout; x=validate_profile_pre_checkout(payload='astrovibe_profile_v2:123456789', currency='XTR', total_amount=391, telegram_user_id=123456789); assert x['valid'] is False; print('WRONG AMOUNT REJECTED')"

      - name: Test wrong currency protection
        run: python -c "from profile_stars_payment import validate_profile_pre_checkout; x=validate_profile_pre_checkout(payload='astrovibe_profile_v2:123456789', currency='USD', total_amount=390, telegram_user_id=123456789); assert x['valid'] is False; print('WRONG CURRENCY REJECTED')"

      - name: Test wrong user protection
        run: python -c "from profile_stars_payment import validate_profile_pre_checkout; x=validate_profile_pre_checkout(payload='astrovibe_profile_v2:123456789', currency='XTR', total_amount=390, telegram_user_id=999999999); assert x['valid'] is False; print('WRONG USER REJECTED')"

      - name: Verify bot wiring
        run: python -c "from pathlib import Path; s=Path('bot.py').read_text(encoding='utf-8'); assert 'process_successful_profile_purchase' in s; print('BOT WIRING OK')"

      - name: Verify delivery wiring
        run: python -c "from pathlib import Path; s=Path('profile_purchase_delivery.py').read_text(encoding='utf-8'); assert 'record_profile_purchase' in s; print('DELIVERY WIRING OK')"

      - name: Verify purchase engine
        run: python -c "from pathlib import Path; s=Path('profile_purchase_engine.py').read_text(encoding='utf-8'); assert 'record_profile_purchase' in s; print('PURCHASE ENGINE OK')"

      - name: Final validation
        run: echo "ASTROVIBE PROFILE PURCHASE TEST PASSED - 390 XTR - REAL STARS SPENT 0"
