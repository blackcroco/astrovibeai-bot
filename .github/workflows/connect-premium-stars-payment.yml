name: Connect Premium Stars Payment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-premium-stars-payment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required files
        run: |
          test -f bot.py
          test -f premium_engine.py
          test -f premium_subscription_engine.py
          test -f premium_stars_payment.py
          test -f premium_stars_handlers.py
          test -f profile_stars_payment.py
          test -f profile_stars_handlers.py
          test -f profile_purchase_engine.py
          test -f profile_purchase_delivery.py
          echo "REQUIRED FILES OK"

      - name: Create Premium connection patch
        run: |
          cat > /tmp/connect_premium.py <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          connection_marker = (
              "# PREMIUM STARS PAYMENT CONNECTION"
          )

          invoice_marker = (
              "# PREMIUM STARS INVOICE ENTRY"
          )

          if connection_marker in source:
              raise RuntimeError(
                  "Premium connection already exists"
              )

          if invoice_marker in source:
              raise RuntimeError(
                  "Premium invoice entry already exists"
              )

          required = (
              "premium_subscription_buttons",
              "premium_active = is_premium(user_id)",
              "def handle_profile_successful_payment",
              "payment = message.successful_payment",
              "def astro_profile_successful_payment",
              "process_successful_profile_purchase",
              "send_personal_profile",
              "def is_premium",
              '"astrovibe_profile_v2:"',
          )

          for marker in required:
              if marker not in source:
                  raise RuntimeError(
                      "Missing bot.py marker: "
                      + marker
                  )

          subscription_anchor = (
              "elif message.text in "
              "premium_subscription_buttons:\n"
              "        premium_active = "
              "is_premium(user_id)"
          )

          if subscription_anchor not in source:
              raise RuntimeError(
                  "Premium subscription branch "
                  "not found"
              )

          invoice_code = (
              "\n"
              "        # PREMIUM STARS INVOICE ENTRY\n"
              "        if not premium_active:\n"
              "            from premium_stars_payment "
              "import build_premium_invoice\n"
              "\n"
              "            premium_invoice = "
              "build_premium_invoice(\n"
              "                user_id=user_id,\n"
              "                language=language,\n"
              "            )\n"
              "\n"
              "            premium_prices = [\n"
              "                types.LabeledPrice(\n"
              "                    label=item[\"label\"],\n"
              "                    amount=item[\"amount\"],\n"
              "                )\n"
              "                for item in "
              "premium_invoice[\"prices\"]\n"
              "            ]\n"
              "\n"
              "            bot.send_invoice(\n"
              "                chat_id=message.chat.id,\n"
              "                title="
              "premium_invoice[\"title\"],\n"
              "                description="
              "premium_invoice[\"description\"],\n"
              "                invoice_payload="
              "premium_invoice[\"payload\"],\n"
              "                provider_token=\"\",\n"
              "                currency="
              "premium_invoice[\"currency\"],\n"
              "                prices=premium_prices,\n"
              "                subscription_period="
              "premium_invoice["
              "\"subscription_period\"],\n"
              "            )\n"
              "\n"
              "            return\n"
          )

          source = source.replace(
              subscription_anchor,
              subscription_anchor + invoice_code,
              1,
          )

          payment_anchor = (
              "def handle_profile_successful_payment"
              "(message):\n"
              "    payment = "
              "message.successful_payment"
          )

          if payment_anchor not in source:
              raise RuntimeError(
                  "Primary successful payment "
                  "handler not found"
              )

          successful_code = (
              "\n"
              "\n"
              "    if (\n"
              "        isinstance(\n"
              "            payment.invoice_payload,\n"
              "            str,\n"
              "        )\n"
              "        and "
              "payment.invoice_payload.startswith(\n"
              "            \"astrovibe_premium:\"\n"
              "        )\n"
              "    ):\n"
              "        from premium_stars_handlers "
              "import "
              "process_successful_premium_payment\n"
              "\n"
              "        result = "
              "process_successful_premium_payment(\n"
              "            get_db_connection="
              "get_db_connection,\n"
              "            payload="
              "payment.invoice_payload,\n"
              "            currency="
              "payment.currency,\n"
              "            total_amount="
              "payment.total_amount,\n"
              "            "
              "telegram_payment_charge_id="
              "payment.telegram_payment_charge_id,\n"
              "            telegram_user_id="
              "message.from_user.id,\n"
              "            "
              "telegram_subscription_id=None,\n"
              "            "
              "subscription_expiration_date="
              "getattr(\n"
              "                payment,\n"
              "                "
              "\"subscription_expiration_date\",\n"
              "                None,\n"
              "            ),\n"
              "            is_recurring=getattr(\n"
              "                payment,\n"
              "                \"is_recurring\",\n"
              "                None,\n"
              "            ),\n"
              "            "
              "is_first_recurring=getattr(\n"
              "                payment,\n"
              "                "
              "\"is_first_recurring\",\n"
              "                None,\n"
              "            ),\n"
              "        )\n"
              "\n"
              "        language = "
              "get_user_language(\n"
              "            message.from_user.id\n"
              "        )\n"
              "\n"
              "        if result[\"success\"]:\n"
              "            text = (\n"
              "                \"💎 AstroVibe Premium "
              "is active!\"\n"
              "                if language == \"en\"\n"
              "                else "
              "\"💎 AstroVibe Premium est actif !\"\n"
              "            )\n"
              "\n"
              "            bot.send_message(\n"
              "                message.chat.id,\n"
              "                text,\n"
              "                reply_markup="
              "premium_menu(language),\n"
              "            )\n"
              "        else:\n"
              "            reason = result.get(\n"
              "                \"reason\",\n"
              "                \"unknown_error\",\n"
              "            )\n"
              "\n"
              "            bot.send_message(\n"
              "                message.chat.id,\n"
              "                "
              "f\"Premium payment error: "
              "{reason}\",\n"
              "            )\n"
              "\n"
              "        return\n"
          )

          source = source.replace(
              payment_anchor,
              payment_anchor + successful_code,
              1,
          )

          neon_marker = (
              "# PROFILE PURCHASE NEON CONNECTION"
          )

          if neon_marker not in source:
              raise RuntimeError(
                  "Profile Neon marker not found"
              )

          pre_checkout_code = (
              "# =================================="
              "================\n"
              "# PREMIUM STARS PAYMENT CONNECTION\n"
              "# =================================="
              "================\n"
              "\n"
              "@bot.pre_checkout_query_handler(\n"
              "    func=lambda query: (\n"
              "        isinstance(\n"
              "            query.invoice_payload,\n"
              "            str,\n"
              "        )\n"
              "        and "
              "query.invoice_payload.startswith(\n"
              "            \"astrovibe_premium:\"\n"
              "        )\n"
              "    )\n"
              ")\n"
              "def astro_premium_pre_checkout"
              "(query):\n"
              "    from premium_stars_handlers "
              "import process_premium_pre_checkout\n"
              "\n"
              "    result = "
              "process_premium_pre_checkout(\n"
              "        payload=query.invoice_payload,\n"
              "        currency=query.currency,\n"
              "        total_amount="
              "query.total_amount,\n"
              "        telegram_user_id="
              "query.from_user.id,\n"
              "    )\n"
              "\n"
              "    if result[\"success\"]:\n"
              "        "
              "bot.answer_pre_checkout_query(\n"
              "            query.id,\n"
              "            ok=True,\n"
              "        )\n"
              "    else:\n"
              "        "
              "bot.answer_pre_checkout_query(\n"
              "            query.id,\n"
              "            ok=False,\n"
              "            error_message=(\n"
              "                \"Invalid Premium "
              "payment\"\n"
              "            ),\n"
              "        )\n"
              "\n"
              "\n"
          )

          source = source.replace(
              neon_marker,
              pre_checkout_code + neon_marker,
              1,
          )

          path.write_text(
              source,
              encoding="utf-8",
          )

          print(
              "PREMIUM STARS CONNECTION PATCHED"
          )
          PY

      - name: Apply Premium connection patch
        run: python /tmp/connect_premium.py

      - name: Compile complete stack
        run: |
          python -m py_compile bot.py
          python -m py_compile premium_engine.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py
          python -m py_compile personal_profile_v2_engine.py

      - name: Test Premium payment contract
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              build_premium_invoice,
              validate_premium_pre_checkout,
              validate_premium_successful_payment,
          )

          invoice = build_premium_invoice(
              user_id=123456789,
              language="fr",
          )

          assert invoice["currency"] == "XTR"
          assert invoice["prices"][0]["amount"] == 199
          assert invoice["subscription_period"] == 2592000
          assert invoice["payload"] == (
              "astrovibe_premium:123456789"
          )

          checkout = validate_premium_pre_checkout(
              payload=invoice["payload"],
              currency="XTR",
              total_amount=199,
              telegram_user_id=123456789,
          )

          assert checkout["valid"] is True

          payment = (
              validate_premium_successful_payment(
                  payload=invoice["payload"],
                  currency="XTR",
                  total_amount=199,
                  telegram_payment_charge_id=(
                      "TEST_CONNECT_PREMIUM_001"
                  ),
                  telegram_user_id=123456789,
                  subscription_expiration_date=(
                      1893456000
                  ),
                  is_recurring=True,
                  is_first_recurring=True,
              )
          )

          assert payment["valid"] is True
          assert payment["amount"] == 199
          assert payment["currency"] == "XTR"

          print("PREMIUM CONTRACT OK")
          PY

      - name: Verify Premium bot wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "# PREMIUM STARS INVOICE ENTRY",
              "# PREMIUM STARS PAYMENT CONNECTION",
              "build_premium_invoice",
              "bot.send_invoice",
              "subscription_period",
              "astrovibe_premium:",
              "astro_premium_pre_checkout",
              "process_premium_pre_checkout",
              "process_successful_premium_payment",
              "subscription_expiration_date",
              "is_recurring",
              "is_first_recurring",
              "get_db_connection",
          )

          for marker in required:
              assert marker in source, marker
              print("PREMIUM OK:", marker)

          print("PREMIUM WIRING VERIFIED")
          PY

      - name: Verify Profile 390 Stars preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "astrovibe_profile_v2:",
              "handle_profile_pre_checkout",
              "process_profile_pre_checkout",
              "handle_profile_successful_payment",
              "process_profile_successful_payment",
              "astro_profile_pre_checkout",
              "astro_profile_successful_payment",
              "process_successful_profile_purchase",
              "send_personal_profile",
              "init_profile_purchase_table",
          )

          for marker in required:
              assert marker in source, marker
              print("PROFILE OK:", marker)

          print("PROFILE PURCHASE PRESERVED")
          PY

      - name: Verify Premium V1 preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          bot_source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          premium_source = Path(
              "premium_engine.py"
          ).read_text(
              encoding="utf-8"
          )

          bot_required = (
              "def is_premium",
              "SELECT premium",
              "def premium_menu",
              "premium_subscription_buttons",
              "subscription_premium",
              "subscription_free",
          )

          for marker in bot_required:
              assert marker in bot_source, marker

          engine_required = (
              "generate_daily_plus",
              "generate_weekly",
              "generate_monthly",
              "generate_yearly",
              "generate_premium_compatibility",
          )

          for marker in engine_required:
              assert marker in premium_source, marker

          print("PREMIUM V1 PRESERVED")
          PY

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {"bot.py"}, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print("ONLY BOT.PY CHANGED")
          PY

      - name: Show bot.py diff
        run: git diff -- bot.py

      - name: Commit Premium Stars connection
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Connect Premium Stars subscription"
          git push
