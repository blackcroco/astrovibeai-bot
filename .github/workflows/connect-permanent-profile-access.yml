name: Connect Permanent Profile Access

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-permanent-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate current production
        run: |
          python -m py_compile bot.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py
          python -m py_compile personal_profile_v2_engine.py

      - name: Create permanent access patch
        run: |
          cat > /tmp/connect_permanent_access.py <<'PY'
          from pathlib import Path
          import ast


          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          marker = (
              "# PERMANENT PROFILE ACCESS"
          )


          if marker in source:
              compile(
                  source,
                  "bot.py",
                  "exec"
              )

              print(
                  "Permanent access already connected."
              )

              raise SystemExit(0)


          tree = ast.parse(
              source,
              filename="bot.py"
          )


          # ============================================
          # FIND COMMERCIAL PROFILE BRANCH
          # ============================================

          offer_matches = []


          for node in ast.walk(tree):
              if not isinstance(
                  node,
                  ast.If
              ):
                  continue

              constants = {
                  value.value
                  for value in ast.walk(node.test)
                  if isinstance(
                      value,
                      ast.Constant
                  )
                  and isinstance(
                      value.value,
                      str
                  )
              }

              if (
                  "✨ Mon Profil AstroVibe"
                  in constants
                  and
                  "✨ My AstroVibe Profile"
                  in constants
              ):
                  offer_matches.append(
                      node
                  )


          if len(offer_matches) != 1:
              raise SystemExit(
                  "ERROR: expected one Profile offer "
                  "branch, found "
                  + str(
                      len(offer_matches)
                  )
              )


          offer_branch = offer_matches[0]


          if not offer_branch.body:
              raise SystemExit(
                  "ERROR: Profile offer branch is empty."
              )


          offer_insert_line = (
              offer_branch.body[0].lineno - 1
          )

          offer_indent = (
              " "
              * offer_branch.body[0].col_offset
          )


          ownership_lines = [
              offer_indent
              + "# PERMANENT PROFILE ACCESS",
              offer_indent
              + "from profile_purchase_engine import (",
              offer_indent
              + "    has_purchased_profile,",
              offer_indent
              + ")",
              "",
              offer_indent
              + "if has_purchased_profile(",
              offer_indent
              + "    get_db_connection,",
              offer_indent
              + "    message.from_user.id,",
              offer_indent
              + "):",
              offer_indent
              + "    send_personal_profile(",
              offer_indent
              + "        message",
              offer_indent
              + "    )",
              offer_indent
              + "    return",
              "",
          ]


          ownership_block = "\n".join(
              ownership_lines
          )


          # ============================================
          # FIND SUCCESSFUL PAYMENT HANDLER
          # ============================================

          payment_functions = [
              node
              for node in tree.body
              if isinstance(
                  node,
                  ast.FunctionDef
              )
              and node.name
              == "astro_profile_successful_payment"
          ]


          if len(payment_functions) != 1:
              raise SystemExit(
                  "ERROR: expected one successful "
                  "payment handler, found "
                  + str(
                      len(payment_functions)
                  )
              )


          payment_function = (
              payment_functions[0]
          )


          if not payment_function.body:
              raise SystemExit(
                  "ERROR: successful payment "
                  "handler is empty."
              )


          payment_start = (
              payment_function.body[0].lineno
              - 1
          )

          payment_end = (
              payment_function.end_lineno
          )


          if payment_end is None:
              raise SystemExit(
                  "ERROR: successful payment "
                  "handler end unavailable."
              )


          payment_body_lines = [
              "    payment = message.successful_payment",
              "",
              "    if not isinstance(",
              "        payment.invoice_payload,",
              "        str,",
              "    ):",
              "        return",
              "",
              "    if not payment.invoice_payload.startswith(",
              '        "astrovibe_profile_v2:"',
              "    ):",
              "        return",
              "",
              "    language = get_user_language(",
              "        message.from_user.id",
              "    )",
              "",
              "    from profile_purchase_delivery import (",
              "        process_successful_profile_purchase,",
              "    )",
              "",
              "    result = process_successful_profile_purchase(",
              "        bot=bot,",
              "        message=message,",
              "        language=language,",
              "        connection_factory=get_db_connection,",
              "    )",
              "",
              "    if (",
              "        result",
              '        and result.get("valid")',
              "        and (",
              '            result.get("recorded")',
              '            or result.get("already_owned")',
              '            or result.get("duplicate_charge")',
              "        )",
              "    ):",
              "        send_personal_profile(",
              "            message",
              "        )",
          ]


          payment_body = "\n".join(
              payment_body_lines
          )


          # ============================================
          # APPLY CHANGES FROM BOTTOM TO TOP
          # ============================================

          lines = source.splitlines(
              keepends=True
          )


          replacements = [
              (
                  payment_start,
                  payment_end,
                  payment_body + "\n",
              ),
              (
                  offer_insert_line,
                  offer_insert_line,
                  ownership_block + "\n",
              ),
          ]


          for start, end, replacement in sorted(
              replacements,
              key=lambda item: item[0],
              reverse=True,
          ):
              lines[start:end] = [
                  replacement
              ]


          updated = "".join(
              lines
          )


          compile(
              updated,
              "bot.py",
              "exec"
          )


          required = (
              marker,
              "has_purchased_profile",
              "send_personal_profile(",
              "process_successful_profile_purchase",
              'result.get("recorded")',
              'result.get("already_owned")',
              'result.get("duplicate_charge")',
          )


          for item in required:
              if item not in updated:
                  raise SystemExit(
                      "ERROR: missing permanent "
                      "access element: "
                      + item
                  )


          path.write_text(
              updated,
              encoding="utf-8"
          )


          print(
              "Permanent Profile access connected."
          )

          print(
              "Offer access check inserted at line:",
              offer_insert_line + 1
          )

          print(
              "Successful payment handler replaced:",
              payment_start + 1,
              "-",
              payment_end
          )
          PY

      - name: Apply permanent access patch
        run: |
          python /tmp/connect_permanent_access.py

      - name: Compile patched AstroVibe
        run: |
          python -m py_compile bot.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile personal_profile_v2_engine.py
          git diff --check

      - name: Verify permanent access
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          ast.parse(
              source,
              filename="bot.py"
          )

          required = (
              "PERMANENT PROFILE ACCESS",
              "has_purchased_profile",
              "get_db_connection",
              "send_personal_profile(",
              "process_successful_profile_purchase",
              'result.get("recorded")',
              'result.get("already_owned")',
              'result.get("duplicate_charge")',
          )

          for item in required:
              assert item in source, item

              print(
                  "OK:",
                  item
              )

          print(
              "PERMANENT PROFILE ACCESS VERIFIED"
          )
          PY

      - name: Verify purchase configuration
        run: |
          python - <<'PY'
          from profile_purchase_engine import (
              validate_purchase_configuration,
          )

          from profile_stars_payment import (
              build_profile_invoice,
          )

          result = validate_purchase_configuration()

          assert result["valid"] is True
          assert result["errors"] == []

          invoice = build_profile_invoice(
              user_id=123456789,
              language="fr",
          )

          assert invoice["currency"] == "XTR"
          assert invoice["prices"][0]["amount"] == 390

          print(
              "390 XTR OWNERSHIP CONFIGURATION VERIFIED"
          )
          PY

      - name: Show changes
        run: |
          git diff --check
          git status --short
          git diff -- bot.py

      - name: Commit permanent access
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Connect permanent access to Personal Profile V2"
          git push origin HEAD:main
