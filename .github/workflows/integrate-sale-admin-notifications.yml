name: Integrate Sale Admin Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-sale-admin-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: |
          test -f bot.py
          test -f profile_stars_handlers.py
          test -f premium_stars_handlers.py
          test -f profile_purchase_engine.py
          test -f premium_subscription_engine.py

          echo "REPOSITORY READY"

      - name: Verify notification integration is absent
        run: |
          if test -f sale_notification_engine.py; then
            echo "sale_notification_engine.py already exists."
            exit 1
          fi

          if grep -q \
            "ASTROVIBE SALE ADMIN NOTIFICATION" \
            bot.py
          then
            echo "Sale notification integration already exists."
            exit 1
          fi

          echo "SALE NOTIFICATIONS NOT INSTALLED"

      - name: Locate real successful payment functions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path


          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          tree = ast.parse(source)

          targets = {
              "process_successful_profile_purchase",
              "process_successful_premium_payment",
          }

          matches = {
              target: []
              for target in targets
          }


          def call_name(node):
              if isinstance(node, ast.Name):
                  return node.id

              if isinstance(node, ast.Attribute):
                  return node.attr

              return None


          for node in ast.walk(tree):
              if not isinstance(
                  node,
                  (
                      ast.FunctionDef,
                      ast.AsyncFunctionDef,
                  ),
              ):
                  continue

              called_names = {
                  call_name(child.func)
                  for child in ast.walk(node)
                  if isinstance(child, ast.Call)
              }

              for target in targets:
                  if target in called_names:
                      matches[target].append(
                          node.name
                      )


          for target in sorted(targets):
              functions = matches[target]

              print(
                  target,
                  "=>",
                  functions,
              )

              assert len(functions) == 1, (
                  "Expected exactly one function "
                  f"calling {target}, found "
                  f"{functions}"
              )


          assert "bot" in source, (
              "Global Telegram bot reference "
              "was not found in bot.py"
          )

          print(
              "REAL SUCCESSFUL PAYMENT "
              "FUNCTIONS LOCATED"
          )
          PY

      - name: Create sale notification engine
        run: |
          cat > sale_notification_engine.py <<'PY'
          # ==========================================
          # ASTROVIBE SALE ADMIN NOTIFICATIONS
          # ==========================================
          #
          # Operational notification only.
          #
          # This module:
          # - sends one private Telegram notification;
          # - performs no database write;
          # - changes no Profile or Premium rights;
          # - changes no Stars or points;
          # - exposes no payment charge identifier.
          # ==========================================

          import os


          ADMIN_ENV_NAMES = (
              "SUPPORT_ADMIN_TELEGRAM_ID",
              "ADMIN_TELEGRAM_ID",
              "ADMIN_CHAT_ID",
          )


          PRODUCTS = {
              "profile": {
                  "emoji": "✨",
                  "name": "Profil AstroVibe Personnel",
                  "stars": 390,
                  "access": "Achat unique",
              },
              "premium": {
                  "emoji": "💎",
                  "name": "AstroVibe Premium",
                  "stars": 199,
                  "access": "30 jours",
              },
          }


          def get_admin_chat_id():
              for variable_name in ADMIN_ENV_NAMES:
                  raw_value = os.getenv(
                      variable_name,
                      "",
                  ).strip()

                  if not raw_value:
                      continue

                  try:
                      return int(raw_value)
                  except (TypeError, ValueError):
                      continue

              return None


          def build_sale_message(product):
              config = PRODUCTS.get(product)

              if config is None:
                  raise ValueError(
                      "Unsupported AstroVibe product"
                  )

              return "\n".join(
                  [
                      "🎉 NOUVELLE VENTE ASTROVIBE",
                      "",
                      (
                          f"{config['emoji']} "
                          f"{config['name']}"
                      ),
                      (
                          f"⭐ {config['stars']} Stars"
                      ),
                      (
                          f"📅 {config['access']}"
                      ),
                      "",
                      "✅ Paiement Telegram reçu",
                      "⚙️ Traitement automatique lancé",
                  ]
              )


          def notify_sale_admin(
              bot,
              product,
          ):
              admin_chat_id = get_admin_chat_id()

              if admin_chat_id is None:
                  print(
                      "SALE ADMIN NOTIFICATION SKIPPED: "
                      "admin chat id unavailable",
                      flush=True,
                  )

                  return False

              message_text = build_sale_message(
                  product
              )

              try:
                  bot.send_message(
                      admin_chat_id,
                      message_text,
                      disable_web_page_preview=True,
                  )

                  print(
                      "SALE ADMIN NOTIFICATION SENT:",
                      product,
                      flush=True,
                  )

                  return True

              except Exception as error:
                  print(
                      "SALE ADMIN NOTIFICATION ERROR:",
                      product,
                      repr(error),
                      flush=True,
                  )

                  return False
          PY

          echo "SALE NOTIFICATION ENGINE CREATED"

      - name: Compile notification engine
        run: |
          python -m py_compile \
            sale_notification_engine.py

          echo "SALE NOTIFICATION ENGINE COMPILES"

      - name: Test notification engine with fake bot
        run: |
          python - <<'PY'
          import os

          from sale_notification_engine import (
              build_sale_message,
              notify_sale_admin,
          )


          profile_message = build_sale_message(
              "profile"
          )

          premium_message = build_sale_message(
              "premium"
          )

          assert "390 Stars" in profile_message
          assert "Profil AstroVibe Personnel" in profile_message
          assert "Achat unique" in profile_message

          assert "199 Stars" in premium_message
          assert "AstroVibe Premium" in premium_message
          assert "30 jours" in premium_message

          assert (
              "telegram_payment_charge_id"
              not in profile_message
          )

          assert (
              "provider_payment_charge_id"
              not in premium_message
          )


          class FakeBot:
              def __init__(self):
                  self.calls = []

              def send_message(
                  self,
                  chat_id,
                  text,
                  **kwargs,
              ):
                  self.calls.append(
                      {
                          "chat_id": chat_id,
                          "text": text,
                          "kwargs": kwargs,
                      }
                  )


          previous_value = os.environ.get(
              "SUPPORT_ADMIN_TELEGRAM_ID"
          )

          os.environ[
              "SUPPORT_ADMIN_TELEGRAM_ID"
          ] = "123456789"

          fake_bot = FakeBot()

          assert notify_sale_admin(
              fake_bot,
              "profile",
          ) is True

          assert notify_sale_admin(
              fake_bot,
              "premium",
          ) is True

          assert len(fake_bot.calls) == 2

          assert (
              fake_bot.calls[0]["chat_id"]
              == 123456789
          )

          assert (
              fake_bot.calls[1]["chat_id"]
              == 123456789
          )

          if previous_value is None:
              os.environ.pop(
                  "SUPPORT_ADMIN_TELEGRAM_ID",
                  None,
              )
          else:
              os.environ[
                  "SUPPORT_ADMIN_TELEGRAM_ID"
              ] = previous_value

          print(
              "FAKE BOT NOTIFICATION TESTS OK"
          )

          print(
              "REAL TELEGRAM MESSAGES SENT: 0"
          )
          PY

      - name: Create robust integration patch
        run: |
          cat > /tmp/integrate_sale_notifications.py <<'PY'
          import ast
          from pathlib import Path


          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          marker = (
              "ASTROVIBE SALE ADMIN NOTIFICATION"
          )

          if marker in source:
              raise RuntimeError(
                  "Sale notifications are already "
                  "integrated in bot.py"
              )

          tree = ast.parse(source)

          lines = source.splitlines(
              keepends=True
          )

          targets = {
              "process_successful_profile_purchase": (
                  "profile"
              ),
              "process_successful_premium_payment": (
                  "premium"
              ),
          }

          matches = {
              target: []
              for target in targets
          }


          def call_name(node):
              if isinstance(node, ast.Name):
                  return node.id

              if isinstance(node, ast.Attribute):
                  return node.attr

              return None


          for node in tree.body:
              if not isinstance(
                  node,
                  (
                      ast.FunctionDef,
                      ast.AsyncFunctionDef,
                  ),
              ):
                  continue

              called_names = {
                  call_name(child.func)
                  for child in ast.walk(node)
                  if isinstance(child, ast.Call)
              }

              for target_name in targets:
                  if target_name in called_names:
                      matches[target_name].append(
                          node
                      )


          integrations = []

          for target_name, product in targets.items():
              functions = matches[target_name]

              if len(functions) != 1:
                  raise RuntimeError(
                      "Expected exactly one function "
                      f"calling {target_name}, found "
                      f"{len(functions)}"
                  )

              function_node = functions[0]

              if not function_node.body:
                  raise RuntimeError(
                      "Target function has no body: "
                      + function_node.name
                  )

              insertion_line = (
                  function_node.body[0].lineno - 1
              )

              if (
                  isinstance(
                      function_node.body[0],
                      ast.Expr,
                  )
                  and isinstance(
                      function_node.body[0].value,
                      ast.Constant,
                  )
                  and isinstance(
                      function_node.body[0].value.value,
                      str,
                  )
              ):
                  insertion_line = (
                      function_node.body[0].end_lineno
                  )

              function_line = lines[
                  function_node.lineno - 1
              ]

              function_indent = (
                  function_line[
                      :len(function_line)
                      - len(
                          function_line.lstrip()
                      )
                  ]
              )

              body_indent = (
                  function_indent + "    "
              )

              block = [
                  (
                      f"{body_indent}"
                      "# ASTROVIBE SALE ADMIN "
                      "NOTIFICATION\n"
                  ),
                  (
                      f"{body_indent}"
                      "try:\n"
                  ),
                  (
                      f"{body_indent}    "
                      "from sale_notification_engine "
                      "import notify_sale_admin\n"
                  ),
                  "\n",
                  (
                      f"{body_indent}    "
                      "notify_sale_admin(\n"
                  ),
                  (
                      f"{body_indent}        "
                      "bot=bot,\n"
                  ),
                  (
                      f"{body_indent}        "
                      f'product="{product}",\n'
                  ),
                  (
                      f"{body_indent}    "
                      ")\n"
                  ),
                  (
                      f"{body_indent}"
                      "except Exception as "
                      "sale_notification_error:\n"
                  ),
                  (
                      f"{body_indent}    "
                      "print(\n"
                  ),
                  (
                      f"{body_indent}        "
                      '"SALE ADMIN NOTIFICATION '
                      'UNEXPECTED ERROR:",\n'
                  ),
                  (
                      f"{body_indent}        "
                      "repr(\n"
                  ),
                  (
                      f"{body_indent}            "
                      "sale_notification_error\n"
                  ),
                  (
                      f"{body_indent}        "
                      "),\n"
                  ),
                  (
                      f"{body_indent}        "
                      "flush=True,\n"
                  ),
                  (
                      f"{body_indent}    "
                      ")\n"
                  ),
                  "\n",
              ]

              integrations.append(
                  {
                      "line": insertion_line,
                      "block": block,
                      "function": function_node.name,
                      "processor": target_name,
                      "product": product,
                  }
              )


          for integration in sorted(
              integrations,
              key=lambda item: item["line"],
              reverse=True,
          ):
              lines[
                  integration["line"]:
                  integration["line"]
              ] = integration["block"]

              print(
                  "INTEGRATED:",
                  integration["product"],
                  "into function:",
                  integration["function"],
                  "identified by:",
                  integration["processor"],
              )


          updated_source = "".join(lines)

          ast.parse(updated_source)

          if (
              updated_source.count(marker)
              != 2
          ):
              raise RuntimeError(
                  "Expected exactly two sale "
                  "notification markers"
              )

          if (
              updated_source.count(
                  'product="profile"'
              )
              != 1
          ):
              raise RuntimeError(
                  "Profile notification call "
                  "count is invalid"
              )

          if (
              updated_source.count(
                  'product="premium"'
              )
              != 1
          ):
              raise RuntimeError(
                  "Premium notification call "
                  "count is invalid"
              )

          path.write_text(
              updated_source,
              encoding="utf-8",
          )

          print(
              "SALE NOTIFICATIONS INTEGRATED"
          )
          PY

          echo "ROBUST INTEGRATION PATCH CREATED"

      - name: Validate integration patch
        run: |
          python -m py_compile \
            /tmp/integrate_sale_notifications.py

          echo "INTEGRATION PATCH COMPILES"

      - name: Apply integration patch
        run: |
          python \
            /tmp/integrate_sale_notifications.py

      - name: Verify integrations
        run: |
          test "$(
            grep -c \
              "ASTROVIBE SALE ADMIN NOTIFICATION" \
              bot.py
          )" -eq 2

          test "$(
            grep -c \
              'product="profile"' \
              bot.py
          )" -eq 1

          test "$(
            grep -c \
              'product="premium"' \
              bot.py
          )" -eq 1

          echo "PROFILE NOTIFICATION INTEGRATED"
          echo "PREMIUM NOTIFICATION INTEGRATED"

      - name: Compile complete production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile \
            sale_notification_engine.py
          python -m py_compile \
            profile_stars_handlers.py
          python -m py_compile \
            profile_stars_payment.py
          python -m py_compile \
            profile_purchase_engine.py
          python -m py_compile \
            premium_stars_handlers.py
          python -m py_compile \
            premium_stars_payment.py
          python -m py_compile \
            premium_subscription_engine.py
          python -m py_compile referral_engine.py
          python -m py_compile level_rewards_engine.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_ai.py
          python -m py_compile terms_engine.py

          echo "COMPLETE PRODUCTION STACK COMPILES"

      - name: Verify payment contracts preserved
        run: |
          grep -q \
            "astrovibe_profile_v2:" \
            bot.py

          grep -q \
            "astrovibe_premium:" \
            bot.py

          grep -Rqi \
            "390" \
            profile_stars_handlers.py \
            profile_stars_payment.py \
            profile_purchase_engine.py

          grep -Rqi \
            "199" \
            premium_stars_handlers.py \
            premium_stars_payment.py \
            premium_subscription_engine.py

          grep -q \
            "process_successful_profile_purchase" \
            bot.py

          grep -q \
            "process_successful_premium_payment" \
            bot.py

          echo "PROFILE 390 STARS PRESERVED"
          echo "PREMIUM 199 STARS PRESERVED"
          echo "PAYMENT PROCESSORS PRESERVED"

      - name: Verify notification engine safety
        run: |
          if grep -Eiq \
            'INSERT INTO|UPDATE users|DELETE FROM|commit\(|rollback\(|refundStarPayment|refund_star_payment|createInvoiceLink|send_invoice|answer_pre_checkout_query' \
            sale_notification_engine.py
          then
            echo "Forbidden payment or database logic detected."
            exit 1
          fi

          if grep -Eiq \
            'telegram_payment_charge_id|provider_payment_charge_id|DATABASE_URL|BOT_TOKEN|GROQ_API_KEY' \
            sale_notification_engine.py
          then
            echo "Sensitive data reference detected."
            exit 1
          fi

          echo "NO DATABASE WRITES ADDED"
          echo "NO PAYMENT ACTIONS ADDED"
          echo "NO SENSITIVE PAYMENT IDS INCLUDED"

      - name: Verify expected changed files only
        run: |
          python - <<'PY'
          import subprocess


          result = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = set()

          for line in result.stdout.splitlines():
              if not line.strip():
                  continue

              changed.add(
                  line[3:].strip()
              )

          expected = {
              "bot.py",
              "sale_notification_engine.py",
          }

          assert changed == expected, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print(
              "ONLY EXPECTED FILES CHANGED"
          )

          for file_path in sorted(changed):
              print(
                  "CHANGED:",
                  file_path,
              )
          PY

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Show integration diff
        run: |
          git diff -- bot.py

          git diff \
            --no-index \
            /dev/null \
            sale_notification_engine.py \
            || true

      - name: Commit sale notification integration
        run: |
          git add \
            bot.py \
            sale_notification_engine.py

          if git diff --cached --quiet; then
            echo "No notification changes to commit."
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Add admin notifications for AstroVibe sales"

          git push

      - name: Final validation
        run: |
          echo "======================================"
          echo "SALE ADMIN NOTIFICATIONS INTEGRATED"
          echo "======================================"
          echo "Profile payment alert: YES"
          echo "Premium payment alert: YES"
          echo "Profile price changed: NO"
          echo "Premium price changed: NO"
          echo "Database writes added: 0"
          echo "Payment actions added: 0"
          echo "Sensitive payment IDs exposed: 0"
          echo "Real Telegram test messages: 0"
          echo "Real payments during workflow: 0"
