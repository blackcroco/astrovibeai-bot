name: Connect Personal Profile V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-profile-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch bot.py safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          v2_import = (
              "from personal_profile_v2_engine import "
              "generate_personal_profile_v2"
          )

          if v2_import not in source:
              import_anchor = (
                  "from personal_profile_engine import "
                  "generate_personal_profile"
              )

              if import_anchor in source:
                  source = source.replace(
                      import_anchor,
                      import_anchor
                      + "\n"
                      + v2_import,
                      1,
                  )
              else:
                  source = (
                      v2_import
                      + "\n"
                      + source
                  )

          if (
              "profile = generate_personal_profile_v2("
              not in source
          ):
              pattern = re.compile(
                  r'(?ms)'
                  r'^(?P<indent>[ \t]+)'
                  r'profile\s*=\s*'
                  r'generate_personal_profile\(\s*\n'
                  r'.*?'
                  r'^(?P=indent)\)'
              )

              matches = list(
                  pattern.finditer(source)
              )

              if len(matches) != 1:
                  raise SystemExit(
                      "ERROR: expected exactly one "
                      "generate_personal_profile call; "
                      f"found {len(matches)}."
                  )

              indent = matches[0].group(
                  "indent"
              )

              replacement = "\n".join(
                  [
                      (
                          indent
                          + "profile = "
                          + "generate_personal_profile_v2("
                      ),
                      (
                          indent
                          + "    sign=sign,"
                      ),
                      (
                          indent
                          + "    language=language,"
                      ),
                      (
                          indent
                          + '    birth_date='
                          + 'birth_info["birth_date"],'
                      ),
                      (
                          indent
                          + '    birth_time='
                          + 'birth_info["birth_time"],'
                      ),
                      (
                          indent
                          + "    birth_time_known="
                          + 'birth_info["birth_time_known"],'
                      ),
                      (
                          indent
                          + '    birth_place='
                          + 'birth_info["birth_place"],'
                      ),
                      (
                          indent
                          + "    birth_timezone="
                          + 'birth_info["birth_timezone"],'
                      ),
                      (
                          indent
                          + "    birth_latitude="
                          + 'birth_info["birth_latitude"],'
                      ),
                      (
                          indent
                          + "    birth_longitude="
                          + 'birth_info["birth_longitude"],'
                      ),
                      (
                          indent
                          + ")"
                      ),
                  ]
              )

              source, count = pattern.subn(
                  lambda match: replacement,
                  source,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: V1 profile call "
                      "was not replaced."
                  )

          if source.count(
              "profile = generate_personal_profile_v2("
          ) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one "
                  "Telegram V2 profile call."
              )

          checks = (
              v2_import,
              'birth_info["birth_timezone"]',
              'birth_info["birth_latitude"]',
              'birth_info["birth_longitude"]',
          )

          for expected in checks:
              if expected not in source:
                  raise SystemExit(
                      "ERROR: required V2 value missing: "
                      + expected
                  )

          compile(
              source,
              "bot.py",
              "exec",
          )

          path.write_text(
              source,
              encoding="utf-8",
          )

          print(
              "bot.py patched and syntax validated."
          )
          PY

      - name: Compile AstroVibe
        run: |
          python -m py_compile bot.py
          python -m py_compile personal_profile_engine.py
          python -m py_compile personal_profile_v2_engine.py
          python -m py_compile natal_chart_engine.py
          python -m py_compile natal_profile_interpreter.py
          python -m py_compile birth_location_engine.py
          git diff --check

      - name: Verify Telegram V2 connection
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "bot.py"
          ).read_text(
              encoding="utf-8"
          )

          expected_values = (
              (
                  "V2 import",
                  "from personal_profile_v2_engine import "
                  "generate_personal_profile_v2",
              ),
              (
                  "V2 call",
                  "profile = generate_personal_profile_v2(",
              ),
              (
                  "timezone",
                  'birth_timezone=birth_info["birth_timezone"]',
              ),
              (
                  "latitude",
                  'birth_latitude=birth_info["birth_latitude"]',
              ),
              (
                  "longitude",
                  'birth_longitude=birth_info["birth_longitude"]',
              ),
          )

          for label, expected in expected_values:
              assert expected in source, label
              print("OK:", label)

          print(
              "TELEGRAM V2 CONNECTION PASSED"
          )
          PY

      - name: Test French V2
        run: |
          python - <<'PY'
          from datetime import date, time

          from personal_profile_v2_engine import (
              generate_personal_profile_v2,
          )

          profile = generate_personal_profile_v2(
              sign="leo",
              language="fr",
              birth_date=date(2000, 8, 15),
              birth_time=time(14, 35),
              birth_time_known=True,
              birth_place="Vannes, FR",
              birth_timezone="Europe/Paris",
              birth_latitude=47.65688,
              birth_longitude=-2.76205,
          )

          assert profile
          assert "PROFIL ASTROVIBE PERSONNEL" in profile
          assert "TON THÈME NATAL PERSONNALISÉ" in profile
          assert "PROFIL NATAL ASTROVIBE" in profile

          assert "Soleil" in profile
          assert "Lune" in profile
          assert "Mercure" in profile
          assert "Vénus" in profile
          assert "Mars" in profile
          assert "Ascendant" in profile

          print(
              "French V2 length:",
              len(profile)
          )

          print(
              "FRENCH V2 PASSED"
          )
          PY

      - name: Test English V2
        run: |
          python - <<'PY'
          from datetime import date, time

          from personal_profile_v2_engine import (
              generate_personal_profile_v2,
          )

          profile = generate_personal_profile_v2(
              sign="leo",
              language="en",
              birth_date=date(2000, 8, 15),
              birth_time=time(14, 35),
              birth_time_known=True,
              birth_place="Vannes, FR",
              birth_timezone="Europe/Paris",
              birth_latitude=47.65688,
              birth_longitude=-2.76205,
          )

          assert profile
          assert "ASTROVIBE PERSONAL PROFILE" in profile
          assert "YOUR PERSONAL NATAL CHART" in profile
          assert "ASTROVIBE NATAL PROFILE" in profile

          assert "Sun" in profile
          assert "Moon" in profile
          assert "Mercury" in profile
          assert "Venus" in profile
          assert "Mars" in profile
          assert "Ascendant" in profile

          print(
              "English V2 length:",
              len(profile)
          )

          print(
              "ENGLISH V2 PASSED"
          )
          PY

      - name: Test unknown birth time
        run: |
          python - <<'PY'
          from datetime import date

          from personal_profile_v2_engine import (
              generate_personal_profile_v2,
          )

          profile = generate_personal_profile_v2(
              sign="leo",
              language="fr",
              birth_date=date(2000, 8, 15),
              birth_time=None,
              birth_time_known=False,
              birth_place="Vannes, FR",
              birth_timezone="Europe/Paris",
              birth_latitude=47.65688,
              birth_longitude=-2.76205,
          )

          assert profile
          assert "TON THÈME NATAL PERSONNALISÉ" in profile
          assert "Soleil" in profile
          assert "Lune" in profile

          assert (
              "Ascendant — Expression extérieure"
              not in profile
          )

          print(
              "UNKNOWN-TIME V2 PASSED"
          )
          PY

      - name: Show bot diff
        run: |
          git diff --check
          git diff -- bot.py

      - name: Commit validated Telegram V2
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot.py

          git commit -m "Connect Personal Profile V2 to Telegram"

          git push origin HEAD:main
