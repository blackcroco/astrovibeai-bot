name: Switch Payment Support AI To Groq

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-paysupport-ai-to-groq:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai pydantic

          echo "AI DEPENDENCIES INSTALLED"

      - name: Verify required files
        run: |
          test -f paysupport_ai.py
          test -f paysupport_admin.py
          test -f paysupport_engine.py
          test -f paysupport_flow.py
          test -f bot.py
          test -f requirements.txt

          echo "REQUIRED FILES OK"

      - name: Create Groq provider patch
        run: |
          cat > /tmp/switch_to_groq.py <<'PY'
          from pathlib import Path

          path = Path("paysupport_ai.py")

          source = path.read_text(
              encoding="utf-8"
          )

          provider_marker = (
              "# GROQ FREE AI PROVIDER"
          )

          if provider_marker in source:
              raise RuntimeError(
                  "Groq provider already installed."
              )

          old_key_config = (
              'SUPPORT_AI_API_KEY_ENV = '
              '"OPENAI_API_KEY"'
          )

          new_key_config = (
              'SUPPORT_AI_API_KEY_ENV = '
              '"GROQ_API_KEY"\n\n'
              'SUPPORT_AI_PROVIDER_ENV = '
              '"SUPPORT_AI_PROVIDER"\n\n'
              'GROQ_BASE_URL = '
              '"https://api.groq.com/openai/v1"\n\n'
              '# GROQ FREE AI PROVIDER'
          )

          if old_key_config not in source:
              raise RuntimeError(
                  "Original API key configuration "
                  "not found."
              )

          source = source.replace(
              old_key_config,
              new_key_config,
              1,
          )

          old_client = (
              "        from openai import OpenAI\n\n"
              "        client = OpenAI()"
          )

          new_client = (
              "        from openai import OpenAI\n\n"
              "        api_key = os.getenv(\n"
              "            SUPPORT_AI_API_KEY_ENV\n"
              "        )\n\n"
              "        provider = os.getenv(\n"
              "            SUPPORT_AI_PROVIDER_ENV,\n"
              "            \"groq\",\n"
              "        ).strip().lower()\n\n"
              "        if provider != \"groq\":\n"
              "            return build_escalation_fallback(\n"
              "                ticket,\n"
              "                reason=(\n"
              "                    \"Unsupported AI provider\"\n"
              "                ),\n"
              "            )\n\n"
              "        client = OpenAI(\n"
              "            api_key=api_key,\n"
              "            base_url=GROQ_BASE_URL,\n"
              "        )"
          )

          if old_client not in source:
              raise RuntimeError(
                  "Original OpenAI client "
                  "initialization not found."
              )

          source = source.replace(
              old_client,
              new_client,
              1,
          )

          path.write_text(
              source,
              encoding="utf-8",
          )

          print(
              "GROQ FREE PROVIDER INSTALLED"
          )
          PY

      - name: Validate patch script
        run: |
          python -m py_compile /tmp/switch_to_groq.py

          echo "PATCH SCRIPT VALID"

      - name: Apply Groq provider patch
        run: |
          python /tmp/switch_to_groq.py

      - name: Compile production files
        run: |
          python -m py_compile paysupport_ai.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_flow.py
          python -m py_compile bot.py

          echo "PRODUCTION FILES COMPILE"

      - name: Verify Groq provider configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "paysupport_ai.py"
          ).read_text(
              encoding="utf-8"
          )

          required = (
              "# GROQ FREE AI PROVIDER",
              '"GROQ_API_KEY"',
              '"SUPPORT_AI_PROVIDER"',
              "https://api.groq.com/openai/v1",
              'provider != "groq"',
              "api_key=api_key",
              "base_url=GROQ_BASE_URL",
          )

          for marker in required:
              assert marker in source, marker
              print(
                  "GROQ CONFIG OK:",
                  marker,
              )

          old_configuration = (
              'SUPPORT_AI_API_KEY_ENV = '
              '"OPENAI_API_KEY"'
          )

          assert (
              old_configuration
              not in source
          )

          print(
              "OLD OPENAI PROVIDER "
              "CONFIGURATION REMOVED"
          )
          PY

      - name: Test Groq environment contract
        env:
          GROQ_API_KEY: "fake-groq-test-key"
          SUPPORT_AI_PROVIDER: "groq"
          SUPPORT_AI_MODEL: "openai/gpt-oss-20b"
        run: |
          python - <<'PY'
          import paysupport_ai as ai

          assert (
              ai.SUPPORT_AI_API_KEY_ENV
              == "GROQ_API_KEY"
          )

          assert (
              ai.SUPPORT_AI_PROVIDER_ENV
              == "SUPPORT_AI_PROVIDER"
          )

          assert (
              ai.GROQ_BASE_URL
              == "https://api.groq.com/openai/v1"
          )

          assert (
              ai.get_support_ai_model()
              == "openai/gpt-oss-20b"
          )

          assert (
              ai.support_ai_is_configured()
              is True
          )

          print(
              "GROQ ENVIRONMENT CONTRACT OK"
          )
          PY

      - name: Test sensitive payment protection
        env:
          GROQ_API_KEY: "fake-groq-test-key"
          SUPPORT_AI_PROVIDER: "groq"
          SUPPORT_AI_MODEL: "openai/gpt-oss-20b"
        run: |
          python - <<'PY'
          from paysupport_ai import (
              DECISION_ESCALATE,
              analyze_support_ticket,
          )


          class ForbiddenClient:
              @property
              def responses(self):
                  raise AssertionError(
                      "Sensitive payment must "
                      "not call the AI provider"
                  )


          ticket = {
              "ticket_code": "AV-GROQ01",
              "language": "fr",
              "category": "premium",
              "product": "premium",
              "user_message": (
                  "J'ai payé 199 Stars mais "
                  "Premium n'est pas activé"
              ),
              "payment_amount_stars": 199,
          }

          result = analyze_support_ticket(
              ticket,
              client=ForbiddenClient(),
          )

          assert (
              result.decision
              == DECISION_ESCALATE
          )

          print(
              "SENSITIVE PAYMENT "
              "HUMAN FALLBACK OK"
          )
          PY

      - name: Test safe Groq decision contract
        env:
          GROQ_API_KEY: "fake-groq-test-key"
          SUPPORT_AI_PROVIDER: "groq"
          SUPPORT_AI_MODEL: "openai/gpt-oss-20b"
        run: |
          python - <<'PY'
          from types import SimpleNamespace

          from paysupport_ai import (
              DECISION_RESOLVE,
              SupportAIResult,
              analyze_support_ticket,
          )


          class FakeResponses:
              def parse(
                  self,
                  model,
                  input,
                  text_format,
              ):
                  assert (
                      model
                      == "openai/gpt-oss-20b"
                  )

                  assert (
                      text_format
                      is SupportAIResult
                  )

                  return SimpleNamespace(
                      output_parsed=(
                          SupportAIResult(
                              decision="resolve",
                              summary=(
                                  "Question produit."
                              ),
                              user_reply=(
                                  "Le Profil est un achat "
                                  "unique à 390 Stars. "
                                  "Premium est un abonnement "
                                  "à 199 Stars tous les "
                                  "30 jours."
                              ),
                              reason=(
                                  "Informational question"
                              ),
                          )
                      )
                  )


          class FakeClient:
              def __init__(self):
                  self.responses = FakeResponses()


          ticket = {
              "ticket_code": "AV-GROQ02",
              "language": "fr",
              "category": "other",
              "product": None,
              "user_message": (
                  "Quelle est la différence "
                  "entre le Profil et Premium ?"
              ),
          }

          result = analyze_support_ticket(
              ticket,
              client=FakeClient(),
          )

          assert (
              result.decision
              == DECISION_RESOLVE
          )

          assert "390" in result.user_reply
          assert "199" in result.user_reply

          print(
              "SAFE GROQ DECISION CONTRACT OK"
          )
          PY

      - name: Test unsupported provider fallback
        env:
          GROQ_API_KEY: "fake-groq-test-key"
          SUPPORT_AI_PROVIDER: "invalid-provider"
          SUPPORT_AI_MODEL: "openai/gpt-oss-20b"
        run: |
          python - <<'PY'
          from paysupport_ai import (
              DECISION_ESCALATE,
              analyze_support_ticket,
          )

          ticket = {
              "ticket_code": "AV-GROQ03",
              "language": "fr",
              "category": "other",
              "product": None,
              "user_message": (
                  "Quelle est l'offre Premium ?"
              ),
          }

          result = analyze_support_ticket(
              ticket
          )

          assert (
              result.decision
              == DECISION_ESCALATE
          )

          assert (
              result.reason
              == "Unsupported AI provider"
          )

          print(
              "UNSUPPORTED PROVIDER "
              "HUMAN FALLBACK OK"
          )
          PY

      - name: Verify human support preserved
        run: |
          grep -q "send_ticket_to_admin" bot.py
          grep -q "escalate_ticket" bot.py
          grep -q 'command_name == "/supportreply"' bot.py
          grep -q "process_admin_reply" bot.py
          grep -q "is_support_admin" bot.py

          echo "HUMAN SUPPORT PRESERVED"

      - name: Verify AI connection preserved
        run: |
          grep -q "ASTROVIBE SUPPORT AI ROUTING" bot.py
          grep -q "analyze_support_ticket" bot.py
          grep -q "save_ai_analysis" bot.py
          grep -q "build_ai_user_message" bot.py

          echo "AI SUPPORT CONNECTION PRESERVED"

      - name: Verify Profile Premium Terms preserved
        run: |
          grep -q "astrovibe_profile_v2:" bot.py
          grep -q "process_successful_profile_purchase" bot.py
          grep -q "astrovibe_premium:" bot.py
          grep -q "createInvoiceLink" bot.py
          grep -q 'command_name == "/terms"' bot.py
          grep -q "ASTROVIBE TERMS COMMAND" bot.py

          echo "PROFILE PRESERVED"
          echo "PREMIUM PRESERVED"
          echo "TERMS PRESERVED"

      - name: Verify runtime dependencies
        run: |
          grep -Eiq '^openai([<>=~!].*)?$' requirements.txt
          grep -Eiq '^pydantic([<>=~!].*)?$' requirements.txt

          echo "OPENAI CLIENT DEPENDENCY OK"
          echo "PYDANTIC DEPENDENCY OK"

      - name: Remove Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

          echo "PYTHON CACHE REMOVED"

      - name: Verify only AI engine changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {
              "paysupport_ai.py"
          }, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print(
              "ONLY PAYSUPPORT_AI.PY CHANGED"
          )
          PY

      - name: Show provider change
        run: |
          git diff -- paysupport_ai.py

      - name: Commit Groq provider
        run: |
          git add paysupport_ai.py

          if git diff --cached --quiet; then
            echo "No AI provider changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Switch payment support AI to Groq free tier"
          git push
