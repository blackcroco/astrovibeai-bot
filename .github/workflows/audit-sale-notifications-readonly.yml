name: Audit Sale Notifications Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-sale-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: |
          test -f bot.py

          echo "REPOSITORY READY"
          echo "SALE NOTIFICATION AUDIT IS READ ONLY"

      - name: Find payment related files
        run: |
          echo "======================================"
          echo "PAYMENT RELATED FILES"
          echo "======================================"

          find . \
            -maxdepth 2 \
            -type f \
            \( \
              -iname "*payment*.py" \
              -o -iname "*premium*.py" \
              -o -iname "*profile*.py" \
            \) \
            -not -path "./.git/*" \
            -print \
            | sort

      - name: Find successful payment handlers
        run: |
          echo "======================================"
          echo "SUCCESSFUL PAYMENT HANDLERS"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -E \
            'successful_payment|process_successful_profile_purchase|process_successful_premium_payment' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Find admin configuration
        run: |
          echo "======================================"
          echo "ADMIN CONFIGURATION"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -E \
            'SUPPORT_ADMIN_TELEGRAM_ID|ADMIN_TELEGRAM_ID|ADMIN_CHAT_ID|ADMIN_ID' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Find Profile payment references
        run: |
          echo "======================================"
          echo "PROFILE PAYMENT REFERENCES"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -E \
            'astrovibe_profile_v2|profile_purchase|process_successful_profile_purchase|390' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Find Premium payment references
        run: |
          echo "======================================"
          echo "PREMIUM PAYMENT REFERENCES"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -E \
            'astrovibe_premium|premium_subscription|process_successful_premium_payment|199' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Find admin Telegram sends
        run: |
          echo "======================================"
          echo "ADMIN TELEGRAM SEND REFERENCES"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -E \
            'send_message.*SUPPORT_ADMIN_TELEGRAM_ID|send_message.*ADMIN_TELEGRAM_ID|send_message.*ADMIN_CHAT_ID|send_message.*ADMIN_ID' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Find all admin references near Telegram sends
        run: |
          echo "======================================"
          echo "ADMIN AND SEND_MESSAGE REFERENCES"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -E \
            'SUPPORT_ADMIN_TELEGRAM_ID|ADMIN_TELEGRAM_ID|ADMIN_CHAT_ID|ADMIN_ID|send_message\(' \
            bot.py \
            profile_purchase_engine.py \
            premium_subscription_engine.py \
            premium_stars_payment.py \
            profile_stars_payment.py \
            2>/dev/null \
            || true

      - name: Find sale notification wording
        run: |
          echo "======================================"
          echo "SALE NOTIFICATION WORDING"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -Ei \
            'nouvel achat|nouvelle vente|nouvel abonnement|new sale|new purchase|new subscription|achat valid|vente valid|payment success|paiement réussi|paiement reussi|purchase successful|subscription activated' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Show successful payment context
        run: |
          echo "======================================"
          echo "SUCCESSFUL PAYMENT CONTEXT"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -B 15 \
            -A 40 \
            -E \
            'process_successful_profile_purchase|process_successful_premium_payment' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Show admin send context
        run: |
          echo "======================================"
          echo "ADMIN SEND CONTEXT"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -B 15 \
            -A 30 \
            -E \
            'SUPPORT_ADMIN_TELEGRAM_ID|ADMIN_TELEGRAM_ID|ADMIN_CHAT_ID|ADMIN_ID' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Compile payment stack
        run: |
          python -m py_compile bot.py

          for FILE in \
            profile_stars_payment.py \
            profile_purchase_engine.py \
            premium_stars_payment.py \
            premium_stars_handlers.py \
            premium_subscription_engine.py
          do
            if test -f "$FILE"; then
              python -m py_compile "$FILE"
            fi
          done

          echo "PAYMENT STACK COMPILES"

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Prove zero repository changes
        run: |
          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(git status --porcelain)"

          echo "NO REPOSITORY FILE CHANGED"

      - name: Final read only confirmation
        run: |
          echo "======================================"
          echo "SALE NOTIFICATION AUDIT COMPLETE"
          echo "======================================"
          echo "Files modified: 0"
          echo "Database writes: 0"
          echo "Telegram messages sent: 0"
          echo "Payments initiated: 0"
          echo "Profile rights changed: 0"
          echo "Premium rights changed: 0"
