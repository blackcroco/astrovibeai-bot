name: Connect Payment Support Admin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-paysupport-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f paysupport_admin.py
          test -f paysupport_engine.py
          test -f paysupport_flow.py
          test -f terms_engine.py
          test -f premium_stars_payment.py
          test -f profile_purchase_engine.py
          echo "REQUIRED FILES OK"

      - name: Create connection patch
        run: |
          cat > /tmp/connect_admin.py <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          admin_marker = (
              "# ASTROVIBE SUPPORT ADMIN ROUTING"
          )

          escalation_marker = (
              "# ASTROVIBE SUPPORT HUMAN ESCALATION"
          )

          if admin_marker in source:
              raise RuntimeError(
                  "Admin routing already installed"
              )

          if escalation_marker in source:
              raise RuntimeError(
                  "Human escalation already installed"
              )

          menu_position = source.find(
              "def menu(message):"
          )

          if menu_position == -1:
              raise RuntimeError(
                  "menu(message) not found"
              )

          paysupport_position = source.find(
              '    if command_name == "/paysupport":',
              menu_position,
          )

          if paysupport_position == -1:
              raise RuntimeError(
                  "Paysupport routing not found"
              )

          admin_lines = [
              "    # ASTROVIBE SUPPORT ADMIN ROUTING",
              "    if command_name == \"/supportreply\":",
              "        from paysupport_admin import (",
              "            get_admin_resolution_text,",
              "            is_support_admin,",
              "            process_admin_reply,",
              "        )",
              "",
              "        if not is_support_admin(user_id):",
              "            return",
              "",
              "        admin_result = process_admin_reply(",
              "            bot=bot,",
              "            get_db_connection=get_db_connection,",
              "            admin_user_id=user_id,",
              "            command_text=message.text,",
              "        )",
              "",
              "        bot.send_message(",
              "            message.chat.id,",
              "            get_admin_resolution_text(",
              "                admin_result",
              "            ),",
              "        )",
              "",
              "        return",
              "",
          ]

          admin_block = (
              "\n".join(admin_lines)
              + "\n"
          )

          source = (
              source[:paysupport_position]
              + admin_block
              + source[paysupport_position:]
          )

          ticket_function = source.find(
              "def create_paysupport_ticket("
          )

          if ticket_function == -1:
              raise RuntimeError(
                  "Ticket function not found"
              )

          ticket_creation = source.find(
              "        ticket = create_support_ticket(",
              ticket_function,
          )

          if ticket_creation == -1:
              raise RuntimeError(
                  "Ticket creation call not found"
              )

          confirmation_position = source.find(
              "        bot.send_message(",
              ticket_creation,
          )

          if confirmation_position == -1:
              raise RuntimeError(
                  "Ticket confirmation not found"
              )

          escalation_lines = [
              "        # ASTROVIBE SUPPORT HUMAN ESCALATION",
              "        from paysupport_admin import (",
              "            send_ticket_to_admin,",
              "        )",
              "",
              "        from paysupport_engine import (",
              "            escalate_ticket,",
              "            get_support_ticket,",
              "        )",
              "",
              "        escalated = escalate_ticket(",
              "            get_db_connection,",
              "            ticket[\"ticket_code\"],",
              "        )",
              "",
              "        if escalated:",
              "            escalated_ticket = get_support_ticket(",
              "                get_db_connection,",
              "                ticket[\"ticket_code\"],",
              "            )",
              "",
              "            if escalated_ticket:",
              "                admin_delivery = send_ticket_to_admin(",
              "                    bot,",
              "                    escalated_ticket,",
              "                )",
              "",
              "                if not admin_delivery.get(",
              "                    \"success\"",
              "                ):",
              "                    print(",
              "                        \"PAYSUPPORT ADMIN DELIVERY FAILED:\",",
              "                        admin_delivery.get(\"reason\"),",
              "                        flush=True,",
              "                    )",
              "",
          ]

          escalation_block = (
              "\n".join(escalation_lines)
              + "\n"
          )

          source = (
              source[:confirmation_position]
              + escalation_block
              + source[confirmation_position:]
          )

          path.write_text(
              source,
              encoding="utf-8",
          )

          print("ADMIN SUPPORT CONNECTED")
          PY

      - name: Validate patch
        run: |
          python -m py_compile /tmp/connect_admin.py

      - name: Apply patch
        run: |
          python /tmp/connect_admin.py

      - name: Compile production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_flow.py
          python -m py_compile terms_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_stars_payment.py

      - name: Verify admin connection
        run: |
          grep -q "ASTROVIBE SUPPORT ADMIN ROUTING" bot.py
          grep -q 'command_name == "/supportreply"' bot.py
          grep -q "process_admin_reply" bot.py
          grep -q "is_support_admin" bot.py
          grep -q "ASTROVIBE SUPPORT HUMAN ESCALATION" bot.py
          grep -q "send_ticket_to_admin" bot.py
          grep -q "escalate_ticket" bot.py

          echo "ADMIN CONNECTION OK"

      - name: Verify support preserved
        run: |
          grep -q 'command_name == "/paysupport"' bot.py
          grep -q "handle_paysupport_category" bot.py
          grep -q "create_paysupport_ticket" bot.py
          grep -q "create_support_ticket" bot.py

          echo "PAYMENT SUPPORT PRESERVED"

      - name: Verify Terms preserved
        run: |
          grep -q 'command_name == "/terms"' bot.py
          grep -q "ASTROVIBE TERMS COMMAND" bot.py

          echo "TERMS PRESERVED"

      - name: Verify Profile preserved
        run: |
          grep -q "astrovibe_profile_v2:" bot.py
          grep -q "process_successful_profile_purchase" bot.py
          grep -q "send_personal_profile" bot.py
          grep -q "init_profile_purchase_table" bot.py

          echo "PROFILE 390 STARS PRESERVED"

      - name: Verify Premium preserved
        run: |
          grep -q "astrovibe_premium:" bot.py
          grep -q "createInvoiceLink" bot.py
          grep -q "process_successful_premium_payment" bot.py
          grep -q "premium_subscription_buttons" bot.py

          echo "PREMIUM 199 STARS PRESERVED"

      - name: Remove Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Verify only bot.py changed
        run: |
          CHANGED="$(git diff --name-only)"

          echo "$CHANGED"

          if [ "$CHANGED" != "bot.py" ]; then
            echo "Unexpected changed files"
            exit 1
          fi

          echo "ONLY BOT.PY CHANGED"

      - name: Show final diff
        run: |
          git diff -- bot.py

      - name: Commit admin support connection
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Connect private payment support admin"
          git push
