name: Integrate Payment Support

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-paysupport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f paysupport_engine.py
          test -f terms_engine.py
          test -f premium_engine.py
          test -f premium_stars_payment.py
          test -f profile_purchase_engine.py
          echo "REQUIRED FILES OK"

      - name: Create paysupport flow
        run: |
          cat > paysupport_flow.py <<'PY'
          SUPPORT_CATEGORIES = {
              "profile": (
                  "✨ Profil Personnel",
                  "✨ Personal Profile",
              ),
              "premium": (
                  "💎 Premium",
                  "💎 Premium",
              ),
              "payment": (
                  "⭐ Paiement / Stars",
                  "⭐ Payment / Stars",
              ),
              "subscription": (
                  "🔄 Abonnement",
                  "🔄 Subscription",
              ),
              "refund": (
                  "↩️ Remboursement",
                  "↩️ Refund",
              ),
              "other": (
                  "❓ Autre",
                  "❓ Other",
              ),
          }


          def get_support_intro(language):
              if language == "en":
                  return (
                      "🆘 AstroVibe Payment Support\n\n"
                      "Choose the category that best "
                      "matches your problem."
                  )

              return (
                  "🆘 Support paiement AstroVibe\n\n"
                  "Choisis la catégorie qui correspond "
                  "le mieux à ton problème."
              )


          def get_category_label(
              category,
              language,
          ):
              labels = SUPPORT_CATEGORIES.get(
                  category
              )

              if not labels:
                  return None

              if language == "en":
                  return labels[1]

              return labels[0]


          def parse_category(data):
              prefix = "paysupport:"

              if not isinstance(data, str):
                  return None

              if not data.startswith(prefix):
                  return None

              category = data[len(prefix):]

              if category not in SUPPORT_CATEGORIES:
                  return None

              return category


          def get_prompt(
              category,
              language,
          ):
              label = get_category_label(
                  category,
                  language,
              )

              if language == "en":
                  return (
                      f"{label}\n\n"
                      "Describe your problem in one "
                      "message.\n\n"
                      "Never send passwords or Telegram "
                      "login codes."
                  )

              return (
                  f"{label}\n\n"
                  "Décris ton problème en un seul "
                  "message.\n\n"
                  "Ne transmets jamais de mot de passe "
                  "ou de code de connexion Telegram."
              )


          def get_product(category):
              if category == "profile":
                  return "profile"

              if category in (
                  "premium",
                  "subscription",
              ):
                  return "premium"

              return None


          def get_amount(category):
              if category == "profile":
                  return 390

              if category in (
                  "premium",
                  "subscription",
              ):
                  return 199

              return None
          PY

      - name: Compile paysupport flow
        run: |
          python -m py_compile paysupport_flow.py
          python -m py_compile paysupport_engine.py

      - name: Create patch script
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(
              encoding="utf-8"
          )

          marker = (
              "# ASTROVIBE PAYSUPPORT ROUTING"
          )

          if marker in source:
              raise RuntimeError(
                  "Paysupport already installed"
              )

          menu_start = source.find(
              "def menu(message):"
          )

          if menu_start == -1:
              raise RuntimeError(
                  "menu(message) not found"
              )

          terms_marker = (
              "# TERMS ROUTING IN MAIN MENU"
          )

          position = source.find(
              terms_marker,
              menu_start,
          )

          if position == -1:
              raise RuntimeError(
                  "Terms marker not found"
              )

          lines = [
              "    # ASTROVIBE PAYSUPPORT ROUTING",
              "    if command_name == \"/paysupport\":",
              "        from paysupport_flow import (",
              "            get_category_label,",
              "            get_support_intro,",
              "        )",
              "",
              "        markup = types.InlineKeyboardMarkup()",
              "",
              "        for category in (",
              "            \"profile\",",
              "            \"premium\",",
              "            \"payment\",",
              "            \"subscription\",",
              "            \"refund\",",
              "            \"other\",",
              "        ):",
              "            markup.add(",
              "                types.InlineKeyboardButton(",
              "                    text=get_category_label(",
              "                        category,",
              "                        language,",
              "                    ),",
              "                    callback_data=(",
              "                        \"paysupport:\"",
              "                        + category",
              "                    ),",
              "                )",
              "            )",
              "",
              "        bot.send_message(",
              "            message.chat.id,",
              "            get_support_intro(language),",
              "            reply_markup=markup,",
              "        )",
              "",
              "        return",
              "",
          ]

          block = "\n".join(lines) + "\n"

          source = (
              source[:position]
              + block
              + source[position:]
          )

          callback_marker = (
              "# PROFILE PURCHASE NEON CONNECTION"
          )

          callback_position = source.find(
              callback_marker
          )

          if callback_position == -1:
              raise RuntimeError(
                  "Callback insertion marker not found"
              )

          callback_lines = [
              "",
              "# ASTROVIBE PAYSUPPORT CALLBACK",
              "@bot.callback_query_handler(",
              "    func=lambda call: (",
              "        isinstance(call.data, str)",
              "        and call.data.startswith(",
              "            \"paysupport:\"",
              "        )",
              "    )",
              ")",
              "def handle_paysupport_category(call):",
              "    from paysupport_flow import (",
              "        get_prompt,",
              "        parse_category,",
              "    )",
              "",
              "    category = parse_category(",
              "        call.data",
              "    )",
              "",
              "    if not category:",
              "        bot.answer_callback_query(",
              "            call.id",
              "        )",
              "        return",
              "",
              "    language = get_user_language(",
              "        call.from_user.id",
              "    )",
              "",
              "    bot.answer_callback_query(",
              "        call.id",
              "    )",
              "",
              "    request = bot.send_message(",
              "        call.message.chat.id,",
              "        get_prompt(",
              "            category,",
              "            language,",
              "        ),",
              "    )",
              "",
              "    bot.register_next_step_handler(",
              "        request,",
              "        create_paysupport_ticket,",
              "        category,",
              "        language,",
              "    )",
              "",
              "",
              "def create_paysupport_ticket(",
              "    message,",
              "    category,",
              "    language,",
              "):",
              "    from paysupport_engine import (",
              "        create_support_ticket,",
              "        get_ticket_created_text,",
              "    )",
              "",
              "    from paysupport_flow import (",
              "        get_amount,",
              "        get_product,",
              "    )",
              "",
              "    if not isinstance(",
              "        message.text,",
              "        str,",
              "    ):",
              "        return",
              "",
              "    text = message.text.strip()",
              "",
              "    if not text:",
              "        return",
              "",
              "    try:",
              "        ticket = create_support_ticket(",
              "            get_db_connection,",
              "            message.from_user.id,",
              "            text,",
              "            language=language,",
              "            category=category,",
              "            product=get_product(",
              "                category",
              "            ),",
              "            payment_amount_stars=(",
              "                get_amount(category)",
              "            ),",
              "        )",
              "",
              "        bot.send_message(",
              "            message.chat.id,",
              "            get_ticket_created_text(",
              "                ticket",
              "            ),",
              "            reply_markup=main_menu(",
              "                language",
              "            ),",
              "        )",
              "",
              "    except Exception as error:",
              "        print(",
              "            \"PAYSUPPORT ERROR:\",",
              "            repr(error),",
              "            flush=True,",
              "        )",
              "",
              "",
          ]

          callback_block = (
              "\n".join(callback_lines)
              + "\n"
          )

          source = (
              source[:callback_position]
              + callback_block
              + source[callback_position:]
          )

          path.write_text(
              source,
              encoding="utf-8",
          )

          print("PAYSUPPORT PATCHED")
          PY

      - name: Validate patch script
        run: python -m py_compile /tmp/patch.py

      - name: Apply patch
        run: python /tmp/patch.py

      - name: Compile complete integration
        run: |
          python -m py_compile bot.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_flow.py
          python -m py_compile terms_engine.py
          python -m py_compile premium_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_purchase_engine.py

      - name: Test support flow
        run: |
          python - <<'PY'
          from paysupport_flow import (
              get_amount,
              get_category_label,
              get_product,
              get_support_intro,
              parse_category,
          )

          assert (
              parse_category(
                  "paysupport:profile"
              )
              == "profile"
          )

          assert (
              parse_category(
                  "paysupport:premium"
              )
              == "premium"
          )

          assert (
              parse_category(
                  "paysupport:refund"
              )
              == "refund"
          )

          assert (
              parse_category("wrong")
              is None
          )

          assert (
              get_product("profile")
              == "profile"
          )

          assert (
              get_product("premium")
              == "premium"
          )

          assert (
              get_amount("profile")
              == 390
          )

          assert (
              get_amount("premium")
              == 199
          )

          assert (
              "Support paiement AstroVibe"
              in get_support_intro("fr")
          )

          assert (
              "AstroVibe Payment Support"
              in get_support_intro("en")
          )

          assert (
              "Profil"
              in get_category_label(
                  "profile",
                  "fr",
              )
          )

          assert (
              "Profile"
              in get_category_label(
                  "profile",
                  "en",
              )
          )

          print("SUPPORT FLOW OK")
          PY

      - name: Verify bot routing
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "ASTROVIBE PAYSUPPORT ROUTING",
              'command_name == "/paysupport"',
              "ASTROVIBE PAYSUPPORT CALLBACK",
              "handle_paysupport_category",
              "register_next_step_handler",
              "create_paysupport_ticket",
              "create_support_ticket",
              "get_db_connection",
          )

          for marker in required:
              assert marker in source, marker
              print("OK:", marker)

          menu = source.find(
              "def menu(message):"
          )

          support = source.find(
              "# ASTROVIBE PAYSUPPORT ROUTING",
              menu,
          )

          fallback = source.find(
              '"unknown_request"',
              menu,
          )

          assert menu != -1
          assert support != -1
          assert fallback != -1
          assert support < fallback

          print(
              "PAYSUPPORT ROUTING VERIFIED"
          )
          PY

      - name: Verify Terms Profile Premium preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              'command_name == "/terms"',
              "astrovibe_profile_v2:",
              "process_successful_profile_purchase",
              "astrovibe_premium:",
              "createInvoiceLink",
              "process_successful_premium_payment",
              "send_personal_profile",
          )

          for marker in required:
              assert marker in source, marker
              print("PRESERVED:", marker)

          print(
              "TERMS PROFILE PREMIUM PRESERVED"
          )
          PY

      - name: Remove Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Verify expected files
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              ["git", "status", "--short"],
              check=True,
              capture_output=True,
              text=True,
          )

          print(result.stdout)

          allowed = {
              "bot.py",
              "paysupport_flow.py",
          }

          changed = set()

          for line in result.stdout.splitlines():
              if line.strip():
                  changed.add(
                      line[3:].strip()
                  )

          assert changed == allowed, (
              "Unexpected changes: "
              + repr(sorted(changed))
          )

          print(
              "ONLY SUPPORT FILES CHANGED"
          )
          PY

      - name: Show changes
        run: |
          git diff -- bot.py
          git diff --no-index /dev/null paysupport_flow.py || true

      - name: Commit payment support integration
        run: |
          git add bot.py paysupport_flow.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Integrate AstroVibe payment support"
          git push
