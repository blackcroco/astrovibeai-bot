name: Integrate Payment Support

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-paysupport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@        get_category_from_callback,",
              "        get_description_prompt,",
              "    )",
              "",
              "    user_id = call.from_user.id",
              "",
              "    language = get_user_language(",
              "        user_id",
              "    )",
              "",
              "    category = get_category_from_callback(",
              "        call.data",
              "    )",
              "",
              "    if category is None:",
              "        bot.answer_callback_query(",
              "            call.id,",
              "            text=(",
              "                \"Invalid support category\"",
              "            ),",
              "        )",
              "        return",
              "",
              "    bot.answer_callback_query(",
              "        call.id",
              "    )",
              "",
              "    prompt = get_description_prompt(",
              "        category,",
              "        language,",
              "    )",
              "",
              "    request_message = bot.send_message(",
              "        call.message.chat.id,",
              "        prompt,",
              "        reply_markup=(",
              "            types.ForceReply(",
              "                selective=True",
              "            )",
              "        ),",
              "    )",
              "",
              "    bot.register_next_step_handler(",
              "        request_message,",
              "        create_paysupport_ticket_from_message,",
              "        category,",
              "        language,",
              "    )",
              "",
              "",
              "def create_paysupport_ticket_from_message(",
              "    message,",
              "    category,",
              "    language,",
              "):",
              "    from paysupport_engine import (",
              "        create_support_ticket,",
              "        get_ticket_created_text,",
              "    )",
              "",
              "    from paysupport_flow import (",
              "        get_amount_for_category,",
              "        get_product_for_category,",
              "        get_support_error_text,",
              "    )",
              "",
              "    if (",
              "        not isinstance(",
              "            message.text,",
              "            str,",
              "        )",
              "        or not message.text.strip()",
              "    ):",
              "        bot.send_message(",
              "            message.chat.id,",
              "            get_support_error_text(",
              "                language",
              "            ),",
              "        )",
              "        return",
              "",
              "    try:",
              "        ticket = create_support_ticket(",
              "            get_db_connection=(",
              "                get_db_connection",
              "            ),",
              "            user_id=(",
              "                message.from_user.id",
              "            ),",
              "            user_message=(",
              "                message.text.strip()",
              "            ),",
              "            language=language,",
              "            category=category,",
              "            product=(",
              "                get_product_for_category(",
              "                    category",
              "                )",
              "            ),",
              "            payment_amount_stars=(",
              "                get_amount_for_category(",
              "                    category",
              "                )",
              "            ),",
              "        )",
              "",
              "        bot.send_message(",
              "            message.chat.id,",
              "            get_ticket_created_text(",
              "                ticket",
              "            ),",
              "            reply_markup=(",
              "                main_menu(",
              "                    language",
              "                )",
              "            ),",
              "        )",
              "",
              "    except Exception as error:",
              "        print(",
              "            \"PAYSUPPORT TICKET ERROR:\",",
              "            repr(error),",
              "            flush=True,",
              "        )",
              "",
              "        bot.send_message(",
              "            message.chat.id,",
              "            get_support_error_text(",
              "                language",
              "            ),",
              "            reply_markup=(",
              "                main_menu(",
              "                    language",
              "                )",
              "            ),",
              "        )",
              "",
          ]

          callback_block = (
              "\n".join(
                  callback_lines
              )
              + "\n\n"
          )

          insertion_marker = (
              "# PROFILE PURCHASE NEON CONNECTION"
          )

          callback_position = source.find(
              insertion_marker
          )

          if callback_position == -1:
              raise RuntimeError(
                  "Safe callback marker not found."
              )

          source = (
              source[:callback_position]
              + callback_block
              + source[callback_position:]
          )

          path.write_text(
              source,
              encoding="utf-8",
          )

          print(
              "PAYSUPPORT ROUTING PATCHED"
          )
          PY

          python /tmp/patch_paysupport.py

      - name: Compile complete support integration
        run: |
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_flow.py
          python -m py_compile bot.py
          python -m py_compile terms_engine.py
          python -m py_compile premium_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_purchase_engine.py

      - name: Test payment support flow
        run: |
          python - <<'PY'
          from paysupport_flow import (
              SUPPORT_CATEGORIES,
              get_support_intro,
              get_category_label,
              get_category_from_callback,
              get_product_for_category,
              get_amount_for_category,
              get_description_prompt,
          )

          assert len(
              SUPPORT_CATEGORIES
          ) == 6

          assert (
              "Support paiement AstroVibe"
              in get_support_intro("fr")
          )

          assert (
              "AstroVibe Payment Support"
              in get_support_intro("en")
          )

          assert (
              get_category_from_callback(
                  "paysupport:profile"
              )
              == "profile"
          )

          assert (
              get_category_from_callback(
                  "paysupport:premium"
              )
              == "premium"
          )

          assert (
              get_category_from_callback(
                  "paysupport:refund"
              )
              == "refund"
          )

          assert (
              get_category_from_callback(
                  "wrong:premium"
              )
              is None
          )

          assert (
              get_product_for_category(
                  "profile"
              )
              == "profile"
          )

          assert (
              get_product_for_category(
                  "premium"
              )
              == "premium"
          )

          assert (
              get_product_for_category(
                  "subscription"
              )
              == "premium"
          )

          assert (
              get_product_for_category(
                  "other"
              )
              is None
          )

          assert (
              get_amount_for_category(
                  "profile"
              )
              == 390
          )

          assert (
              get_amount_for_category(
                  "premium"
              )
              == 199
          )

          assert (
              get_amount_for_category(
                  "payment"
              )
              is None
          )

          assert (
              "Profil"
              in get_category_label(
                  "profile",
                  "fr",
              )
          )

          assert (
              "Profile"
              in get_category_label(
                  "profile",
                  "en",
              )
          )

          assert (
              "Décris"
              in get_description_prompt(
                  "premium",
                  "fr",
              )
          )

          assert (
              "Describe"
              in get_description_prompt(
                  "premium",
                  "en",
              )
          )

          print("PAYSUPPORT FLOW FR OK")
          print("PAYSUPPORT FLOW EN OK")
          PY

      - name: Verify paysupport routing
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "ASTROVIBE PAYSUPPORT ROUTING",
              'command_name == "/paysupport"',
              "paysupport:",
              "handle_paysupport_category",
              "register_next_step_handler",
              "create_paysupport_ticket_from_message",
              "create_support_ticket",
              "get_ticket_created_text",
              "get_db_connection",
              "PAYSUPPORT TICKET ERROR:",
          )

          for marker in required:
              assert marker in source, marker
              print(
                  "PAYSUPPORT OK:",
                  marker,
              )

          menu_start = source.find(
              "def menu(message):"
          )

          paysupport_position = source.find(
              "# ASTROVIBE PAYSUPPORT ROUTING",
              menu_start,
          )

          unknown_position = source.find(
              '"unknown_request"',
              menu_start,
          )

          assert menu_start != -1
          assert paysupport_position != -1
          assert unknown_position != -1

          assert (
              paysupport_position
              < unknown_position
          )

          print(
              "PAYSUPPORT EXECUTES "
              "BEFORE FALLBACK"
          )
          PY

      - name: Verify Terms preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "# TERMS ROUTING IN MAIN MENU",
              'command_name == "/terms"',
              "ASTROVIBE TERMS COMMAND",
          )

          for marker in required:
              assert marker in source, marker

          print("TERMS PRESERVED")
          PY

      - name: Verify Profile preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "astrovibe_profile_v2:",
              "process_successful_profile_purchase",
              "send_personal_profile",
              "init_profile_purchase_table",
          )

          for marker in required:
              assert marker in source, marker

          print(
              "PROFILE 390 STARS PRESERVED"
          )
          PY

      - name: Verify Premium preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "astrovibe_premium:",
              "createInvoiceLink",
              "process_premium_pre_checkout",
              "process_successful_premium_payment",
              "premium_subscription_buttons",
              "def is_premium",
          )

          for marker in required:
              assert marker in source, marker

          print(
              "PREMIUM 199 STARS PRESERVED"
          )
          PY

      - name: Remove Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          echo "PYTHON CACHE REMOVED"

      - name: Verify expected files changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "status",
                  "--short",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          print(result.stdout)

          allowed = {
              "bot.py",
              "paysupport_flow.py",
          }

          changed = set()

          for line in result.stdout.splitlines():
              if not line.strip():
                  continue

              changed.add(
                  line[3:].strip()
              )

          unexpected = (
              changed - allowed
          )

          assert not unexpected, (
              "Unexpected changed files: "
              + repr(sorted(unexpected))
          )

          assert "bot.py" in changed

          assert (
              "paysupport_flow.py"
              in changed
          )

          print(
              "ONLY SUPPORT FILES CHANGED"
          )
          PY

      - name: Show changes
        run: |
          git diff -- bot.py
          git diff --no-index /dev/null paysupport_flow.py || true

      - name: Commit payment support integration
        run: |
          git add bot.py paysupport_flow.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Integrate AstroVibe payment support"
          git push
