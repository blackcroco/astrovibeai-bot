name: Upgrade pyTelegramBotAPI For Premium

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-pytelegrambotapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify current requirements
        run: |
          test -f requirements.txt
          cat requirements.txt

      - name: Pin pyTelegramBotAPI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("requirements.txt")

          content = path.read_text(
              encoding="utf-8"
          )

          lines = content.splitlines()

          found = False
          updated = []

          for line in lines:
              stripped = line.strip()

              if stripped.lower().startswith(
                  "pytelegrambotapi"
              ):
                  updated.append(
                      "pyTelegramBotAPI==4.37.1"
                  )
                  found = True
              else:
                  updated.append(line)

          if not found:
              raise RuntimeError(
                  "pyTelegramBotAPI not found "
                  "in requirements.txt"
              )

          path.write_text(
              "\n".join(updated) + "\n",
              encoding="utf-8",
          )

          print(
              "PYTELEGRAMBOTAPI PINNED TO 4.37.1"
          )
          PY

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installed pyTelegramBotAPI version
        run: |
          python - <<'PY'
          import importlib.metadata

          version = importlib.metadata.version(
              "pyTelegramBotAPI"
          )

          print(
              "INSTALLED VERSION:",
              version,
          )

          assert version == "4.37.1", (
              "Expected pyTelegramBotAPI 4.37.1, "
              f"got {version}"
          )

          print(
              "PYTELEGRAMBOTAPI VERSION OK"
          )
          PY

      - name: Verify subscription period support
        run: |
          python - <<'PY'
          import inspect
          import telebot

          signature = inspect.signature(
              telebot.TeleBot.send_invoice
          )

          print(
              "SEND_INVOICE SIGNATURE:"
          )

          print(signature)

          parameters = (
              signature.parameters
          )

          assert (
              "subscription_period"
              in parameters
          ), (
              "pyTelegramBotAPI 4.37.1 "
              "does not expose "
              "subscription_period in "
              "TeleBot.send_invoice"
          )

          print(
              "SUBSCRIPTION_PERIOD SUPPORTED"
          )
          PY

      - name: Compile AstroVibe
        run: |
          python -m py_compile bot.py
          python -m py_compile premium_engine.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py
          python -m py_compile personal_profile_v2_engine.py

      - name: Verify Premium contract
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              build_premium_invoice,
          )

          invoice = build_premium_invoice(
              user_id=123456789,
              language="fr",
          )

          assert invoice["currency"] == "XTR"
          assert (
              invoice["prices"][0]["amount"]
              == 199
          )

          assert (
              invoice["subscription_period"]
              == 2592000
          )

          assert (
              invoice["payload"]
              == "astrovibe_premium:123456789"
          )

          print("PREMIUM PRICE OK: 199 XTR")
          print("PREMIUM PERIOD OK: 30 DAYS")
          print("PREMIUM CONTRACT OK")
          PY

      - name: Verify Profile purchase preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "astrovibe_profile_v2:",
              "process_successful_profile_purchase",
              "send_personal_profile",
              "init_profile_purchase_table",
          )

          for marker in required:
              assert marker in source, marker
              print(
                  "PROFILE OK:",
                  marker,
              )

          print(
              "PROFILE 390 STARS PRESERVED"
          )
          PY

      - name: Verify Premium connection preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "PREMIUM STARS INVOICE ENTRY",
              "astrovibe_premium:",
              "build_premium_invoice",
              "subscription_period",
              "process_premium_pre_checkout",
              "process_successful_premium_payment",
              "premium_subscription_buttons",
              "def is_premium",
          )

          for marker in required:
              assert marker in source, marker
              print(
                  "PREMIUM OK:",
                  marker,
              )

          print(
              "PREMIUM CONNECTION PRESERVED"
          )
          PY

      - name: Verify only requirements changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {
              "requirements.txt"
          }, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print(
              "ONLY REQUIREMENTS.TXT CHANGED"
          )
          PY

      - name: Show requirements change
        run: git diff -- requirements.txt

      - name: Commit dependency upgrade
        run: |
          git add requirements.txt

          if git diff --cached --quiet; then
            echo "No requirements change."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Upgrade pyTelegramBotAPI for Premium subscriptions"
          git push
