name: Add Referral Menu Button

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-referral-menu-button:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f referral_engine.py
          test -f paysupport_engine.py
          test -f paysupport_admin.py
          test -f paysupport_ai.py
          test -f premium_subscription_engine.py
          test -f profile_purchase_engine.py
          test -f terms_engine.py

          echo "REQUIRED FILES OK"

      - name: Verify Referral V1
        run: |
          grep -q \
            "ASTROVIBE REFERRAL START CAPTURE" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL FINALIZATION" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL INVITE ROUTING" \
            bot.py

          grep -q \
            'command_name == "/invite"' \
            bot.py

          grep -q \
            "build_invite_message" \
            bot.py

          echo "REFERRAL V1 FOUND"

      - name: Verify button not already installed
        run: |
          if grep -q \
            "ASTROVIBE REFERRAL MENU BUTTON" \
            bot.py
          then
            echo "Referral menu button already installed."
            exit 1
          fi

          if grep -q \
            "ASTROVIBE REFERRAL BUTTON ROUTING" \
            bot.py
          then
            echo "Referral button routing already installed."
            exit 1
          fi

          echo "REFERRAL BUTTON NOT PRESENT"

      - name: Create robust menu patch
        run: |
          cat > /tmp/add_referral_menu_button.py <<'PY'
          import ast
          from pathlib import Path


          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          tree = ast.parse(source)

          main_menu = None

          for node in tree.body:
              if (
                  isinstance(
                      node,
                      ast.FunctionDef,
                  )
                  and node.name == "main_menu"
              ):
                  main_menu = node
                  break

          if main_menu is None:
              raise RuntimeError(
                  "main_menu function not found."
              )


          # ==========================================
          # FIND RETURNED KEYBOARD VARIABLE
          # ==========================================

          return_node = None

          for node in reversed(
              main_menu.body
          ):
              if isinstance(
                  node,
                  ast.Return,
              ):
                  return_node = node
                  break

          if return_node is None:
              raise RuntimeError(
                  "main_menu return not found."
              )

          if not isinstance(
              return_node.value,
              ast.Name,
          ):
              raise RuntimeError(
                  "main_menu does not return "
                  "a simple keyboard variable."
              )

          keyboard_variable = (
              return_node.value.id
          )

          print(
              "MAIN MENU KEYBOARD VARIABLE:",
              keyboard_variable,
          )


          # ==========================================
          # VERIFY KEYBOARD VARIABLE IS USED
          # ==========================================

          keyboard_add_found = False

          for node in ast.walk(
              main_menu
          ):
              if not isinstance(
                  node,
                  ast.Call,
              ):
                  continue

              function = node.func

              if not isinstance(
                  function,
                  ast.Attribute,
              ):
                  continue

              owner = function.value

              if (
                  isinstance(
                      owner,
                      ast.Name,
                  )
                  and owner.id
                  == keyboard_variable
                  and function.attr
                  in {
                      "add",
                      "row",
                  }
              ):
                  keyboard_add_found = True
                  break

          if not keyboard_add_found:
              raise RuntimeError(
                  "Returned keyboard variable "
                  "has no add/row calls."
              )


          # ==========================================
          # INSERT BUTTON BEFORE RETURN
          # ==========================================

          lines = source.splitlines()

          insertion_index = (
              return_node.lineno - 1
          )

          base_indent = (
              len(
                  lines[
                      insertion_index
                  ]
              )
              - len(
                  lines[
                      insertion_index
                  ].lstrip()
              )
          )

          indent = " " * base_indent

          button_lines = [
              (
                  indent
                  + "# ASTROVIBE REFERRAL MENU BUTTON"
              ),
              (
                  indent
                  + "if language == \"en\":"
              ),
              (
                  indent
                  + "    referral_button_text = "
                  + "\"🤝 Invite a friend\""
              ),
              (
                  indent
                  + "else:"
              ),
              (
                  indent
                  + "    referral_button_text = "
                  + "\"🤝 Inviter un ami\""
              ),
              "",
              (
                  indent
                  + f"{keyboard_variable}.row("
              ),
              (
                  indent
                  + "    types.KeyboardButton("
              ),
              (
                  indent
                  + "        referral_button_text"
              ),
              (
                  indent
                  + "    )"
              ),
              (
                  indent
                  + ")"
              ),
              "",
          ]

          lines[
              insertion_index:
              insertion_index
          ] = button_lines

          updated = (
              "\n".join(lines)
              + "\n"
          )

          ast.parse(
              updated
          )

          path.write_text(
              updated,
              encoding="utf-8",
          )

          print(
              "REFERRAL MENU BUTTON ADDED"
          )
          PY

      - name: Validate menu patch
        run: |
          python -m py_compile \
            /tmp/add_referral_menu_button.py

          echo "MENU PATCH VALID"

      - name: Apply menu patch
        run: |
          python \
            /tmp/add_referral_menu_button.py

      - name: Create button routing patch
        run: |
          cat > /tmp/add_referral_button_routing.py <<'PY'
          from pathlib import Path


          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          marker = (
              "# ASTROVIBE REFERRAL BUTTON ROUTING"
          )

          if marker in source:
              raise RuntimeError(
                  "Referral button routing "
                  "already installed."
              )

          invite_marker = (
              "# ASTROVIBE REFERRAL INVITE ROUTING"
          )

          position = source.find(
              invite_marker
          )

          if position == -1:
              raise RuntimeError(
                  "Existing invite routing "
                  "not found."
              )

          lines = [
              (
                  "    # ASTROVIBE REFERRAL "
                  "BUTTON ROUTING"
              ),
              "    if message_text in (",
              "        \"🤝 Inviter un ami\",",
              "        \"🤝 Invite a friend\",",
              "    ):",
              "        from referral_engine import (",
              "            build_invite_message,",
              "            get_referral_stats,",
              "        )",
              "",
              "        referral_stats = (",
              "            get_referral_stats(",
              "                get_db_connection,",
              "                user_id,",
              "            )",
              "        )",
              "",
              "        invite_text = (",
              "            build_invite_message(",
              "                user_id,",
              "                language,",
              "            )",
              "        )",
              "",
              "        if language == \"en\":",
              "            invite_text += (",
              "                \"\\n\\n📊 Successful referrals: \"",
              "                + str(",
              "                    referral_stats[",
              "                        \"successful_referrals\"",
              "                    ]",
              "                )",
              "                + (",
              "                    \"\\n⭐ Referral points \"",
              "                    \"earned: \"",
              "                )",
              "                + str(",
              "                    referral_stats[",
              "                        \"points_earned\"",
              "                    ]",
              "                )",
              "            )",
              "        else:",
              "            invite_text += (",
              "                \"\\n\\n📊 Parrainages réussis : \"",
              "                + str(",
              "                    referral_stats[",
              "                        \"successful_referrals\"",
              "                    ]",
              "                )",
              "                + (",
              "                    \"\\n⭐ Points gagnés par \"",
              "                    \"parrainage : \"",
              "                )",
              "                + str(",
              "                    referral_stats[",
              "                        \"points_earned\"",
              "                    ]",
              "                )",
              "            )",
              "",
              "        bot.send_message(",
              "            message.chat.id,",
              "            invite_text,",
              "            reply_markup=main_menu(",
              "                language",
              "            ),",
              "        )",
              "",
              "        return",
              "",
          ]

          block = (
              "\n".join(lines)
              + "\n"
          )

          updated = (
              source[:position]
              + block
              + source[position:]
          )

          path.write_text(
              updated,
              encoding="utf-8",
          )

          print(
              "REFERRAL BUTTON ROUTING ADDED"
          )
          PY

      - name: Validate routing patch
        run: |
          python -m py_compile \
            /tmp/add_referral_button_routing.py

          echo "ROUTING PATCH VALID"

      - name: Apply button routing patch
        run: |
          python \
            /tmp/add_referral_button_routing.py

      - name: Compile production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile referral_engine.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_ai.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile terms_engine.py

          echo "PRODUCTION STACK COMPILES"

      - name: Verify referral button
        run: |
          grep -q \
            "ASTROVIBE REFERRAL MENU BUTTON" \
            bot.py

          grep -q \
            "🤝 Inviter un ami" \
            bot.py

          grep -q \
            "🤝 Invite a friend" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL BUTTON ROUTING" \
            bot.py

          echo "REFERRAL MENU BUTTON VERIFIED"

      - name: Verify invite command preserved
        run: |
          grep -q \
            'command_name == "/invite"' \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL INVITE ROUTING" \
            bot.py

          grep -q \
            "build_invite_message" \
            bot.py

          grep -q \
            "get_referral_stats" \
            bot.py

          echo "/invite PRESERVED"

      - name: Verify Referral V1 security
        run: |
          grep -q \
            "self_referral" \
            referral_engine.py

          grep -q \
            "existing_user" \
            referral_engine.py

          grep -q \
            "ON CONFLICT" \
            referral_engine.py

          grep -q \
            "FOR UPDATE" \
            referral_engine.py

          grep -q \
            "registration_incomplete" \
            referral_engine.py

          echo "REFERRAL SECURITY PRESERVED"

      - name: Verify Profile preserved
        run: |
          grep -q \
            "astrovibe_profile_v2:" \
            bot.py

          grep -q \
            "process_successful_profile_purchase" \
            bot.py

          grep -q \
            "send_personal_profile" \
            bot.py

          echo "PROFILE 390 STARS PRESERVED"

      - name: Verify Premium preserved
        run: |
          grep -q \
            "astrovibe_premium:" \
            bot.py

          grep -q \
            "createInvoiceLink" \
            bot.py

          grep -q \
            "process_successful_premium_payment" \
            bot.py

          echo "PREMIUM 199 STARS PRESERVED"

      - name: Verify support and terms preserved
        run: |
          grep -q \
            'command_name == "/terms"' \
            bot.py

          grep -q \
            'command_name == "/paysupport"' \
            bot.py

          grep -q \
            'command_name == "/supportreply"' \
            bot.py

          grep -q \
            "ASTROVIBE SUPPORT AI ROUTING" \
            bot.py

          grep -q \
            "send_ticket_to_admin" \
            bot.py

          echo "TERMS PRESERVED"
          echo "AI SUPPORT PRESERVED"
          echo "HUMAN SUPPORT PRESERVED"

      - name: Verify payment separation
        run: |
          if grep -Eq \
            'createInvoiceLink|successful_payment|refundStarsCharge|premium_subscriptions|profile_purchases' \
            referral_engine.py
          then
            echo "Referral engine touches payments."
            exit 1
          fi

          echo "PAYMENT SYSTEMS SEPARATE"

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {
              "bot.py"
          }, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print(
              "ONLY BOT.PY CHANGED"
          )
          PY

      - name: Show final menu change
        run: |
          git diff -- bot.py

      - name: Commit referral menu button
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py changes."
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Add referral button to AstroVibe menu"

          git push
