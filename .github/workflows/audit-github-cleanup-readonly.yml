name: Audit GitHub Cleanup Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-github-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: |
          test -f bot.py
          test -d .github/workflows

          echo "REPOSITORY READY"
          echo "READ ONLY CLEANUP AUDIT"

      - name: Workflow depth summary
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".github/workflows")

          root_files = []
          nested_files = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in {
                  ".yml",
                  ".yaml",
              }:
                  continue

              relative = path.relative_to(root)

              if len(relative.parts) == 1:
                  root_files.append(str(relative))
              else:
                  nested_files.append(str(relative))

          print("=" * 40)
          print("WORKFLOW DEPTH SUMMARY")
          print("=" * 40)

          print(
              "ROOT WORKFLOW COUNT:",
              len(root_files),
          )

          print(
              "NESTED WORKFLOW COUNT:",
              len(nested_files),
          )

          print()
          print("ROOT WORKFLOWS")

          for item in sorted(root_files):
              print("  ", item)

          print()
          print("NESTED WORKFLOWS")

          if not nested_files:
              print("  none")

          for item in sorted(nested_files):
              print("  ", item)
          PY

      - name: Duplicate workflow filenames
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          root = Path(".github/workflows")

          files_by_name = defaultdict(list)

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in {
                  ".yml",
                  ".yaml",
              }:
                  continue

              files_by_name[path.name].append(
                  str(path)
              )

          print("=" * 40)
          print("DUPLICATE WORKFLOW FILENAMES")
          print("=" * 40)

          found = False

          for name in sorted(files_by_name):
              paths = files_by_name[name]

              if len(paths) < 2:
                  continue

              found = True

              print()
              print("DUPLICATE:", name)

              for path in sorted(paths):
                  print("  ", path)

          if not found:
              print(
                  "NO DUPLICATE FILENAMES FOUND"
              )
          PY

      - name: Workflow name classification
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".github/workflows")

          groups = {
              "TEST": [],
              "AUDIT": [],
              "INTEGRATION": [],
              "FIX_PATCH": [],
              "OTHER": [],
          }

          for path in root.iterdir():
              if not path.is_file():
                  continue

              if path.suffix not in {
                  ".yml",
                  ".yaml",
              }:
                  continue

              name = path.name.lower()

              if name.startswith("test"):
                  category = "TEST"

              elif name.startswith("audit"):
                  category = "AUDIT"

              elif name.startswith(
                  (
                      "integrate",
                      "connect",
                      "switch",
                      "add-",
                  )
              ):
                  category = "INTEGRATION"

              elif (
                  name.startswith("fix")
                  or "patch" in name
                  or "diagnostic" in name
                  or "debug" in name
              ):
                  category = "FIX_PATCH"

              else:
                  category = "OTHER"

              groups[category].append(
                  path.name
              )

          print("=" * 40)
          print("WORKFLOW NAME CLASSIFICATION")
          print("=" * 40)

          for category, files in groups.items():
              print()
              print(category)

              if not files:
                  print("  none")
                  continue

              for filename in sorted(files):
                  print("  ", filename)
          PY

      - name: Find workflows with write permissions
        run: |
          echo "======================================"
          echo "WRITE PERMISSION WORKFLOWS"
          echo "======================================"

          grep -Rni \
            --include="*.yml" \
            --include="*.yaml" \
            -E 'contents:[[:space:]]*write' \
            .github/workflows \
            || true

      - name: Find workflows that push commits
        run: |
          echo "======================================"
          echo "WORKFLOWS THAT PUSH COMMITS"
          echo "======================================"

          grep -Rni \
            --include="*.yml" \
            --include="*.yaml" \
            -E 'git push|git commit' \
            .github/workflows \
            || true

      - name: Find audit workflow candidates
        run: |
          echo "======================================"
          echo "AUDIT WORKFLOW CANDIDATES"
          echo "======================================"

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -name "audit-*.yml" \
            -print \
            | sort

      - name: Find integration workflow candidates
        run: |
          echo "======================================"
          echo "INTEGRATION WORKFLOW CANDIDATES"
          echo "======================================"

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            \( \
              -name "integrate-*.yml" \
              -o -name "connect-*.yml" \
              -o -name "switch-*.yml" \
              -o -name "add-*.yml" \
            \) \
            -print \
            | sort

      - name: Find permanent test candidates
        run: |
          echo "======================================"
          echo "PERMANENT TEST CANDIDATES"
          echo "======================================"

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -name "test-*.yml" \
            -print \
            | sort

      - name: Find bot debug commands
        run: |
          echo "======================================"
          echo "BOT DEBUG COMMANDS"
          echo "======================================"

          grep -nEi \
            'profile_test|location_test|debug|diagnostic|test_command|commands=.*test' \
            bot.py \
            || true

      - name: Find temporary Python markers
        run: |
          echo "======================================"
          echo "TEMPORARY PYTHON MARKERS"
          echo "======================================"

          grep -Rni \
            --include="*.py" \
            -E 'DEBUG|DIAGNOSTIC|TEMPORARY|TEST ONLY|REMOVE AFTER|FIXME' \
            . \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" \
            || true

      - name: Find YAML outside workflows
        run: |
          echo "======================================"
          echo "YAML OUTSIDE WORKFLOW DIRECTORY"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name "*.yml" \
              -o -name "*.yaml" \
            \) \
            -not -path "./.git/*" \
            -not -path "./.github/workflows/*" \
            -print \
            | sort

      - name: Prove zero repository changes
        run: |
          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(git status --porcelain)"

          echo "NO REPOSITORY FILE CHANGED"

      - name: Final read only confirmation
        run: |
          echo "======================================"
          echo "GITHUB CLEANUP AUDIT COMPLETE"
          echo "======================================"
          echo "Files deleted: 0"
          echo "Files modified: 0"
          echo "Database writes: 0"
          echo "Telegram messages: 0"
          echo "Points modified: 0"
          echo "Payments touched: 0"
