name: Restore working bot.py

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore bot.py from working commit
        run: |
          git checkout b1012c9736b45802a5b3b47b6341dbd79789c75b -- bot.py

      - name: Commit and push restored bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Restore working bot.py"
          git push origin HEAD:main
