name: Integrate Level Rewards V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-level-rewards-v1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f referral_engine.py
          test -f paysupport_engine.py
          test -f paysupport_admin.py
          test -f paysupport_ai.py
          test -f premium_subscription_engine.py
          test -f profile_purchase_engine.py
          test -f terms_engine.py

          echo "REQUIRED FILES OK"

      - name: Verify existing level system
        run: |
          grep -q "def calculate_level(points):" bot.py
          grep -q "if points >= 1000:" bot.py
          grep -q "if points >= 500:" bot.py
          grep -q "if points >= 250:" bot.py
          grep -q "if points >= 100:" bot.py
          grep -q "if points >= 40:" bot.py

          grep -q "Observateur céleste" bot.py
          grep -q "Explorateur du Zodiaque" bot.py
          grep -q "Gardien des étoiles" bot.py
          grep -q "Oracle cosmique" bot.py
          grep -q "Maître du Zodiaque" bot.py
          grep -q "Légende astrale" bot.py

          echo "EXISTING LEVEL SYSTEM VERIFIED"

      - name: Verify rewards are not already integrated
        run: |
          if test -f level_rewards_engine.py; then
            echo "level_rewards_engine.py already exists."
            exit 1
          fi

          if grep -q \
            "ASTROVIBE LEVEL REWARDS ROUTING" \
            bot.py
          then
            echo "Level rewards routing already exists."
            exit 1
          fi

          if grep -q \
            "ASTROVIBE LEVEL REWARDS HINT" \
            bot.py
          then
            echo "Level rewards hint already exists."
            exit 1
          fi

          echo "LEVEL REWARDS NOT PRESENT"

      - name: Create level rewards engine
        run: |
          cat > level_rewards_engine.py <<'PY'
          # ==========================================
          # ASTROVIBE LEVEL REWARDS V1
          # ==========================================
          #
          # Points remain cumulative experience.
          # This engine never writes to the database,
          # never removes points and never grants
          # Premium, Profile access or Telegram Stars.
          # ==========================================


          LEVEL_THRESHOLDS = {
              1: 0,
              2: 40,
              3: 100,
              4: 250,
              5: 500,
              6: 1000,
          }


          LEVEL_NAMES_FR = {
              1: "Observateur céleste",
              2: "Explorateur du Zodiaque",
              3: "Gardien des étoiles",
              4: "Oracle cosmique",
              5: "Maître du Zodiaque",
              6: "Légende astrale",
          }


          LEVEL_NAMES_EN = {
              1: "Celestial Observer",
              2: "Zodiac Explorer",
              3: "Guardian of the Stars",
              4: "Cosmic Oracle",
              5: "Zodiac Master",
              6: "Astral Legend",
          }


          REWARD_NAMES_FR = {
              2: "🔭 Insight céleste",
              3: "⭐ Message des astres",
              4: "🔮 Focus cosmique",
              5: "🌌 Guidance astrale",
              6: "🏆 Lecture Légende",
          }


          REWARD_NAMES_EN = {
              2: "🔭 Celestial Insight",
              3: "⭐ Message from the Stars",
              4: "🔮 Cosmic Focus",
              5: "🌌 Astral Guidance",
              6: "🏆 Legend Reading",
          }


          SIGN_GUIDANCE_FR = {
              "Bélier": (
                  "Ton énergie avance vite. Choisis "
                  "aujourd'hui une action claire et "
                  "termine-la avant d'en commencer une autre."
              ),
              "Taureau": (
                  "Ta stabilité est une force. Protège ce "
                  "qui compte tout en laissant une petite "
                  "place au changement."
              ),
              "Gémeaux": (
                  "Tes idées ont besoin d'un fil conducteur. "
                  "Note l'essentiel avant de te disperser."
              ),
              "Cancer": (
                  "Ton intuition capte les nuances. Écoute-la "
                  "sans porter les émotions des autres."
              ),
              "Lion": (
                  "Ton rayonnement grandit lorsque ta "
                  "confiance sert une intention sincère."
              ),
              "Vierge": (
                  "Ton sens du détail peut transformer une "
                  "petite amélioration en vrai progrès."
              ),
              "Balance": (
                  "Cherche l'équilibre sans repousser une "
                  "décision qui mérite d'être prise."
              ),
              "Scorpion": (
                  "Ta profondeur révèle ce qui doit évoluer. "
                  "Concentre ton énergie sur l'essentiel."
              ),
              "Sagittaire": (
                  "Ton élan ouvre des horizons. Donne-lui "
                  "une direction concrète aujourd'hui."
              ),
              "Capricorne": (
                  "Ta constance construit loin. Avance par "
                  "une étape simple mais solide."
              ),
              "Verseau": (
                  "Ton regard original éclaire une solution "
                  "que les habitudes ne montrent pas."
              ),
              "Poissons": (
                  "Ta sensibilité nourrit l'inspiration. "
                  "Ancre une intuition dans une action réelle."
              ),
          }


          SIGN_GUIDANCE_EN = {
              "Aries": (
                  "Your energy moves quickly. Choose one "
                  "clear action today and finish it before "
                  "starting another."
              ),
              "Taurus": (
                  "Your stability is a strength. Protect "
                  "what matters while leaving some room "
                  "for change."
              ),
              "Gemini": (
                  "Your ideas need a guiding thread. Write "
                  "down the essential before spreading "
                  "your attention too widely."
              ),
              "Cancer": (
                  "Your intuition notices subtle details. "
                  "Listen to it without carrying everyone "
                  "else's emotions."
              ),
              "Leo": (
                  "Your presence grows when confidence "
                  "serves a sincere intention."
              ),
              "Virgo": (
                  "Your attention to detail can turn one "
                  "small improvement into real progress."
              ),
              "Libra": (
                  "Seek balance without postponing a "
                  "decision that deserves to be made."
              ),
              "Scorpio": (
                  "Your depth reveals what needs to evolve. "
                  "Focus your energy on what truly matters."
              ),
              "Sagittarius": (
                  "Your momentum opens new horizons. Give "
                  "it one concrete direction today."
              ),
              "Capricorn": (
                  "Your consistency builds for the long "
                  "term. Take one simple but solid step."
              ),
              "Aquarius": (
                  "Your original perspective reveals a "
                  "solution that habit cannot see."
              ),
              "Pisces": (
                  "Your sensitivity feeds inspiration. "
                  "Ground one intuition in a real action."
              ),
          }


          def normalize_points(value):
              try:
                  points = int(value)
              except (TypeError, ValueError):
                  return 0

              return max(points, 0)


          def calculate_reward_level(points):
              normalized = normalize_points(points)

              if normalized >= 1000:
                  return 6

              if normalized >= 500:
                  return 5

              if normalized >= 250:
                  return 4

              if normalized >= 100:
                  return 3

              if normalized >= 40:
                  return 2

              return 1


          def get_level_name(level, language="fr"):
              names = (
                  LEVEL_NAMES_EN
                  if language == "en"
                  else LEVEL_NAMES_FR
              )

              return names.get(
                  int(level or 1),
                  names[1],
              )


          def get_unlocked_rewards(points):
              level = calculate_reward_level(
                  points
              )

              return [
                  reward_level
                  for reward_level
                  in range(2, 7)
                  if reward_level <= level
              ]


          def get_next_reward(points):
              normalized = normalize_points(points)

              for level in range(2, 7):
                  threshold = LEVEL_THRESHOLDS[
                      level
                  ]

                  if normalized < threshold:
                      return {
                          "level": level,
                          "threshold": threshold,
                          "remaining": (
                              threshold
                              - normalized
                          ),
                      }

              return None


          def build_rewards_summary(
              points,
              language="fr",
          ):
              normalized = normalize_points(
                  points
              )

              level = calculate_reward_level(
                  normalized
              )

              names = (
                  REWARD_NAMES_EN
                  if language == "en"
                  else REWARD_NAMES_FR
              )

              output = []

              if language == "en":
                  output.extend(
                      [
                          "🎁 Your AstroVibe rewards",
                          "",
                          (
                              f"⭐ Points: {normalized}"
                          ),
                          (
                              "🏆 Level "
                              f"{level}: "
                              f"{get_level_name(level, language)}"
                          ),
                          "",
                      ]
                  )
              else:
                  output.extend(
                      [
                          "🎁 Tes récompenses AstroVibe",
                          "",
                          (
                              f"⭐ Points : {normalized}"
                          ),
                          (
                              "🏆 Niveau "
                              f"{level} : "
                              f"{get_level_name(level, language)}"
                          ),
                          "",
                      ]
                  )

              for reward_level in range(2, 7):
                  threshold = LEVEL_THRESHOLDS[
                      reward_level
                  ]

                  reward_name = names[
                      reward_level
                  ]

                  if level >= reward_level:
                      output.append(
                          f"✅ {reward_name}"
                      )
                  else:
                      output.append(
                          (
                              f"🔒 {reward_name} "
                              f"— {threshold} points"
                          )
                      )

              next_reward = get_next_reward(
                  normalized
              )

              output.append("")

              if next_reward is None:
                  if language == "en":
                      output.append(
                          "🏆 All level rewards unlocked."
                      )
                  else:
                      output.append(
                          "🏆 Toutes les récompenses "
                          "de niveau sont débloquées."
                      )
              else:
                  if language == "en":
                      output.append(
                          "📈 "
                          f"{next_reward['remaining']} "
                          "points until the next reward."
                      )
                  else:
                      output.append(
                          "📈 Plus que "
                          f"{next_reward['remaining']} "
                          "points avant la prochaine "
                          "récompense."
                      )

              if level >= 2:
                  output.append("")

                  if language == "en":
                      output.append(
                          "Use /rewards to read your "
                          "unlocked celestial guidance."
                      )
                  else:
                      output.append(
                          "Utilise /rewards pour lire "
                          "tes guidances célestes "
                          "débloquées."
                      )

              return "\n".join(output)


          def _normalize_sign(
              sign,
              language,
          ):
              if not isinstance(sign, str):
                  return "Aries" if language == "en" else "Bélier"

              normalized = sign.strip()

              if not normalized:
                  return "Aries" if language == "en" else "Bélier"

              return normalized


          def _base_guidance(
              sign,
              language,
          ):
              normalized_sign = _normalize_sign(
                  sign,
                  language,
              )

              mapping = (
                  SIGN_GUIDANCE_EN
                  if language == "en"
                  else SIGN_GUIDANCE_FR
              )

              fallback = (
                  "Your celestial rhythm invites you to "
                  "observe, choose and act with intention."
                  if language == "en"
                  else
                  "Ton rythme céleste t'invite à observer, "
                  "choisir et agir avec intention."
              )

              return mapping.get(
                  normalized_sign,
                  fallback,
              )


          def build_unlocked_content(
              points,
              sign=None,
              language="fr",
          ):
              normalized = normalize_points(
                  points
              )

              level = calculate_reward_level(
                  normalized
              )

              sign_text = _normalize_sign(
                  sign,
                  language,
              )

              guidance = _base_guidance(
                  sign_text,
                  language,
              )

              output = []

              if language == "en":
                  output.extend(
                      [
                          "🌟 AstroVibe Level Rewards",
                          "",
                          (
                              f"🏆 Level {level}: "
                              f"{get_level_name(level, language)}"
                          ),
                          (
                              f"🔮 Sign: {sign_text}"
                          ),
                      ]
                  )
              else:
                  output.extend(
                      [
                          "🌟 Récompenses de niveau AstroVibe",
                          "",
                          (
                              f"🏆 Niveau {level} : "
                              f"{get_level_name(level, language)}"
                          ),
                          (
                              f"🔮 Signe : {sign_text}"
                          ),
                      ]
                  )

              if level == 1:
                  output.append("")

                  if language == "en":
                      output.append(
                          "🔒 Your first celestial reward "
                          "unlocks at 40 points."
                      )
                  else:
                      output.append(
                          "🔒 Ta première récompense "
                          "céleste se débloque à 40 points."
                      )

                  return "\n".join(output)

              output.extend(
                  [
                      "",
                      (
                          "🔭 Celestial Insight"
                          if language == "en"
                          else
                          "🔭 Insight céleste"
                      ),
                      guidance,
                  ]
              )

              if level >= 3:
                  output.extend(
                      [
                          "",
                          (
                              "⭐ Message from the Stars"
                              if language == "en"
                              else
                              "⭐ Message des astres"
                          ),
                          (
                              "Turn one recurring thought "
                              "into one useful decision. "
                              "Clarity grows through action."
                              if language == "en"
                              else
                              "Transforme une pensée récurrente "
                              "en une décision utile. La clarté "
                              "grandit dans l'action."
                          ),
                      ]
                  )

              if level >= 4:
                  output.extend(
                      [
                          "",
                          (
                              "🔮 Cosmic Focus"
                              if language == "en"
                              else
                              "🔮 Focus cosmique"
                          ),
                          (
                              "Choose one priority for the "
                              "next seven days. Protect time "
                              "for it and observe the result."
                              if language == "en"
                              else
                              "Choisis une priorité pour les "
                              "sept prochains jours. Protège "
                              "du temps pour elle et observe "
                              "le résultat."
                          ),
                      ]
                  )

              if level >= 5:
                  output.extend(
                      [
                          "",
                          (
                              "🌌 Astral Guidance"
                              if language == "en"
                              else
                              "🌌 Guidance astrale"
                          ),
                          (
                              "Your progress now comes from "
                              "alignment rather than speed. "
                              "Keep what supports your path "
                              "and release one distraction."
                              if language == "en"
                              else
                              "Ta progression vient maintenant "
                              "de l'alignement plutôt que de la "
                              "vitesse. Garde ce qui soutient "
                              "ton chemin et libère-toi d'une "
                              "distraction."
                          ),
                      ]
                  )

              if level >= 6:
                  output.extend(
                      [
                          "",
                          (
                              "🏆 Legend Reading"
                              if language == "en"
                              else
                              "🏆 Lecture Légende"
                          ),
                          (
                              "You have reached AstroVibe's "
                              "highest loyalty level. Your "
                              "consistency, curiosity and "
                              "sharing form your astral legacy."
                              if language == "en"
                              else
                              "Tu as atteint le plus haut "
                              "niveau de fidélité AstroVibe. "
                              "Ta constance, ta curiosité et "
                              "tes partages forment désormais "
                              "ton héritage astral."
                          ),
                      ]
                  )

              output.append("")

              if language == "en":
                  output.append(
                      "These rewards complement but do not "
                      "replace the Personal Profile or Premium."
                  )
              else:
                  output.append(
                      "Ces récompenses complètent, sans les "
                      "remplacer, le Profil Personnel et Premium."
                  )

              return "\n".join(output)
          PY

          echo "LEVEL REWARDS ENGINE CREATED"

      - name: Compile level rewards engine
        run: |
          python -m py_compile \
            level_rewards_engine.py

          echo "LEVEL REWARDS ENGINE COMPILES"

      - name: Test exact level boundaries
        run: |
          python - <<'PY'
          from level_rewards_engine import (
              calculate_reward_level,
          )

          expected = {
              0: 1,
              39: 1,
              40: 2,
              99: 2,
              100: 3,
              249: 3,
              250: 4,
              499: 4,
              500: 5,
              999: 5,
              1000: 6,
              5000: 6,
          }

          for points, level in expected.items():
              actual = calculate_reward_level(
                  points
              )

              assert actual == level, (
                  points,
                  actual,
                  level,
              )

          print(
              "EXACT LEVEL BOUNDARIES OK"
          )
          PY

      - name: Test reward visibility
        run: |
          python - <<'PY'
          from level_rewards_engine import (
              build_rewards_summary,
              get_unlocked_rewards,
          )

          assert get_unlocked_rewards(
              39
          ) == []

          assert get_unlocked_rewards(
              40
          ) == [2]

          assert get_unlocked_rewards(
              100
          ) == [2, 3]

          assert get_unlocked_rewards(
              250
          ) == [2, 3, 4]

          assert get_unlocked_rewards(
              500
          ) == [2, 3, 4, 5]

          assert get_unlocked_rewards(
              1000
          ) == [2, 3, 4, 5, 6]

          french = build_rewards_summary(
              50,
              "fr",
          )

          english = build_rewards_summary(
              50,
              "en",
          )

          assert "✅ 🔭 Insight céleste" in french
          assert "🔒 ⭐ Message des astres" in french
          assert "10 points" not in french

          assert "Celestial Insight" in english
          assert "Message from the Stars" in english

          print(
              "REWARD VISIBILITY OK"
          )
          PY

      - name: Test unlocked contents FR and EN
        run: |
          python - <<'PY'
          from level_rewards_engine import (
              build_unlocked_content,
          )

          level_1 = build_unlocked_content(
              39,
              "Bélier",
              "fr",
          )

          assert "40 points" in level_1
          assert "Insight céleste" not in level_1

          level_2 = build_unlocked_content(
              40,
              "Bélier",
              "fr",
          )

          assert "Insight céleste" in level_2
          assert "Message des astres" not in level_2

          level_6 = build_unlocked_content(
              1000,
              "Aries",
              "en",
          )

          assert "Celestial Insight" in level_6
          assert "Message from the Stars" in level_6
          assert "Cosmic Focus" in level_6
          assert "Astral Guidance" in level_6
          assert "Legend Reading" in level_6

          print(
              "UNLOCKED CONTENT FR EN OK"
          )
          PY

      - name: Verify rewards engine is read only
        run: |
          if grep -Eiq \
            'INSERT INTO|UPDATE users|DELETE FROM|points[[:space:]]*-=|SET points|commit\(|rollback\(' \
            level_rewards_engine.py
          then
            echo "Rewards engine contains mutation logic."
            exit 1
          fi

          echo "REWARDS ENGINE IS READ ONLY"

      - name: Verify no paid product access
        run: |
          if grep -Eiq \
            'activate_premium|premium_subscriptions|profile_purchases|createInvoiceLink|send_invoice|successful_payment|refundStarsCharge' \
            level_rewards_engine.py
          then
            echo "Rewards engine touches paid systems."
            exit 1
          fi

          echo "PAID SYSTEMS REMAIN SEPARATE"

      - name: Create bot integration patch
        run: |
          cat > /tmp/integrate_level_rewards.py <<'PY'
          from pathlib import Path


          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          marker = (
              "# ASTROVIBE LEVEL REWARDS ROUTING"
          )

          hint_marker = (
              "# ASTROVIBE LEVEL REWARDS HINT"
          )

          if marker in source:
              raise RuntimeError(
                  "Level rewards routing "
                  "already installed."
              )

          if hint_marker in source:
              raise RuntimeError(
                  "Level rewards hint "
                  "already installed."
              )


          # ==========================================
          # ADD /rewards ROUTING BEFORE REFERRAL
          # ==========================================

          referral_marker = (
              "# ASTROVIBE REFERRAL "
              "BUTTON ROUTING"
          )

          position = source.find(
              referral_marker
          )

          if position == -1:
              referral_marker = (
                  "# ASTROVIBE REFERRAL "
                  "INVITE ROUTING"
              )

              position = source.find(
                  referral_marker
              )

          if position == -1:
              raise RuntimeError(
                  "Safe routing insertion "
                  "point not found."
              )


          routing_lines = [
              "    # ASTROVIBE LEVEL REWARDS ROUTING",
              "    if command_name in (",
              "        \"/rewards\",",
              "        \"/recompenses\",",
              "    ):",
              "        from level_rewards_engine import (",
              "            build_rewards_summary,",
              "            build_unlocked_content,",
              "        )",
              "",
              "        try:",
              "            with get_db_connection() as conn:",
              "                with conn.cursor() as cursor:",
              "                    cursor.execute(",
              "                        \"\"\"",
              "                        SELECT",
              "                            points,",
              "                            sign",
              "                        FROM users",
              "                        WHERE telegram_id = %s",
              "                        \"\"\",",
              "                        (user_id,),",
              "                    )",
              "",
              "                    reward_user = (",
              "                        cursor.fetchone()",
              "                    )",
              "        except Exception as reward_error:",
              "            print(",
              "                \"LEVEL REWARDS READ ERROR:\",",
              "                repr(reward_error),",
              "                flush=True,",
              "            )",
              "",
              "            reward_user = None",
              "",
              "        reward_points = 0",
              "        reward_sign = None",
              "",
              "        if reward_user:",
              "            reward_points = int(",
              "                reward_user[0] or 0",
              "            )",
              "",
              "            reward_sign = reward_user[1]",
              "",
              "        reward_message = (",
              "            build_rewards_summary(",
              "                reward_points,",
              "                language,",
              "            )",
              "            + \"\\n\\n\"",
              "            + build_unlocked_content(",
              "                reward_points,",
              "                reward_sign,",
              "                language,",
              "            )",
              "        )",
              "",
              "        bot.send_message(",
              "            message.chat.id,",
              "            reward_message,",
              "            reply_markup=main_menu(",
              "                language",
              "            ),",
              "        )",
              "",
              "        return",
              "",
          ]

          routing_block = (
              "\n".join(
                  routing_lines
              )
              + "\n"
          )

          source = (
              source[:position]
              + routing_block
              + source[position:]
          )


          # ==========================================
          # ADD A HINT TO POINTS DISPLAY
          # ==========================================

          show_points_position = source.find(
              "def show_points("
          )

          if show_points_position == -1:
              raise RuntimeError(
                  "show_points function not found."
              )

          next_function_position = source.find(
              "\ndef ",
              show_points_position + 5,
          )

          if next_function_position == -1:
              next_function_position = len(
                  source
              )

          show_points_block = source[
              show_points_position:
              next_function_position
          ]

          needle = (
              "    bot.send_message("
          )

          send_position = (
              show_points_block.rfind(
                  needle
              )
          )

          if send_position == -1:
              raise RuntimeError(
                  "show_points send_message "
                  "not found."
              )

          absolute_send_position = (
              show_points_position
              + send_position
          )

          hint_lines = [
              "    # ASTROVIBE LEVEL REWARDS HINT",
              "    if language == \"en\":",
              "        message_text += (",
              "            \"\\n\\n🎁 Use /rewards to view \"",
              "            \"your unlocked level rewards.\"",
              "        )",
              "    else:",
              "        message_text += (",
              "            \"\\n\\n🎁 Utilise /rewards pour \"",
              "            \"voir tes récompenses de niveau.\"",
              "        )",
              "",
          ]

          hint_block = (
              "\n".join(
                  hint_lines
              )
              + "\n"
          )

          source = (
              source[:absolute_send_position]
              + hint_block
              + source[absolute_send_position:]
          )

          path.write_text(
              source,
              encoding="utf-8",
          )

          print(
              "LEVEL REWARDS CONNECTED TO BOT"
          )
          PY

