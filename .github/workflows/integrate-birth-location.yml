name: Integrate birth location safely

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-location:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate birth location flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          required_import = (
              "from birth_location_engine import "
              "resolve_birth_location, format_location_label"
          )

          if required_import not in source:
              raise SystemExit(
                  "ERROR: birth_location_engine import is missing."
              )

          birth_place_pattern = re.compile(
              r'(?ms)'
              r'^(?P<indent>[ \t]+)'
              r'elif step == "birth_place":\n'
              r'.*?'
              r'(?=^(?P=indent)'
              r'elif step == "confirmation":)'
          )

          match = birth_place_pattern.search(source)

          if not match:
              raise SystemExit(
                  "ERROR: birth_place block was not found."
              )

          indent = match.group("indent")

          def code_line(level, text=""):
              return (
                  indent
                  + ("    " * level)
                  + text
              )

          replacement_lines = [
              code_line(
                  0,
                  'elif step == "birth_place":'
              ),
              code_line(
                  1,
                  "birth_place = message.text.strip()"
              ),
              "",
              code_line(
                  1,
                  "if len(birth_place) < 2:"
              ),
              code_line(
                  2,
                  "bot.send_message("
              ),
              code_line(
                  3,
                  "message.chat.id,"
              ),
              code_line(
                  3,
                  "get_text("
              ),
              code_line(
                  4,
                  "language,"
              ),
              code_line(
                  4,
                  '"birth_place_invalid"'
              ),
              code_line(
                  3,
                  ")"
              ),
              code_line(
                  2,
                  ")"
              ),
              "",
              code_line(
                  1,
                  "else:"
              ),
              code_line(
                  2,
                  "location_result = resolve_birth_location("
              ),
              code_line(
                  3,
                  "birth_place"
              ),
              code_line(
                  2,
                  ")"
              ),
              "",
              code_line(
                  2,
                  'if location_result["status"] == "resolved":'
              ),
              code_line(
                  3,
                  'location = location_result["location"]'
              ),
              "",
              code_line(
                  3,
                  'birth_request["birth_place"] = ('
              ),
              code_line(
                  4,
                  'f"{location[\'name\']}, "'
              ),
              code_line(
                  4,
                  'f"{location[\'country_code\']}"'
              ),
              code_line(
                  3,
                  ")"
              ),
              code_line(
                  3,
                  'birth_request["birth_timezone"] = ('
              ),
              code_line(
                  4,
                  'location["timezone"]'
              ),
              code_line(
                  3,
                  ")"
              ),
              code_line(
                  3,
                  'birth_request["birth_latitude"] = ('
              ),
              code_line(
                  4,
                  'location["latitude"]'
              ),
              code_line(
                  3,
                  ")"
              ),
              code_line(
                  3,
                  'birth_request["birth_longitude"] = ('
              ),
              code_line(
                  4,
                  'location["longitude"]'
              ),
              code_line(
                  3,
                  ")"
              ),
              code_line(
                  3,
                  'birth_request["step"] = "confirmation"'
              ),
              "",
              code_line(
                  3,
                  "birth_date_text = birth_request["
              ),
              code_line(
                  4,
                  '"birth_date"'
              ),
              code_line(
                  3,
                  '].strftime("%d/%m/%Y")'
              ),
              "",
              code_line(
                  3,
                  'if birth_request["birth_time_known"]:'
              ),
              code_line(
                  4,
                  "birth_time_text = birth_request["
              ),
              code_line(
                  5,
                  '"birth_time"'
              ),
              code_line(
                  4,
                  '].strftime("%H:%M")'
              ),
              code_line(
                  3,
                  "else:"
              ),
              code_line(
                  4,
                  "birth_time_text = ("
              ),
              code_line(
                  5,
                  '"Unknown"'
              ),
              code_line(
                  5,
                  'if language == "en"'
              ),
              code_line(
                  5,
                  'else "Inconnue"'
              ),
              code_line(
                  4,
                  ")"
              ),
              "",
              code_line(
                  3,
                  "summary = get_text("
              ),
              code_line(
                  4,
                  "language,"
              ),
              code_line(
                  4,
                  '"birth_info_summary",'
              ),
              code_line(
                  4,
                  "birth_date=birth_date_text,"
              ),
              code_line(
                  4,
                  "birth_time=birth_time_text,"
              ),
              code_line(
                  4,
                  "birth_place=birth_request["
              ),
              code_line(
                  5,
                  '"birth_place"'
              ),
              code_line(
                  4,
                  "]"
              ),
              code_line(
                  3,
                  ")"
              ),
              "",
              code_line(
                  3,
                  "bot.send_message("
              ),
              code_line(
                  4,
                  "message.chat.id,"
              ),
              code_line(
                  4,
                  "summary,"
              ),
              code_line(
                  4,
                  "reply_markup=birth_info_confirmation_menu("
              ),
              code_line(
                  5,
                  "language"
              ),
              code_line(
                  4,
                  ")"
              ),
              code_line(
                  3,
                  ")"
              ),
              "",
              code_line(
                  2,
                  'elif location_result["status"] == "ambiguous":'
              ),
              code_line(
                  3,
                  "choices = location_result.get("
              ),
              code_line(
                  4,
                  '"choices",'
              ),
              code_line(
                  4,
                  "[]"
              ),
              code_line(
                  3,
                  ")"
              ),
              "",
              code_line(
                  3,
                  "choice_lines = []"
              ),
              "",
              code_line(
                  3,
                  "for index, location in enumerate("
              ),
              code_line(
                  4,
                  "choices,"
              ),
              code_line(
                  4,
                  "start=1"
              ),
              code_line(
                  3,
                  "):"
              ),
              code_line(
                  4,
                  "choice_lines.append("
              ),
              code_line(
                  5,
                  'f"{index}. "'
              ),
              code_line(
                  5,
                  "f\"{format_location_label("
              ),
              code_line(
                  6,
                  "location,"
              ),
              code_line(
                  6,
                  "language"
              ),
              code_line(
                  5,
                  ")}\""
              ),
              code_line(
                  4,
                  ")"
              ),
              "",
              code_line(
                  3,
                  'choices_text = "\\n".join('
              ),
              code_line(
                  4,
                  "choice_lines"
              ),
              code_line(
                  3,
                  ")"
              ),
              "",
              code_line(
                  3,
                  'if language == "fr":'
              ),
              code_line(
                  4,
                  "location_message = ("
              ),
              code_line(
                  5,
                  '"⚠️ Plusieurs lieux correspondent à ce nom.\\n\\n"'
              ),
              code_line(
                  5,
                  'f"{choices_text}\\n\\n"'
              ),
              code_line(
                  5,
                  '"Précise la ville et le pays."'
              ),
              code_line(
                  4,
                  ")"
              ),
              code_line(
                  3,
                  "else:"
              ),
              code_line(
                  4,
                  "location_message = ("
              ),
              code_line(
                  5,
                  '"⚠️ Several locations match that name.\\n\\n"'
              ),
              code_line(
                  5,
                  'f"{choices_text}\\n\\n"'
              ),
              code_line(
                  5,
                  '"Please enter the city and country."'
              ),
              code_line(
                  4,
                  ")"
              ),
              "",
              code_line(
                  3,
                  "bot.send_message("
              ),
              code_line(
                  4,
                  "message.chat.id,"
              ),
              code_line(
                  4,
                  "location_message"
              ),
              code_line(
                  3,
                  ")"
              ),
              "",
              code_line(
                  2,
                  'elif location_result["status"] == "not_found":'
              ),
              code_line(
                  3,
                  "bot.send_message("
              ),
              code_line(
                  4,
                  "message.chat.id,"
              ),
              code_line(
                  4,
                  "("
              ),
              code_line(
                  5,
                  '"❌ Je n\'ai pas trouvé ce lieu. "'
              ),
              code_line(
                  5,
                  '"Essaie avec la ville et le pays."'
              ),
              code_line(
                  4,
                  ")"
              ),
              code_line(
                  4,
                  'if language == "fr"'
              ),
              code_line(
                  4,
                  "else ("
              ),
              code_line(
                  5,
                  '"❌ I couldn\'t find that location. "'
              ),
              code_line(
                  5,
                  '"Try entering the city and country."'
              ),
              code_line(
                  4,
                  ")"
              ),
              code_line(
                  3,
                  ")"
              ),
              "",
              code_line(
                  2,
                  "else:"
              ),
              code_line(
                  3,
                  "bot.send_message("
              ),
              code_line(
                  4,
                  "message.chat.id,"
              ),
              code_line(
                  4,
                  "("
              ),
              code_line(
                  5,
                  '"❌ La recherche du lieu est temporairement "'
              ),
              code_line(
                  5,
                  '"indisponible."'
              ),
              code_line(
                  4,
                  ")"
              ),
              code_line(
                  4,
                  'if language == "fr"'
              ),
              code_line(
                  4,
                  "else ("
              ),
              code_line(
                  5,
                  '"❌ Location search is temporarily unavailable."'
              ),
              code_line(
                  4,
                  ")"
              ),
              code_line(
                  3,
                  ")"
              ),
          ]

          replacement = "\n".join(
              replacement_lines
          ) + "\n\n"

          patched = (
              source[:match.start()]
              + replacement
              + source[match.end():]
          )

          confirmation_start = patched.find(
              f'{indent}elif step == "confirmation":'
          )

          if confirmation_start == -1:
              raise SystemExit(
                  "ERROR: confirmation block was not found."
              )

          confirmation_section = patched[
              confirmation_start:
          ]

          save_pattern = re.compile(
              r'(?ms)'
              r'^(?P<save_indent>[ \t]+)'
              r'save_birth_info\(\n'
              r'.*?'
              r'^(?P=save_indent)\)'
              r'(?=\n\n'
              r'(?P=save_indent)'
              r'birth_info_requests\.pop)'
          )

          save_match = save_pattern.search(
              confirmation_section
          )

          if not save_match:
              raise SystemExit(
                  "ERROR: save_birth_info call was not found."
              )

          save_indent = save_match.group(
              "save_indent"
          )

          save_lines = [
              save_indent + "save_birth_info(",
              save_indent + "    user_id=user_id,",
              save_indent + (
                  '    birth_date=birth_request["birth_date"],'
              ),
              save_indent + (
                  '    birth_time=birth_request["birth_time"],'
              ),
              save_indent + (
                  "    birth_time_known=birth_request["
              ),
              save_indent + (
                  '        "birth_time_known"'
              ),
              save_indent + "    ],",
              save_indent + (
                  '    birth_place=birth_request["birth_place"],'
              ),
              save_indent + (
                  "    birth_timezone=birth_request["
              ),
              save_indent + (
                  '        "birth_timezone"'
              ),
              save_indent + "    ],",
              save_indent + (
                  "    birth_latitude=birth_request["
              ),
              save_indent + (
                  '        "birth_latitude"'
              ),
              save_indent + "    ],",
              save_indent + (
                  "    birth_longitude=birth_request["
              ),
              save_indent + (
                  '        "birth_longitude"'
              ),
              save_indent + "    ]",
              save_indent + ")",
          ]

          save_replacement = "\n".join(
              save_lines
          )

          confirmation_section = (
              confirmation_section[
                  :save_match.start()
              ]
              + save_replacement
              + confirmation_section[
                  save_match.end():
              ]
          )

          final_source = (
              patched[:confirmation_start]
              + confirmation_section
          )

          compile(
              final_source,
              "bot.py",
              "exec"
          )

          path.write_text(
              final_source,
              encoding="utf-8"
          )

          print(
              "Birth location integration applied "
              "and syntax validated."
          )
          PY

      - name: Validate Python files
        run: |
          python -m py_compile bot.py
          python -m py_compile birth_location_engine.py
          python -m py_compile natal_chart_engine.py
          python -m py_compile personal_profile_engine.py
          git diff --check

      - name: Commit validated integration
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Integrate birth location safely"
          git push origin HEAD:main
