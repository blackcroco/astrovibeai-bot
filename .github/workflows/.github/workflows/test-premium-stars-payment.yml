name: Test Premium Stars Payment

on:
  workflow_dispatch:

jobs:
  test-premium-stars-payment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Premium Stars payment engine
        run: python -m py_compile premium_stars_payment.py

      - name: Test Premium configuration
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              PREMIUM_PRICE_STARS,
              PREMIUM_CURRENCY,
              PREMIUM_PERIOD_SECONDS,
              PREMIUM_PAYLOAD_PREFIX,
          )

          assert PREMIUM_PRICE_STARS == 199
          assert PREMIUM_CURRENCY == "XTR"
          assert PREMIUM_PERIOD_SECONDS == 2592000
          assert PREMIUM_PAYLOAD_PREFIX == "astrovibe_premium"

          print("PRICE OK: 199 XTR")
          print("PERIOD OK: 30 DAYS")
          print("PAYLOAD PREFIX OK")
          PY

      - name: Test Premium invoice FR
        run: |
          python - <<'PY'
          from premium_stars_payment import build_premium_invoice

          invoice = build_premium_invoice(
              user_id=123456789,
              language="fr",
          )

          assert invoice["title"] == "AstroVibe Premium"
          assert invoice["currency"] == "XTR"
          assert invoice["subscription_period"] == 2592000
          assert invoice["payload"] == "astrovibe_premium:123456789"

          assert len(invoice["prices"]) == 1
          assert invoice["prices"][0]["amount"] == 199

          assert "199" in invoice["description"]
          assert "30 jours" in invoice["description"]

          print("FR INVOICE OK")
          PY

      - name: Test Premium invoice EN
        run: |
          python - <<'PY'
          from premium_stars_payment import build_premium_invoice

          invoice = build_premium_invoice(
              user_id=123456789,
              language="en",
          )

          assert invoice["title"] == "AstroVibe Premium"
          assert invoice["currency"] == "XTR"
          assert invoice["subscription_period"] == 2592000
          assert invoice["payload"] == "astrovibe_premium:123456789"

          assert len(invoice["prices"]) == 1
          assert invoice["prices"][0]["amount"] == 199

          assert "199" in invoice["description"]
          assert "30 days" in invoice["description"]

          print("EN INVOICE OK")
          PY

      - name: Test Premium payload
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              build_premium_payload,
              parse_premium_payload,
          )

          payload = build_premium_payload(
              123456789
          )

          assert payload == "astrovibe_premium:123456789"

          assert (
              parse_premium_payload(payload)
              == 123456789
          )

          assert (
              parse_premium_payload(
                  "wrong_product:123456789"
              )
              is None
          )

          assert (
              parse_premium_payload(
                  "astrovibe_premium:"
              )
              is None
          )

          assert (
              parse_premium_payload(
                  "astrovibe_premium:abc"
              )
              is None
          )

          assert (
              parse_premium_payload(
                  "astrovibe_premium:0"
              )
              is None
          )

          assert parse_premium_payload(None) is None

          print("PAYLOAD TESTS OK")
          PY

      - name: Test Premium pre checkout
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              validate_premium_pre_checkout,
          )

          result = validate_premium_pre_checkout(
              payload="astrovibe_premium:123456789",
              currency="XTR",
              total_amount=199,
              telegram_user_id=123456789,
          )

          assert result["valid"] is True
          assert result["reason"] == "valid"
          assert result["user_id"] == 123456789
          assert result["amount"] == 199
          assert result["currency"] == "XTR"

          print("PRE-CHECKOUT OK")
          PY

      - name: Test invalid Premium payment protection
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              validate_premium_pre_checkout,
          )

          payload = "astrovibe_premium:123456789"

          wrong_amount = validate_premium_pre_checkout(
              payload=payload,
              currency="XTR",
              total_amount=200,
              telegram_user_id=123456789,
          )

          assert wrong_amount["valid"] is False
          assert wrong_amount["reason"] == "invalid_amount"

          wrong_currency = validate_premium_pre_checkout(
              payload=payload,
              currency="USD",
              total_amount=199,
              telegram_user_id=123456789,
          )

          assert wrong_currency["valid"] is False
          assert wrong_currency["reason"] == "invalid_currency"

          wrong_user = validate_premium_pre_checkout(
              payload=payload,
              currency="XTR",
              total_amount=199,
              telegram_user_id=999999999,
          )

          assert wrong_user["valid"] is False
          assert wrong_user["reason"] == "invalid_user"

          wrong_payload = validate_premium_pre_checkout(
              payload="wrong:123456789",
              currency="XTR",
              total_amount=199,
              telegram_user_id=123456789,
          )

          assert wrong_payload["valid"] is False
          assert wrong_payload["reason"] == "invalid_payload"

          print("INVALID PAYMENTS REJECTED")
          PY

      - name: Test successful Premium payment
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              validate_premium_successful_payment,
          )

          expiration = 1893456000

          result = validate_premium_successful_payment(
              payload="astrovibe_premium:123456789",
              currency="XTR",
              total_amount=199,
              telegram_payment_charge_id="TEST_PREMIUM_CHARGE_001",
              telegram_user_id=123456789,
              subscription_expiration_date=expiration,
              is_recurring=True,
              is_first_recurring=True,
          )

          assert result["valid"] is True
          assert result["reason"] == "valid"
          assert result["user_id"] == 123456789
          assert result["amount"] == 199
          assert result["currency"] == "XTR"

          assert (
              result["telegram_payment_charge_id"]
              == "TEST_PREMIUM_CHARGE_001"
          )

          assert (
              result["subscription_expiration_date"]
              == expiration
          )

          assert result["is_recurring"] is True
          assert result["is_first_recurring"] is True

          print("SUCCESSFUL PAYMENT OK")
          print("RECURRING DATA PRESERVED")
          PY

      - name: Test missing charge ID
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              validate_premium_successful_payment,
          )

          result = validate_premium_successful_payment(
              payload="astrovibe_premium:123456789",
              currency="XTR",
              total_amount=199,
              telegram_payment_charge_id=None,
              telegram_user_id=123456789,
          )

          assert result["valid"] is False
          assert result["reason"] == "missing_charge_id"

          print("MISSING CHARGE ID REJECTED")
          PY

      - name: Verify AstroVibe components remain separate
        run: |
          test -f premium_stars_payment.py
          test -f premium_subscription_engine.py
          test -f premium_engine.py
          test -f profile_stars_payment.py
          test -f profile_purchase_engine.py
          test -f bot.py

          echo "PREMIUM STARS PAYMENT OK"
          echo "PREMIUM SUBSCRIPTION ENGINE PRESERVED"
          echo "PREMIUM V1 PRESERVED"
          echo "PROFILE PURCHASE PRESERVED"
          echo "BOT.PY PRESERVED"

      - name: Final zero cost validation
        run: |
          echo "======================================="
          echo "PREMIUM STARS PAYMENT TEST PASSED"
          echo "======================================="
          echo "Price: 199 XTR"
          echo "Period: 30 days"
          echo "FR invoice: OK"
          echo "EN invoice: OK"
          echo "Payload: OK"
          echo "Pre-checkout: OK"
          echo "Successful payment simulation: OK"
          echo "Invalid payment protection: OK"
          echo "Recurring metadata: OK"
          echo "Premium V1 preserved: OK"
          echo "Profile purchase preserved: OK"
          echo "Points/referral untouched: OK"
          echo "Real Stars spent: 0"
