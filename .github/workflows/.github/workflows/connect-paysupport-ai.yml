name: Connect Payment Support AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-paysupport-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f paysupport_ai.py
          test -f paysupport_admin.py
          test -f paysupport_engine.py
          test -f paysupport_flow.py
          test -f terms_engine.py
          test -f premium_stars_payment.py
          test -f premium_stars_handlers.py
          test -f profile_purchase_engine.py
          test -f requirements.txt

          echo "REQUIRED FILES OK"

      - name: Add AI runtime dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("requirements.txt")

          source = path.read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          normalized = {
              line.strip()
              .lower()
              .split("==")[0]
              .split(">=")[0]
              .split("<=")[0]
              .split("~=")[0]
              for line in lines
              if line.strip()
              and not line.strip().startswith("#")
          }

          additions = []

          if "openai" not in normalized:
              additions.append(
                  "openai"
              )

          if "pydantic" not in normalized:
              additions.append(
                  "pydantic"
              )

          if additions:
              updated = source.rstrip()

              if updated:
                  updated += "\n"

              updated += "\n".join(
                  additions
              )

              updated += "\n"

              path.write_text(
                  updated,
                  encoding="utf-8",
              )

          print(
              "AI RUNTIME DEPENDENCIES READY"
          )
          PY

      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pydantic

      - name: Create AI connection patch
        run: |
          cat > /tmp/connect_paysupport_ai.py <<'PY'
          from pathlib import Path

          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          old_marker = (
              "# ASTROVIBE SUPPORT HUMAN ESCALATION"
          )

          new_marker = (
              "# ASTROVIBE SUPPORT AI ROUTING"
          )

          if new_marker in source:
              raise RuntimeError(
                  "AI support routing "
                  "already installed."
              )

          function_position = source.find(
              "def create_paysupport_ticket("
          )

          if function_position == -1:
              raise RuntimeError(
                  "create_paysupport_ticket "
                  "function not found."
              )

          old_block_position = source.find(
              old_marker,
              function_position,
          )

          if old_block_position == -1:
              raise RuntimeError(
                  "Existing human escalation "
                  "block not found."
              )

          confirmation_position = source.find(
              "        bot.send_message(",
              old_block_position,
          )

          if confirmation_position == -1:
              raise RuntimeError(
                  "Ticket confirmation message "
                  "not found after escalation."
              )

          existing_block = source[
              old_block_position:
              confirmation_position
          ]

          required_existing = (
              "escalate_ticket",
              "get_support_ticket",
              "send_ticket_to_admin",
              "admin_delivery",
          )

          for marker in required_existing:
              if marker not in existing_block:
                  raise RuntimeError(
                      "Existing escalation block "
                      "is incomplete: "
                      + marker
                  )

          ai_lines = [
              "        # ASTROVIBE SUPPORT AI ROUTING",
              "        from paysupport_ai import (",
              "            DECISION_RESOLVE,",
              "            analyze_support_ticket,",
              "            build_ai_user_message,",
              "        )",
              "",
              "        from paysupport_admin import (",
              "            send_ticket_to_admin,",
              "        )",
              "",
              "        from paysupport_engine import (",
              "            escalate_ticket,",
              "            get_support_ticket,",
              "            save_ai_analysis,",
              "        )",
              "",
              "        ai_result = analyze_support_ticket(",
              "            ticket",
              "        )",
              "",
              "        if ai_result.decision == DECISION_RESOLVE:",
              "            ai_saved = save_ai_analysis(",
              "                get_db_connection,",
              "                ticket[\"ticket_code\"],",
              "                ai_summary=(",
              "                    ai_result.summary",
              "                ),",
              "                ai_resolution=(",
              "                    ai_result.user_reply",
              "                ),",
              "                status=\"resolved\",",
              "            )",
              "",
              "            if ai_saved:",
              "                bot.send_message(",
              "                    message.chat.id,",
              "                    build_ai_user_message(",
              "                        ticket,",
              "                        ai_result,",
              "                    ),",
              "                    reply_markup=(",
              "                        main_menu(",
              "                            language",
              "                        )",
              "                    ),",
              "                )",
              "",
              "                return",
              "",
              "            print(",
              "                (",
              "                    \"PAYSUPPORT AI SAVE \"",
              "                    \"FAILED:\"",
              "                ),",
              "                ticket[\"ticket_code\"],",
              "                flush=True,",
              "            )",
              "",
              "        else:",
              "            save_ai_analysis(",
              "                get_db_connection,",
              "                ticket[\"ticket_code\"],",
              "                ai_summary=(",
              "                    ai_result.summary",
              "                ),",
              "                ai_resolution=(",
              "                    ai_result.user_reply",
              "                ),",
              "                status=\"ai_processing\",",
              "            )",
              "",
              "        # need_info is routed to the human fallback",
              "        # until a multi-message follow-up flow exists.",
              "        escalated = escalate_ticket(",
              "            get_db_connection,",
              "            ticket[\"ticket_code\"],",
              "            ai_summary=(",
              "                ai_result.summary",
              "            ),",
              "        )",
              "",
              "        if escalated:",
              "            escalated_ticket = (",
              "                get_support_ticket(",
              "                    get_db_connection,",
              "                    ticket[\"ticket_code\"],",
              "                )",
              "            )",
              "",
              "            if escalated_ticket:",
              "                admin_delivery = (",
              "                    send_ticket_to_admin(",
              "                        bot,",
              "                        escalated_ticket,",
              "                    )",
              "                )",
              "",
              "                if not admin_delivery.get(",
              "                    \"success\"",
              "                ):",
              "                    print(",
              "                        (",
              "                            \"PAYSUPPORT ADMIN \"",
              "                            \"DELIVERY FAILED:\"",
              "                        ),",
              "                        admin_delivery.get(",
              "                            \"reason\"",
              "                        ),",
              "                        flush=True,",
              "                    )",
              "",
          ]

          ai_block = (
              "\n".join(ai_lines)
              + "\n"
          )

          fixed_source = (
              source[:old_block_position]
              + ai_block
              + source[confirmation_position:]
          )

          path.write_text(
              fixed_source,
              encoding="utf-8",
          )

          print(
              "PAYMENT SUPPORT AI CONNECTED"
          )
          PY

      - name: Validate connection patch
        run: |
          python -m py_compile /tmp/connect_paysupport_ai.py

      - name: Apply AI connection patch
        run: |
          python /tmp/connect_paysupport_ai.py

      - name: Compile complete production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile paysupport_ai.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_flow.py
          python -m py_compile terms_engine.py
          python -m py_compile premium_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_purchase_delivery.py

      - name: Verify AI connection
        run: |
          grep -q "ASTROVIBE SUPPORT AI ROUTING" bot.py
          grep -q "analyze_support_ticket" bot.py
          grep -q "build_ai_user_message" bot.py
          grep -q "DECISION_RESOLVE" bot.py
          grep -q "save_ai_analysis" bot.py
          grep -q 'status="resolved"' bot.py
          grep -q 'status="ai_processing"' bot.py

          echo "AI CONNECTION OK"

      - name: Verify human fallback preserved
        run: |
          grep -q "escalate_ticket" bot.py
          grep -q "get_support_ticket" bot.py
          grep -q "send_ticket_to_admin" bot.py
          grep -q "admin_delivery" bot.py
          grep -q 'command_name == "/supportreply"' bot.py
          grep -q "process_admin_reply" bot.py
          grep -q "is_support_admin" bot.py

          echo "HUMAN FALLBACK PRESERVED"

      - name: Verify AI engine protections
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "paysupport_ai.py"
          ).read_text(
              encoding="utf-8"
          )

          required = (
              "requires_human_review",
              "DECISION_ESCALATE",
              "Sensitive payment",
              "Application safety override",
              "MUST escalate",
              "MUST NOT",
          )

          for marker in required:
              assert marker in source, marker
              print(
                  "AI PROTECTION OK:",
                  marker,
              )

          forbidden = (
              "refundStarsCharge",
              "activate_premium_subscription",
              "UPDATE users",
              "UPDATE premium_subscriptions",
          )

          for marker in forbidden:
              assert marker not in source, marker

          print(
              "AI CANNOT MUTATE PAYMENTS"
          )
          PY

      - name: Test sensitive ticket still bypasses AI
        env:
          SUPPORT_AI_MODEL: "test-model"
        run: |
          python - <<'PY'
          from paysupport_ai import (
              DECISION_ESCALATE,
              analyze_support_ticket,
          )


          class ForbiddenClient:
              @property
              def responses(self):
                  raise AssertionError(
                      "Sensitive ticket must not "
                      "call the AI client"
                  )


          ticket = {
              "ticket_code": "AV-SAFE01",
              "language": "fr",
              "category": "premium",
              "product": "premium",
              "user_message": (
                  "J'ai payé 199 Stars mais "
                  "Premium n'est pas activé"
              ),
              "payment_amount_stars": 199,
          }

          result = analyze_support_ticket(
              ticket,
              client=ForbiddenClient(),
          )

          assert (
              result.decision
              == DECISION_ESCALATE
          )

          print(
              "SENSITIVE TICKET HUMAN "
              "OVERRIDE VERIFIED"
          )
          PY

      - name: Test safe AI decision contract
        env:
          SUPPORT_AI_MODEL: "test-model"
        run: |
          python - <<'PY'
          from types import SimpleNamespace

          from paysupport_ai import (
              DECISION_RESOLVE,
              SupportAIResult,
              analyze_support_ticket,
          )


          class FakeResponses:
              def parse(
                  self,
                  model,
                  input,
                  text_format,
              ):
                  assert model == "test-model"

                  assert (
                      text_format
                      is SupportAIResult
                  )

                  return SimpleNamespace(
                      output_parsed=(
                          SupportAIResult(
                              decision="resolve",
                              summary=(
                                  "Simple product question."
                              ),
                              user_reply=(
                                  "Le Profil est un achat "
                                  "unique à 390 Stars. "
                                  "Premium est un abonnement "
                                  "à 199 Stars tous les "
                                  "30 jours."
                              ),
                              reason=(
                                  "Informational question"
                              ),
                          )
                      )
                  )


          class FakeClient:
              def __init__(self):
                  self.responses = FakeResponses()


          ticket = {
              "ticket_code": "AV-INFO01",
              "language": "fr",
              "category": "other",
              "product": None,
              "user_message": (
                  "Quelle est la différence "
                  "entre le Profil et Premium ?"
              ),
          }

          result = analyze_support_ticket(
              ticket,
              client=FakeClient(),
          )

          assert (
              result.decision
              == DECISION_RESOLVE
          )

          assert "390" in result.user_reply
          assert "199" in result.user_reply

          print(
              "SAFE AI DECISION CONTRACT OK"
          )
          PY

      - name: Verify terms preserved
        run: |
          grep -q 'command_name == "/terms"' bot.py
          grep -q "ASTROVIBE TERMS COMMAND" bot.py
          grep -q "get_terms" bot.py
          grep -q "split_terms" bot.py

          echo "TERMS FR EN PRESERVED"

      - name: Verify payment support preserved
        run: |
          grep -q 'command_name == "/paysupport"' bot.py
          grep -q "handle_paysupport_category" bot.py
          grep -q "create_paysupport_ticket" bot.py
          grep -q "create_support_ticket" bot.py
          grep -q "get_ticket_created_text" bot.py

          echo "PAYMENT SUPPORT PRESERVED"

      - name: Verify Profile preserved
        run: |
          grep -q "astrovibe_profile_v2:" bot.py
          grep -q "process_profile_pre_checkout" bot.py
          grep -q "process_successful_profile_purchase" bot.py
          grep -q "send_personal_profile" bot.py
          grep -q "init_profile_purchase_table" bot.py

          echo "PROFILE 390 STARS PRESERVED"

      - name: Verify Premium preserved
        run: |
          grep -q "astrovibe_premium:" bot.py
          grep -q "createInvoiceLink" bot.py
          grep -q "process_premium_pre_checkout" bot.py
          grep -q "process_successful_premium_payment" bot.py
          grep -q "premium_subscription_buttons" bot.py

          echo "PREMIUM 199 STARS PRESERVED"

      - name: Verify required dependencies
        run: |
          grep -Eiq '^openai([<>=~!].*)?$' requirements.txt
          grep -Eiq '^pydantic([<>=~!].*)?$' requirements.txt

          echo "OPENAI DEPENDENCY OK"
          echo "PYDANTIC DEPENDENCY OK"

      - name: Remove Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

          echo "PYTHON CACHE REMOVED"

      - name: Verify expected files changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          allowed = {
              "bot.py",
              "requirements.txt",
          }

          assert changed, (
              "No production files changed"
          )

          assert changed.issubset(
              allowed
          ), (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          assert "bot.py" in changed

          print(
              "ONLY EXPECTED FILES CHANGED:",
              sorted(changed),
          )
          PY

      - name: Show production changes
        run: |
          git diff -- bot.py
          git diff -- requirements.txt

      - name: Commit AI support connection
        run: |
          git add bot.py requirements.txt

          if git diff --cached --quiet; then
            echo "No production changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Connect AI payment support with human fallback"
          git push
