name: Cleanup Parasite Workflows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-parasite-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository
        run: |
          test -f bot.py
          test -d .github/workflows

          echo "REPOSITORY OK"

      - name: Verify parasite folder
        run: |
          PARASITE=".github/workflows/.github/workflows"

          if [ ! -d "$PARASITE" ]; then
            echo "Parasite workflow folder not found."
            exit 1
          fi

          echo "PARASITE FOLDER FOUND"

          find "$PARASITE" \
            -type f \
            -print \
            | sort

      - name: Verify permanent root copies
        run: |
          ROOT=".github/workflows"

          test -f \
            "$ROOT/test-paysupport-admin.yml"

          test -f \
            "$ROOT/test-premium-end-to-end.yml"

          test -f \
            "$ROOT/test-premium-stars-payment.yml"

          test -f \
            "$ROOT/test-profile-purchase-engine.yml"

          echo "PERMANENT ROOT TESTS FOUND"

      - name: Verify critical production files
        run: |
          test -f bot.py
          test -f referral_engine.py
          test -f level_rewards_engine.py
          test -f paysupport_engine.py
          test -f paysupport_admin.py
          test -f paysupport_ai.py
          test -f premium_subscription_engine.py
          test -f profile_purchase_engine.py
          test -f terms_engine.py

          echo "CRITICAL PRODUCTION FILES FOUND"

      - name: Remove parasite folder only
        run: |
          git rm -r \
            ".github/workflows/.github"

          echo "PARASITE FOLDER STAGED FOR REMOVAL"

      - name: Verify parasite folder removed
        run: |
          if [ -e ".github/workflows/.github" ]; then
            echo "Parasite folder still exists."
            exit 1
          fi

          echo "PARASITE FOLDER REMOVED"

      - name: Verify root tests survived
        run: |
          ROOT=".github/workflows"

          test -f \
            "$ROOT/test-paysupport-admin.yml"

          test -f \
            "$ROOT/test-premium-end-to-end.yml"

          test -f \
            "$ROOT/test-premium-stars-payment.yml"

          test -f \
            "$ROOT/test-profile-purchase-engine.yml"

          echo "ROOT TESTS PRESERVED"

      - name: Verify bot untouched
        run: |
          if git diff \
            --name-only \
            -- bot.py \
            | grep -q .
          then
            echo "bot.py was unexpectedly modified."
            exit 1
          fi

          echo "BOT.PY UNTOUCHED"

      - name: Verify production Python untouched
        run: |
          for FILE in \
            referral_engine.py \
            level_rewards_engine.py \
            paysupport_engine.py \
            paysupport_admin.py \
            paysupport_ai.py \
            premium_subscription_engine.py \
            profile_purchase_engine.py \
            terms_engine.py
          do
            if git diff \
              --name-only \
              -- "$FILE" \
              | grep -q .
            then
              echo "$FILE was unexpectedly modified."
              exit 1
            fi
          done

          echo "PRODUCTION PYTHON UNTOUCHED"

      - name: Compile critical production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile referral_engine.py
          python -m py_compile level_rewards_engine.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_ai.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile terms_engine.py

          echo "PRODUCTION STACK COMPILES"

      - name: Verify critical features preserved
        run: |
          grep -q \
            "astrovibe_profile_v2:" \
            bot.py

          grep -q \
            "astrovibe_premium:" \
            bot.py

          grep -q \
            'command_name == "/terms"' \
            bot.py

          grep -q \
            'command_name == "/paysupport"' \
            bot.py

          grep -q \
            'command_name == "/supportreply"' \
            bot.py

          grep -q \
            "ASTROVIBE SUPPORT AI ROUTING" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL START CAPTURE" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL MENU BUTTON" \
            bot.py

          grep -q \
            "ASTROVIBE LEVEL REWARDS ROUTING" \
            bot.py

          echo "CRITICAL FEATURES PRESERVED"

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Verify only parasite files are staged
        run: |
          FILES="$(git diff --cached --name-only)"

          echo "STAGED FILES:"
          echo "$FILES"

          if [ -z "$FILES" ]; then
            echo "No files staged for removal."
            exit 1
          fi

          BAD_FILES="$(
            echo "$FILES" \
              | grep -v '^.github/workflows/.github/' \
              || true
          )"

          if [ -n "$BAD_FILES" ]; then
            echo "Unexpected files staged:"
            echo "$BAD_FILES"
            exit 1
          fi

          echo "ONLY PARASITE FILES STAGED"

      - name: Show cleanup summary
        run: |
          echo "======================================"
          echo "CLEANUP SUMMARY"
          echo "======================================"

          git status --short

          echo
          echo "REMOVED FILES:"

          git diff \
            --cached \
            --name-only \
            --diff-filter=D

      - name: Commit parasite cleanup
        run: |
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Remove nested parasite workflows"

          git push

      - name: Final validation
        run: |
          echo "======================================"
          echo "PARASITE CLEANUP COMPLETE"
          echo "======================================"
          echo "Nested workflow folder removed: YES"
          echo "Root permanent tests preserved: YES"
          echo "bot.py modified: NO"
          echo "Production Python modified: NO"
          echo "Database writes: 0"
          echo "Telegram messages: 0"
          echo "Points modified: 0"
          echo "Payments touched: 0"
