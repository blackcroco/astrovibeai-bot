name: Diagnose Premium Invoice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-premium-invoice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch Premium invoice diagnostics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(
              encoding="utf-8"
          )

          diagnostic_marker = (
              "# PREMIUM INVOICE DIAGNOSTIC"
          )

          invoice_marker = (
              "# PREMIUM STARS INVOICE ENTRY"
          )

          if diagnostic_marker in source:
              raise RuntimeError(
                  "Premium invoice diagnostic "
                  "already installed."
              )

          marker_index = source.find(
              invoice_marker
          )

          if marker_index == -1:
              raise RuntimeError(
                  "Premium invoice entry marker "
                  "not found."
              )

          marker_line = (
              source[:marker_index].count("\n")
              + 1
          )

          tree = ast.parse(source)

          target_call = None

          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue

              function = node.func

              if not isinstance(
                  function,
                  ast.Attribute,
              ):
                  continue

              if function.attr != "send_invoice":
                  continue

              owner = function.value

              if not isinstance(owner, ast.Name):
                  continue

              if owner.id != "bot":
                  continue

              if node.lineno <= marker_line:
                  continue

              target_call = node
              break

          if target_call is None:
              raise RuntimeError(
                  "Premium bot.send_invoice call "
                  "not found."
              )

          lines = source.splitlines(
              keepends=True
          )

          statement_start = sum(
              len(line)
              for line in lines[
                  :target_call.lineno - 1
              ]
          )

          statement_end = sum(
              len(line)
              for line in lines[
                  :target_call.end_lineno
              ]
          )

          original_block = source[
              statement_start:statement_end
          ]

          if (
              "subscription_period"
              not in original_block
          ):
              raise RuntimeError(
                  "Located send_invoice call "
                  "is not the Premium subscription."
              )

          first_line = lines[
              target_call.lineno - 1
          ]

          indentation = (
              first_line[
                  :len(first_line)
                  - len(first_line.lstrip())
              ]
          )

          nested_block = "".join(
              "    " + line
              for line in original_block.splitlines(
                  keepends=True
              )
          )

          replacement = (
              indentation
              + "# PREMIUM INVOICE DIAGNOSTIC\n"
              + indentation
              + "print(\n"
              + indentation
              + '    "PREMIUM INVOICE START",\n'
              + indentation
              + "    user_id,\n"
              + indentation
              + '    premium_invoice["currency"],\n'
              + indentation
              + '    premium_invoice["prices"],\n'
              + indentation
              + (
                  '    premium_invoice['
                  '"subscription_period"],\n'
              )
              + indentation
              + "    flush=True,\n"
              + indentation
              + ")\n"
              + "\n"
              + indentation
              + "try:\n"
              + nested_block
              + indentation
              + "    print(\n"
              + indentation
              + (
                  '        "PREMIUM INVOICE SENT",\n'
              )
              + indentation
              + "        flush=True,\n"
              + indentation
              + "    )\n"
              + indentation
              + "except Exception as error:\n"
              + indentation
              + "    print(\n"
              + indentation
              + (
                  '        "PREMIUM INVOICE ERROR:",\n'
              )
              + indentation
              + "        repr(error),\n"
              + indentation
              + "        flush=True,\n"
              + indentation
              + "    )\n"
              + "\n"
              + indentation
              + "    try:\n"
              + indentation
              + "        bot.send_message(\n"
              + indentation
              + "            message.chat.id,\n"
              + indentation
              + "            (\n"
              + indentation
              + (
                  '                "⚠️ Erreur temporaire '
                  'lors de la création "\n'
              )
              + indentation
              + (
                  '                "de la facture '
                  'Premium."\n'
              )
              + indentation
              + (
                  '                if language != "en"\n'
              )
              + indentation
              + "                else\n"
              + indentation
              + (
                  '                "⚠️ Temporary error '
                  'while creating "\n'
              )
              + indentation
              + (
                  '                "the Premium invoice."\n'
              )
              + indentation
              + "            ),\n"
              + indentation
              + "        )\n"
              + indentation
              + (
                  "    except Exception "
                  "as notify_error:\n"
              )
              + indentation
              + "        print(\n"
              + indentation
              + (
                  '            "PREMIUM DIAGNOSTIC '
                  'MESSAGE ERROR:",\n'
              )
              + indentation
              + "            repr(notify_error),\n"
              + indentation
              + "            flush=True,\n"
              + indentation
              + "        )\n"
          )

          patched = (
              source[:statement_start]
              + replacement
              + source[statement_end:]
          )

          path.write_text(
              patched,
              encoding="utf-8",
          )

          print(
              "PREMIUM INVOICE DIAGNOSTIC PATCHED"
          )
          PY

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: Compile Premium stack
        run: |
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile premium_engine.py

      - name: Verify diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "PREMIUM INVOICE DIAGNOSTIC",
              "PREMIUM INVOICE START",
              "PREMIUM INVOICE SENT",
              "PREMIUM INVOICE ERROR:",
              "bot.send_invoice",
              "subscription_period",
              "build_premium_invoice",
          )

          for marker in required:
              assert marker in source, marker
              print("OK:", marker)

          assert source.count(
              "# PREMIUM INVOICE DIAGNOSTIC"
          ) == 1

          print("DIAGNOSTIC VERIFIED")
          PY

      - name: Verify Profile payment preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "astrovibe_profile_v2:",
              "process_successful_profile_purchase",
              "send_personal_profile",
              "init_profile_purchase_table",
          )

          for marker in required:
              assert marker in source, marker
              print("PROFILE OK:", marker)

          print("PROFILE 390 STARS PRESERVED")
          PY

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {"bot.py"}, (
              "Unexpected files changed: "
              + repr(sorted(changed))
          )

          print("ONLY BOT.PY CHANGED")
          PY

      - name: Show diagnostic diff
        run: git diff -- bot.py

      - name: Commit Premium invoice diagnostic
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Add Premium invoice diagnostics"
          git push
