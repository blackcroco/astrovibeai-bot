name: Fix Premium Recurring Invoice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-premium-recurring-invoice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f premium_stars_payment.py
          test -f premium_stars_handlers.py
          test -f premium_subscription_engine.py
          test -f profile_stars_payment.py
          test -f profile_purchase_engine.py
          test -f requirements.txt

          echo "REQUIRED FILES OK"

      - name: Patch recurring Premium invoice
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          patch_marker = (
              "# PREMIUM DIRECT BOT API INVOICE"
          )

          if patch_marker in source:
              raise RuntimeError(
                  "Direct Premium invoice patch "
                  "already exists."
              )

          required = (
              "PREMIUM STARS INVOICE ENTRY",
              "PREMIUM INVOICE DIAGNOSTIC",
              "build_premium_invoice",
              "bot.send_invoice",
              "subscription_period",
              "astrovibe_premium:",
          )

          for marker in required:
              if marker not in source:
                  raise RuntimeError(
                      "Missing bot.py marker: "
                      + marker
                  )

          tree = ast.parse(source)

          target_call = None

          for node in ast.walk(tree):
              if not isinstance(
                  node,
                  ast.Call,
              ):
                  continue

              function = node.func

              if not isinstance(
                  function,
                  ast.Attribute,
              ):
                  continue

              if function.attr != "send_invoice":
                  continue

              owner = function.value

              if not isinstance(
                  owner,
                  ast.Name,
              ):
                  continue

              if owner.id != "bot":
                  continue

              call_source = (
                  ast.get_source_segment(
                      source,
                      node,
                  )
              )

              if not call_source:
                  continue

              if (
                  "subscription_period"
                  not in call_source
              ):
                  continue

              target_call = node
              break

          if target_call is None:
              raise RuntimeError(
                  "Premium recurring "
                  "bot.send_invoice call "
                  "not found."
              )

          lines = source.splitlines(
              keepends=True
          )

          statement_start = sum(
              len(line)
              for line in lines[
                  :target_call.lineno - 1
              ]
          )

          statement_end = sum(
              len(line)
              for line in lines[
                  :target_call.end_lineno
              ]
          )

          first_line = lines[
              target_call.lineno - 1
          ]

          indentation = first_line[
              :len(first_line)
              - len(first_line.lstrip())
          ]

          replacement_lines = [
              (
                  indentation
                  + "# PREMIUM DIRECT BOT API INVOICE\n"
              ),
              (
                  indentation
                  + "import requests\n"
              ),
              "\n",
              (
                  indentation
                  + "telegram_invoice_payload = {\n"
              ),
              (
                  indentation
                  + '    "chat_id": message.chat.id,\n'
              ),
              (
                  indentation
                  + '    "title": premium_invoice["title"],\n'
              ),
              (
                  indentation
                  + '    "description": '
                  + 'premium_invoice["description"],\n'
              ),
              (
                  indentation
                  + '    "payload": '
                  + 'premium_invoice["payload"],\n'
              ),
              (
                  indentation
                  + '    "provider_token": "",\n'
              ),
              (
                  indentation
                  + '    "currency": '
                  + 'premium_invoice["currency"],\n'
              ),
              (
                  indentation
                  + '    "prices": '
                  + 'premium_invoice["prices"],\n'
              ),
              (
                  indentation
                  + '    "subscription_period": '
                  + 'premium_invoice['
                  + '"subscription_period"],\n'
              ),
              (
                  indentation
                  + "}\n"
              ),
              "\n",
              (
                  indentation
                  + "telegram_response = requests.post(\n"
              ),
              (
                  indentation
                  + '    f"https://api.telegram.org/'
                  + 'bot{bot.token}/sendInvoice",\n'
              ),
              (
                  indentation
                  + "    json=telegram_invoice_payload,\n"
              ),
              (
                  indentation
                  + "    timeout=20,\n"
              ),
              (
                  indentation
                  + ")\n"
              ),
              "\n",
              (
                  indentation
                  + "try:\n"
              ),
              (
                  indentation
                  + "    telegram_result = "
                  + "telegram_response.json()\n"
              ),
              (
                  indentation
                  + "except ValueError as error:\n"
              ),
              (
                  indentation
                  + "    raise RuntimeError(\n"
              ),
              (
                  indentation
                  + '        "Telegram returned '
                  + 'an invalid response"\n'
              ),
              (
                  indentation
                  + "    ) from error\n"
              ),
              "\n",
              (
                  indentation
                  + "if (\n"
              ),
              (
                  indentation
                  + "    not telegram_response.ok\n"
              ),
              (
                  indentation
                  + "    or not "
                  + 'telegram_result.get("ok")\n'
              ),
              (
                  indentation
                  + "):\n"
              ),
              (
                  indentation
                  + "    description = "
                  + "telegram_result.get(\n"
              ),
              (
                  indentation
                  + '        "description",\n'
              ),
              (
                  indentation
                  + '        "unknown Telegram error",\n'
              ),
              (
                  indentation
                  + "    )\n"
              ),
              "\n",
              (
                  indentation
                  + "    raise RuntimeError(\n"
              ),
              (
                  indentation
                  + '        "Telegram sendInvoice '
                  + 'failed: "\n'
              ),
              (
                  indentation
                  + "        + str(description)\n"
              ),
              (
                  indentation
                  + "    )\n"
              ),
          ]

          replacement = "".join(
              replacement_lines
          )

          patched = (
              source[:statement_start]
              + replacement
              + source[statement_end:]
          )

          path.write_text(
              patched,
              encoding="utf-8",
          )

          print(
              "PREMIUM RECURRING INVOICE PATCHED"
          )
          PY

      - name: Compile AstroVibe stack
        run: |
          python -m py_compile bot.py
          python -m py_compile premium_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py
          python -m py_compile personal_profile_v2_engine.py

      - name: Verify direct Premium invoice
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "PREMIUM DIRECT BOT API INVOICE",
              "requests.post",
              "api.telegram.org",
              "/sendInvoice",
              "telegram_invoice_payload",
              '"subscription_period"',
              '"provider_token": ""',
              '"currency"',
              '"prices"',
              "telegram_response.json",
              "telegram_response.ok",
              "Telegram sendInvoice failed",
          )

          for marker in required:
              assert marker in source, marker
              print("DIRECT API OK:", marker)

          assert source.count(
              "# PREMIUM DIRECT BOT API INVOICE"
          ) == 1

          print(
              "DIRECT PREMIUM INVOICE VERIFIED"
          )
          PY

      - name: Verify old unsupported call removed
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          tree = ast.parse(source)

          unsupported_calls = []

          for node in ast.walk(tree):
              if not isinstance(
                  node,
                  ast.Call,
              ):
                  continue

              function = node.func

              if not isinstance(
                  function,
                  ast.Attribute,
              ):
                  continue

              if function.attr != "send_invoice":
                  continue

              call_source = (
                  ast.get_source_segment(
                      source,
                      node,
                  )
              )

              if (
                  call_source
                  and "subscription_period"
                  in call_source
              ):
                  unsupported_calls.append(
                      call_source
                  )

          assert not unsupported_calls, (
              "Unsupported recurring "
              "bot.send_invoice call remains"
          )

          print(
              "UNSUPPORTED LIBRARY CALL REMOVED"
          )
          PY

      - name: Verify Premium payment contract
        run: |
          python - <<'PY'
          from premium_stars_payment import (
              build_premium_invoice,
          )

          invoice = build_premium_invoice(
              user_id=123456789,
              language="fr",
          )

          assert invoice["currency"] == "XTR"
          assert invoice["prices"] == [
              {
                  "label": "AstroVibe Premium",
                  "amount": 199,
              }
          ]

          assert (
              invoice["subscription_period"]
              == 2592000
          )

          assert (
              invoice["payload"]
              == "astrovibe_premium:123456789"
          )

          print("PRICE OK: 199 XTR")
          print("PERIOD OK: 30 DAYS")
          print("PAYLOAD OK")
          PY

      - name: Verify Profile purchase preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "astrovibe_profile_v2:",
              "process_successful_profile_purchase",
              "send_personal_profile",
              "init_profile_purchase_table",
          )

          for marker in required:
              assert marker in source, marker
              print("PROFILE OK:", marker)

          print(
              "PROFILE 390 STARS PRESERVED"
          )
          PY

      - name: Verify Premium handlers preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "astrovibe_premium:",
              "astro_premium_pre_checkout",
              "process_premium_pre_checkout",
              "process_successful_premium_payment",
              "premium_subscription_buttons",
              "def is_premium",
          )

          for marker in required:
              assert marker in source, marker
              print("PREMIUM OK:", marker)

          print(
              "PREMIUM HANDLERS PRESERVED"
          )
          PY

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {"bot.py"}, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print("ONLY BOT.PY CHANGED")
          PY

      - name: Show bot.py changes
        run: git diff -- bot.py

      - name: Commit recurring invoice fix
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py changes."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Fix Premium recurring Stars invoice"
          git push
