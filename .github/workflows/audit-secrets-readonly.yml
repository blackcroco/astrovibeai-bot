name: Audit Secrets Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: |
          test -f bot.py
          test -f requirements.txt
          test -f paysupport_ai.py
          test -d .github/workflows

          echo "REPOSITORY READY"
          echo "SECRET AUDIT IS READ ONLY"
          echo "SECRET VALUES WILL NOT BE PRINTED"

      - name: Check tracked sensitive files
        run: |
          python - <<'PY'
          import subprocess


          result = subprocess.run(
              [
                  "git",
                  "ls-files",
              ],
              check=True,
              capture_output=True,
              text=True,
          )


          sensitive_exact_names = {
              ".env",
              "id_rsa",
              "id_ed25519",
              "credentials.json",
          }


          sensitive_suffixes = (
              ".pem",
              ".key",
              ".p12",
              ".pfx",
          )


          findings = []


          for repository_path in (
              result.stdout.splitlines()
          ):
              filename = repository_path.rsplit(
                  "/",
                  1,
              )[-1]


              is_environment_file = (
                  filename == ".env"
                  or filename.startswith(
                      ".env."
                  )
              )


              is_sensitive_name = (
                  filename
                  in sensitive_exact_names
              )


              is_sensitive_suffix = (
                  filename.endswith(
                      sensitive_suffixes
                  )
              )


              if (
                  is_environment_file
                  or is_sensitive_name
                  or is_sensitive_suffix
              ):
                  findings.append(
                      repository_path
                  )


          print("=" * 40)
          print("TRACKED SENSITIVE FILE CHECK")
          print("=" * 40)


          if findings:
              for repository_path in findings:
                  print(
                      "REVIEW REQUIRED:",
                      repository_path,
                  )


              raise SystemExit(1)


          print(
              "NO SENSITIVE FILES TRACKED"
          )
          PY

      - name: Inspect gitignore
        run: |
          python - <<'PY'
          from pathlib import Path


          path = Path(".gitignore")


          print("=" * 40)
          print("GITIGNORE INSPECTION")
          print("=" * 40)


          if not path.exists():
              print(
                  "NOTICE: .gitignore is missing."
              )

              print(
                  "This is a recommendation, "
                  "not an audit failure."
              )

              print(
                  "The audit will continue."
              )

              raise SystemExit(0)


          content = path.read_text(
              encoding="utf-8",
              errors="replace",
          )


          checks = {
              ".env files": (
                  ".env" in content
              ),
              "Python cache": (
                  "__pycache__" in content
                  or "*.pyc" in content
              ),
              "PEM files": (
                  "*.pem" in content
              ),
              "KEY files": (
                  "*.key" in content
              ),
          }


          for label, protected in checks.items():
              if protected:
                  status = "PROTECTED"
              else:
                  status = "NOTICE: RULE NOT FOUND"


              print(
                  label + ":",
                  status,
              )


          print(
              "GITIGNORE INSPECTION COMPLETE"
          )
          PY

      - name: Scan current tracked files
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path


          patterns = {
              "Telegram bot token": re.compile(
                  r"(?<![A-Za-z0-9_])"
                  r"[0-9]{6,12}:"
                  r"[A-Za-z0-9_-]{30,}"
              ),
              "Groq API key": re.compile(
                  r"(?<![A-Za-z0-9])"
                  r"gsk_"
                  r"[A-Za-z0-9_-]{20,}"
              ),
              "OpenAI API key": re.compile(
                  r"(?<![A-Za-z0-9])"
                  r"sk-"
                  r"(?:proj-)?"
                  r"[A-Za-z0-9_-]{20,}"
              ),
              "PostgreSQL credential URL": re.compile(
                  r"postgres(?:ql)?://"
                  r"[^:\s/@]+:"
                  r"[^@\s/]+@"
                  r"[^\s\"']+",
                  re.IGNORECASE,
              ),
              "Private key material": re.compile(
                  r"-----BEGIN "
                  r"(?:RSA |EC |OPENSSH )?"
                  r"PRIVATE KEY-----"
              ),
          }


          allowed_extensions = {
              ".py",
              ".yml",
              ".yaml",
              ".json",
              ".toml",
              ".ini",
              ".cfg",
              ".conf",
              ".txt",
              ".md",
              ".sh",
          }


          tracked_result = subprocess.run(
              [
                  "git",
                  "ls-files",
              ],
              check=True,
              capture_output=True,
              text=True,
          )


          findings = []


          for repository_path in (
              tracked_result.stdout.splitlines()
          ):
              path = Path(
                  repository_path
              )


              if not path.is_file():
                  continue


              if (
                  path.suffix
                  and path.suffix.lower()
                  not in allowed_extensions
              ):
                  continue


              content = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )


              for label, pattern in patterns.items():
                  match_count = len(
                      pattern.findall(
                          content
                      )
                  )


                  if match_count:
                      findings.append(
                          (
                              repository_path,
                              label,
                              match_count,
                          )
                      )


          print("=" * 40)
          print("CURRENT FILE SECRET SCAN")
          print("=" * 40)


          if findings:
              for (
                  repository_path,
                  label,
                  match_count,
              ) in findings:
                  print(
                      "SUSPECT:",
                      label,
                      "| file:",
                      repository_path,
                      "| matches:",
                      match_count,
                  )


              print(
                  "SECRET VALUES WERE NOT PRINTED"
              )


              raise SystemExit(1)


          print(
              "NO HIGH CONFIDENCE SECRET "
              "PATTERNS DETECTED"
          )
          PY

      - name: Scan Python sensitive assignments
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path


          sensitive_fragments = (
              "TOKEN",
              "API_KEY",
              "SECRET",
              "PASSWORD",
              "DATABASE_URL",
              "PRIVATE_KEY",
          )


          safe_values = {
              "",
              "example",
              "placeholder",
              "test",
              "fake",
              "fake-test-key",
              "change-me",
              "changeme",
              "your-key-here",
              "your-secret-here",
              "BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "DATABASE_URL",
              "GROQ_API_KEY",
              "OPENAI_API_KEY",
              "SUPPORT_ADMIN_TELEGRAM_ID",
              "SUPPORT_AI_PROVIDER",
              "SUPPORT_AI_MODEL",
          }


          findings = []


          def get_assignment_names(
              target,
          ):
              if isinstance(
                  target,
                  ast.Name,
              ):
                  return [
                      target.id
                  ]


              if isinstance(
                  target,
                  (
                      ast.Tuple,
                      ast.List,
                  ),
              ):
                  names = []


                  for element in target.elts:
                      names.extend(
                          get_assignment_names(
                              element
                          )
                      )


                  return names


              return []


          for path in Path(".").rglob("*.py"):
              if (
                  ".git" in path.parts
                  or "__pycache__"
                  in path.parts
              ):
                  continue


              source = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )


              try:
                  tree = ast.parse(
                      source
                  )
              except SyntaxError:
                  continue


              for node in ast.walk(tree):
                  targets = []
                  value = None


                  if isinstance(
                      node,
                      ast.Assign,
                  ):
                      targets = node.targets
                      value = node.value


                  elif isinstance(
                      node,
                      ast.AnnAssign,
                  ):
                      targets = [
                          node.target
                      ]

                      value = node.value


                  if not (
                      isinstance(
                          value,
                          ast.Constant,
                      )
                      and isinstance(
                          value.value,
                          str,
                      )
                  ):
                      continue


                  assignment_names = []


                  for target in targets:
                      assignment_names.extend(
                          get_assignment_names(
                              target
                          )
                      )


                  for assignment_name in (
                      assignment_names
                  ):
                      uppercase_name = (
                          assignment_name.upper()
                      )


                      is_sensitive_name = any(
                          fragment
                          in uppercase_name
                          for fragment
                          in sensitive_fragments
                      )


                      if not is_sensitive_name:
                          continue


                      literal_value = (
                          value.value.strip()
                      )


                      if (
                          not literal_value
                          or literal_value
                          in safe_values
                          or literal_value.lower()
                          in safe_values
                      ):
                          continue


                      findings.append(
                          (
                              str(path),
                              node.lineno,
                              assignment_name,
                          )
                      )


          print("=" * 40)
          print("HARDCODED ASSIGNMENT SCAN")
          print("=" * 40)


          if findings:
              for (
                  repository_path,
                  line_number,
                  assignment_name,
              ) in findings:
                  print(
                      "REVIEW REQUIRED:",
                      repository_path,
                      "| line:",
                      line_number,
                      "| variable:",
                      assignment_name,
                  )


              print(
                  "ASSIGNED VALUES WERE NOT PRINTED"
              )


              raise SystemExit(1)


          print(
              "NO SUSPICIOUS HARDCODED "
              "ASSIGNMENTS DETECTED"
          )
          PY

      - name: Inspect environment references
        run: |
          python - <<'PY'
          from pathlib import Path


          environment_names = (
              "BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "DATABASE_URL",
              "GROQ_API_KEY",
              "OPENAI_API_KEY",
              "SUPPORT_ADMIN_TELEGRAM_ID",
              "SUPPORT_AI_PROVIDER",
              "SUPPORT_AI_MODEL",
          )


          combined_source = "\n".join(
              path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )
              for path
              in Path(".").rglob("*.py")
              if ".git"
              not in path.parts
              and "__pycache__"
              not in path.parts
          )


          print("=" * 40)
          print("ENVIRONMENT REFERENCES")
          print("=" * 40)


          for environment_name in (
              environment_names
          ):
              if (
                  environment_name
                  in combined_source
              ):
                  print(
                      "REFERENCED:",
                      environment_name,
                  )
              else:
                  print(
                      "NOT REFERENCED:",
                      environment_name,
                  )


          print(
              "NO ENVIRONMENT VALUES DISPLAYED"
          )
          PY

      - name: Inspect workflow logging
        run: |
          python - <<'PY'
          from pathlib import Path


          sensitive_names = (
              "BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "DATABASE_URL",
              "GROQ_API_KEY",
              "OPENAI_API_KEY",
              "SUPPORT_ADMIN_TELEGRAM_ID",
          )


          findings = []


          for path in Path(
              ".github/workflows"
          ).glob("*.y*ml"):
              content = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )


              for line_number, line in enumerate(
                  content.splitlines(),
                  start=1,
              ):
                  lowered = line.lower()


                  uses_output_command = (
                      "echo " in lowered
                      or "printf " in lowered
                  )


                  if not uses_output_command:
                      continue


                  for sensitive_name in (
                      sensitive_names
                  ):
                      if sensitive_name in line:
                          findings.append(
                              (
                                  str(path),
                                  line_number,
                                  sensitive_name,
                              )
                          )


          print("=" * 40)
          print("WORKFLOW SECRET LOGGING")
          print("=" * 40)


          if findings:
              for (
                  repository_path,
                  line_number,
                  sensitive_name,
              ) in findings:
                  print(
                      "REVIEW REQUIRED:",
                      repository_path,
                      "| line:",
                      line_number,
                      "| variable:",
                      sensitive_name,
                  )


              print(
                  "SECRET VALUES WERE NOT PRINTED"
              )


              raise SystemExit(1)


          print(
              "NO SECRET LOGGING PATTERN DETECTED"
          )
          PY

      - name: Check OpenAI references
        run: |
          python - <<'PY'
          from pathlib import Path


          references = []


          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue


              if (
                  ".git" in path.parts
                  or "__pycache__"
                  in path.parts
              ):
                  continue


              if path.suffix.lower() not in {
                  ".py",
                  ".yml",
                  ".yaml",
                  ".txt",
                  ".md",
              }:
                  continue


              content = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )


              if "OPENAI_API_KEY" in content:
                  references.append(
                      str(path)
                  )


          print("=" * 40)
          print("OPENAI CONFIGURATION")
          print("=" * 40)


          if not references:
              print(
                  "NO OPENAI_API_KEY "
                  "REFERENCE FOUND"
              )
          else:
              print(
                  "OPENAI_API_KEY REFERENCES FOUND"
              )


              for repository_path in sorted(
                  set(references)
              ):
                  print(
                      "  ",
                      repository_path,
                  )


              print(
                  "NOTICE: the old Render "
                  "OPENAI_API_KEY can probably "
                  "be removed after review."
              )
          PY

      - name: Verify Groq provider
        run: |
          grep -q \
            '"GROQ_API_KEY"' \
            paysupport_ai.py

          grep -q \
            '"SUPPORT_AI_PROVIDER"' \
            paysupport_ai.py

          grep -q \
            "https://api.groq.com/openai/v1" \
            paysupport_ai.py

          grep -q \
            'provider != "groq"' \
            paysupport_ai.py

          echo "GROQ PROVIDER CONTRACT PRESENT"

      - name: Inspect available Git history safely
        run: |
          python - <<'PY'
          import re
          import subprocess


          patterns = {
              "Telegram bot token": re.compile(
                  rb"(?<![A-Za-z0-9_])"
                  rb"[0-9]{6,12}:"
                  rb"[A-Za-z0-9_-]{30,}"
              ),
              "Groq API key": re.compile(
                  rb"(?<![A-Za-z0-9])"
                  rb"gsk_"
                  rb"[A-Za-z0-9_-]{20,}"
              ),
              "OpenAI API key": re.compile(
                  rb"(?<![A-Za-z0-9])"
                  rb"sk-"
                  rb"(?:proj-)?"
                  rb"[A-Za-z0-9_-]{20,}"
              ),
              "Database credential URL": re.compile(
                  rb"postgres(?:ql)?://"
                  rb"[^:\s/@]+:"
                  rb"[^@\s/]+@"
                  rb"[^\s\"']+",
                  re.IGNORECASE,
              ),
              "Private key material": re.compile(
                  rb"-----BEGIN "
                  rb"(?:RSA |EC |OPENSSH )?"
                  rb"PRIVATE KEY-----"
              ),
          }


          print("=" * 40)
          print("SAFE GIT HISTORY INSPECTION")
          print("=" * 40)


          revision_result = subprocess.run(
              [
                  "git",
                  "rev-list",
                  "--all",
              ],
              capture_output=True,
              text=True,
          )


          if revision_result.returncode != 0:
              print(
                  "NOTICE: Git history is "
                  "not available to this runner."
              )

              print(
                  "Current tracked files were "
                  "still scanned successfully."
              )

              print(
                  "History inspection skipped safely."
              )

              raise SystemExit(0)


          revisions = [
              revision.strip()
              for revision
              in revision_result.stdout.splitlines()
              if revision.strip()
          ]


          if not revisions:
              print(
                  "NOTICE: no Git revisions available."
              )

              raise SystemExit(0)


          findings = {
              label: 0
              for label in patterns
          }


          scanned_commits = 0
          skipped_commits = 0


          for revision in revisions:
              diff_result = subprocess.run(
                  [
                      "git",
                      "show",
                      "--format=",
                      "--no-ext-diff",
                      "--no-textconv",
                      revision,
                  ],
                  capture_output=True,
              )


              if diff_result.returncode != 0:
                  skipped_commits += 1
                  continue


              scanned_commits += 1


              content = diff_result.stdout


              for label, pattern in patterns.items():
                  findings[label] += len(
                      pattern.findall(
                          content
                      )
                  )


          print(
              "COMMITS SCANNED:",
              scanned_commits,
          )


          print(
              "COMMITS SKIPPED:",
              skipped_commits,
          )


          secret_findings = {
              label: count
              for label, count
              in findings.items()
              if count
          }


          if secret_findings:
              for label, count in (
                  secret_findings.items()
              ):
                  print(
                      "HISTORY SUSPECT:",
                      label,
                      "| matches:",
                      count,
                  )


              print(
                  "SECRET VALUES AND COMMIT IDS "
                  "WERE NOT PRINTED"
              )


              raise SystemExit(1)


          print(
              "NO HIGH CONFIDENCE SECRET "
              "PATTERNS DETECTED IN "
              "AVAILABLE HISTORY"
          )
          PY

      - name: Compile production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile paysupport_ai.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile referral_engine.py
          python -m py_compile level_rewards_engine.py
          python -m py_compile terms_engine.py

          echo "PRODUCTION STACK COMPILES"

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Prove zero repository changes
        run: |
          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(git status --porcelain)"

          echo "NO REPOSITORY FILE CHANGED"

      - name: Final read only confirmation
        run: |
          echo "======================================"
          echo "SECRET AUDIT READ ONLY COMPLETE"
          echo "======================================"
          echo "Secret values printed: 0"
          echo "Files modified: 0"
          echo "Files deleted: 0"
          echo "Database writes: 0"
          echo "Telegram messages: 0"
          echo "Points modified: 0"
          echo "Payments touched: 0"
