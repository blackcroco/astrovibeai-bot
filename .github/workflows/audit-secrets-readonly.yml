name: Audit Secrets Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: |
          test -f bot.py
          test -f requirements.txt
          test -d .github/workflows

          echo "REPOSITORY READY"
          echo "SECRET AUDIT IS READ ONLY"
          echo "SECRET VALUES WILL NOT BE PRINTED"

      - name: Verify required environment variable names
        run: |
          python - <<'PY'
          from pathlib import Path


          files = [
              path
              for path in Path(".").rglob("*.py")
              if ".git" not in path.parts
              and "__pycache__" not in path.parts
          ]

          combined = "\n".join(
              path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )
              for path in files
          )

          expected = {
              "Telegram bot configuration": (
                  "BOT_TOKEN",
                  "TELEGRAM_BOT_TOKEN",
                  "TOKEN",
              ),
              "Database configuration": (
                  "DATABASE_URL",
              ),
              "Groq configuration": (
                  "GROQ_API_KEY",
              ),
              "Support administrator": (
                  "SUPPORT_ADMIN_TELEGRAM_ID",
              ),
              "AI provider": (
                  "SUPPORT_AI_PROVIDER",
              ),
              "AI model": (
                  "SUPPORT_AI_MODEL",
              ),
          }

          print("=" * 40)
          print("ENVIRONMENT VARIABLE REFERENCES")
          print("=" * 40)

          for label, alternatives in expected.items():
              found = [
                  name
                  for name in alternatives
                  if name in combined
              ]

              if found:
                  print(
                      "FOUND:",
                      label,
                      "via",
                      ", ".join(found),
                  )
              else:
                  print(
                      "NOT FOUND:",
                      label,
                  )

          print(
              "ENVIRONMENT REFERENCE CHECK COMPLETE"
          )
          PY

      - name: Verify secrets are read from environment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re


          secret_names = (
              "BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "DATABASE_URL",
              "GROQ_API_KEY",
              "OPENAI_API_KEY",
              "SUPPORT_ADMIN_TELEGRAM_ID",
          )

          python_files = [
              path
              for path in Path(".").rglob("*.py")
              if ".git" not in path.parts
              and "__pycache__" not in path.parts
          ]

          print("=" * 40)
          print("ENVIRONMENT ACCESS CHECK")
          print("=" * 40)

          for secret_name in secret_names:
              references = []
              environment_reads = []

              for path in python_files:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )

                  if secret_name in text:
                      references.append(
                          str(path)
                      )

                  patterns = (
                      (
                          r"os\.getenv\(\s*[\"']"
                          + re.escape(secret_name)
                          + r"[\"']"
                      ),
                      (
                          r"os\.environ(?:\.get)?\(\s*[\"']"
                          + re.escape(secret_name)
                          + r"[\"']"
                      ),
                      (
                          r"os\.environ$$\s*[\"']"
                          + re.escape(secret_name)
                          + r"[\"']\s*$$"
                      ),
                  )

                  if any(
                      re.search(pattern, text)
                      for pattern in patterns
                  ):
                      environment_reads.append(
                          str(path)
                      )

              if references:
                  print(
                      "REFERENCED:",
                      secret_name,
                      "in",
                      len(set(references)),
                      "file(s)",
                  )
              else:
                  print(
                      "NOT REFERENCED:",
                      secret_name,
                  )

              if environment_reads:
                  print(
                      "ENVIRONMENT READ:",
                      secret_name,
                      "in",
                      len(set(environment_reads)),
                      "file(s)",
                  )
              elif references:
                  print(
                      "REVIEW REQUIRED:",
                      secret_name,
                      "is referenced but no direct "
                      "environment read was detected",
                  )

          print(
              "NO SECRET VALUES DISPLAYED"
          )
          PY

      - name: Scan current files for high confidence secret patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys


          excluded_directories = {
              ".git",
              "__pycache__",
              ".venv",
              "venv",
              "node_modules",
          }

          allowed_suffixes = {
              ".py",
              ".yml",
              ".yaml",
              ".json",
              ".toml",
              ".ini",
              ".cfg",
              ".conf",
              ".txt",
              ".md",
              ".sh",
          }

          patterns = {
              "Telegram bot token": re.compile(
                  r"(?<![A-Za-z0-9_])"
                  r"[0-9]{6,12}:"
                  r"[A-Za-z0-9_-]{30,}"
              ),
              "Groq API key": re.compile(
                  r"(?<![A-Za-z0-9])"
                  r"gsk_[A-Za-z0-9_-]{20,}"
              ),
              "OpenAI API key": re.compile(
                  r"(?<![A-Za-z0-9])"
                  r"sk-(?:proj-)?"
                  r"[A-Za-z0-9_-]{20,}"
              ),
              "PostgreSQL credential URL": re.compile(
                  r"postgres(?:ql)?://"
                  r"[^:\s/@]+:"
                  r"[^@\s/]+@"
                  r"[^\s\"']+",
                  re.IGNORECASE,
              ),
              "Private key material": re.compile(
                  r"-----BEGIN "
                  r"(?:RSA |EC |OPENSSH )?"
                  r"PRIVATE KEY-----"
              ),
          }

          findings = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if any(
                  part in excluded_directories
                  for part in path.parts
              ):
                  continue

              if (
                  path.suffix
                  and path.suffix.lower()
                  not in allowed_suffixes
              ):
                  continue

              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
              except OSError:
                  continue

              for label, pattern in patterns.items():
                  count = len(
                      pattern.findall(text)
                  )

                  if count:
                      findings.append(
                          (
                              str(path),
                              label,
                              count,
                          )
                      )

          print("=" * 40)
          print("CURRENT FILE SECRET PATTERN SCAN")
          print("=" * 40)

          if not findings:
              print(
                  "NO HIGH CONFIDENCE SECRET "
                  "PATTERNS DETECTED"
              )
          else:
              for path, label, count in findings:
                  print(
                      "SUSPECT:",
                      label,
                      "| file:",
                      path,
                      "| matches:",
                      count,
                  )

              print(
                  "SECRET VALUES WERE NOT PRINTED"
              )

              sys.exit(1)
          PY

      - name: Scan assignments for hardcoded sensitive values
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import sys


          sensitive_fragments = (
              "TOKEN",
              "API_KEY",
              "SECRET",
              "PASSWORD",
              "DATABASE_URL",
              "BOT_KEY",
              "PRIVATE_KEY",
          )

          safe_values = {
              "",
              "change-me",
              "changeme",
              "example",
              "placeholder",
              "test",
              "fake",
              "fake-test-key",
              "your-key-here",
              "your-secret-here",
          }

          findings = []


          def assigned_names(target):
              if isinstance(target, ast.Name):
                  return [target.id]

              if isinstance(
                  target,
                  (
                      ast.Tuple,
                      ast.List,
                  ),
              ):
                  result = []

                  for item in target.elts:
                      result.extend(
                          assigned_names(item)
                      )

                  return result

              return []


          for path in Path(".").rglob("*.py"):
              if (
                  ".git" in path.parts
                  or "__pycache__" in path.parts
              ):
                  continue

              source = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              try:
                  tree = ast.parse(source)
              except SyntaxError:
                  continue

              for node in ast.walk(tree):
                  targets = []
                  value = None

                  if isinstance(node, ast.Assign):
                      targets = node.targets
                      value = node.value

                  elif isinstance(
                      node,
                      ast.AnnAssign,
                  ):
                      targets = [node.target]
                      value = node.value

                  if value is None:
                      continue

                  if not (
                      isinstance(
                          value,
                          ast.Constant,
                      )
                      and isinstance(
                          value.value,
                          str,
                      )
                  ):
                      continue

                  names = []

                  for target in targets:
                      names.extend(
                          assigned_names(target)
                      )

                  for name in names:
                      upper_name = name.upper()

                      if not any(
                          fragment in upper_name
                          for fragment
                          in sensitive_fragments
                      ):
                          continue

                      literal = value.value.strip()

                      if (
                          not literal
                          or literal.lower()
                          in safe_values
                      ):
                          continue

                      if literal in {
                          "BOT_TOKEN",
                          "DATABASE_URL",
                          "GROQ_API_KEY",
                          "OPENAI_API_KEY",
                          "SUPPORT_ADMIN_TELEGRAM_ID",
                          "SUPPORT_AI_PROVIDER",
                          "SUPPORT_AI_MODEL",
                      }:
                          continue

                      findings.append(
                          (
                              str(path),
                              node.lineno,
                              name,
                          )
                      )

          print("=" * 40)
          print("HARDCODED ASSIGNMENT SCAN")
          print("=" * 40)

          if not findings:
              print(
                  "NO SUSPICIOUS HARDCODED "
                  "ASSIGNMENTS DETECTED"
              )
          else:
              for path, line, name in findings:
                  print(
                      "REVIEW REQUIRED:",
                      path,
                      "| line:",
                      line,
                      "| variable:",
                      name,
                  )

              print(
                  "ASSIGNED VALUES WERE NOT PRINTED"
              )

              sys.exit(1)
          PY

      - name: Check tracked environment files
        run: |
          echo "======================================"
          echo "TRACKED ENVIRONMENT FILES"
          echo "======================================"

          TRACKED="$(
            git ls-files \
              | grep -E \
                '(^|/)\.env($|\.)|(^|/).*\.pem$|(^|/).*\.key$|(^|/)id_rsa$|(^|/)credentials\.json$' \
              || true
          )"

          if [ -n "$TRACKED" ]; then
            echo "SENSITIVE FILE CANDIDATES ARE TRACKED:"
            echo "$TRACKED"
            exit 1
          fi

          echo "NO SENSITIVE ENVIRONMENT FILE TRACKED"

      - name: Verify gitignore secret protections
        run: |
          echo "======================================"
          echo "GITIGNORE SECRET PROTECTIONS"
          echo "======================================"

          if [ ! -f .gitignore ]; then
            echo ".gitignore is missing."
            exit 1
          fi

          grep -Eq \
            '(^|/)\.env($|\*)|\.env\*|\.env\.' \
            .gitignore \
            || {
              echo ".env protection not detected."
              exit 1
            }

          echo ".ENV FILE PROTECTION DETECTED"

          if grep -Eq \
            '\*\.pem|\*\.key|id_rsa' \
            .gitignore
          then
            echo "PRIVATE KEY FILE PROTECTION DETECTED"
          else
            echo "NOTICE: no generic private-key rule detected"
          fi

      - name: Inspect workflow secret handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys


          findings = []

          patterns = {
              "Literal secret assignment": re.compile(
                  r"(?im)^\s*"
                  r"(?:BOT_TOKEN|TELEGRAM_BOT_TOKEN|"
                  r"DATABASE_URL|GROQ_API_KEY|"
                  r"OPENAI_API_KEY|"
                  r"SUPPORT_ADMIN_TELEGRAM_ID)"
                  r"\s*:\s*"
                  r"[\"']?"
                  r"(?!\$\{\{\s*secrets\.)"
                  r"(?!fake)"
                  r"(?!test)"
                  r"(?!placeholder)"
                  r"[^\s\"']{8,}"
              ),
              "Secret echoed to logs": re.compile(
                  r"(?im)^\s*"
                  r"(?:echo|printf)\s+"
                  r".*"
                  r"(?:GROQ_API_KEY|OPENAI_API_KEY|"
                  r"BOT_TOKEN|DATABASE_URL)"
              ),
          }

          for path in Path(
              ".github/workflows"
          ).glob("*.y*ml"):
              text = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              for label, pattern in patterns.items():
                  count = len(
                      pattern.findall(text)
                  )

                  if count:
                      findings.append(
                          (
                              str(path),
                              label,
                              count,
                          )
                      )

          print("=" * 40)
          print("WORKFLOW SECRET HANDLING")
          print("=" * 40)

          if not findings:
              print(
                  "NO SUSPICIOUS WORKFLOW "
                  "SECRET HANDLING DETECTED"
              )
          else:
              for path, label, count in findings:
                  print(
                      "REVIEW REQUIRED:",
                      label,
                      "| file:",
                      path,
                      "| matches:",
                      count,
                  )

              print(
                  "SECRET VALUES WERE NOT PRINTED"
              )

              sys.exit(1)
          PY

      - name: Check obsolete OpenAI configuration
        run: |
          python - <<'PY'
          from pathlib import Path


          references = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if (
                  ".git" in path.parts
                  or "__pycache__" in path.parts
              ):
                  continue

              if path.suffix.lower() not in {
                  ".py",
                  ".yml",
                  ".yaml",
                  ".txt",
                  ".md",
              }:
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              if "OPENAI_API_KEY" in text:
                  references.append(
                      str(path)
                  )

          print("=" * 40)
          print("OBSOLETE OPENAI CONFIGURATION")
          print("=" * 40)

          if references:
              print(
                  "OPENAI_API_KEY REFERENCES FOUND:"
              )

              for path in sorted(
                  set(references)
              ):
                  print(
                      "  ",
                      path,
                  )

              print(
                  "Review whether the Render variable "
                  "can be deleted or revoked."
              )
          else:
              print(
                  "NO OPENAI_API_KEY REFERENCE "
                  "IN CURRENT FILES"
              )
          PY

      - name: Check current Groq provider contract
        run: |
          grep -q \
            '"GROQ_API_KEY"' \
            paysupport_ai.py

          grep -q \
            '"SUPPORT_AI_PROVIDER"' \
            paysupport_ai.py

          grep -q \
            "https://api.groq.com/openai/v1" \
            paysupport_ai.py

          grep -q \
            'provider != "groq"' \
            paysupport_ai.py

          echo "GROQ PROVIDER CONTRACT PRESENT"

      - name: Scan Git history without displaying values
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys


          patterns = {
              "Telegram bot token": re.compile(
                  rb"(?<![A-Za-z0-9_])"
                  rb"[0-9]{6,12}:"
                  rb"[A-Za-z0-9_-]{30,}"
              ),
              "Groq API key": re.compile(
                  rb"(?<![A-Za-z0-9])"
                  rb"gsk_[A-Za-z0-9_-]{20,}"
              ),
              "OpenAI API key": re.compile(
                  rb"(?<![A-Za-z0-9])"
                  rb"sk-(?:proj-)?"
                  rb"[A-Za-z0-9_-]{20,}"
              ),
              "Database credential URL": re.compile(
                  rb"postgres(?:ql)?://"
                  rb"[^:\s/@]+:"
                  rb"[^@\s/]+@"
                  rb"[^\s\"']+",
                  re.IGNORECASE,
              ),
              "Private key material": re.compile(
                  rb"-----BEGIN "
                  rb"(?:RSA |EC |OPENSSH )?"
                  rb"PRIVATE KEY-----"
              ),
          }

          revisions = subprocess.run(
              [
                  "git",
                  "rev-list",
                  "--all",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          finding_counts = {
              label: 0
              for label in patterns
          }

          affected_commits = set()

          for revision in revisions:
              changed_files = subprocess.run(
                  [
                      "git",
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "-r",
                      revision,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()

              for file_path in changed_files:
                  if not file_path:
                      continue

                  blob = subprocess.run(
                      [
                          "git",
                          "show",
                          f"{revision}:{file_path}",
                      ],
                      capture_output=True,
                  )

                  if blob.returncode != 0:
                      continue

                  content = blob.stdout

                  for label, pattern in patterns.items():
                      count = len(
                          pattern.findall(content)
                      )

                      if count:
                          finding_counts[
                              label
                          ] += count

                          affected_commits.add(
                              revision
                          )

          print("=" * 40)
          print("GIT HISTORY SECRET PATTERN SCAN")
          print("=" * 40)

          total = sum(
              finding_counts.values()
          )

          if total == 0:
              print(
                  "NO HIGH CONFIDENCE SECRET "
                  "PATTERNS DETECTED IN HISTORY"
              )
          else:
              for label, count in finding_counts.items():
                  if count:
                      print(
                          "HISTORY SUSPECT:",
                          label,
                          "| matches:",
                          count,
                      )

              print(
                  "AFFECTED COMMIT COUNT:",
                  len(affected_commits),
              )

              print(
                  "SECRET VALUES AND COMMIT IDS "
                  "WERE NOT PRINTED"
              )

              sys.exit(1)
          PY

      - name: Compile critical production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile paysupport_ai.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile referral_engine.py
          python -m py_compile level_rewards_engine.py
          python -m py_compile terms_engine.py

          echo "PRODUCTION STACK COMPILES"

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Prove zero repository changes
        run: |
          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(git status --porcelain)"

          echo "NO REPOSITORY FILE CHANGED"

      - name: Final read only confirmation
        run: |
          echo "======================================"
          echo "SECRET AUDIT READ ONLY COMPLETE"
          echo "======================================"
          echo "Secret values printed: 0"
          echo "Files modified: 0"
          echo "Files deleted: 0"
          echo "Database writes: 0"
          echo "Telegram messages: 0"
          echo "Points modified: 0"
          echo "Payments touched: 0"
