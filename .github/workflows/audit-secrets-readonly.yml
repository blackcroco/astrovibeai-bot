name: Audit Secrets Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository
        run: |
          test -f bot.py
          test -f requirements.txt
          test -d .github/workflows

          echo "REPOSITORY READY"
          echo "SECRET AUDIT IS READ ONLY"
          echo "SECRET VALUES WILL NEVER BE PRINTED"

      - name: Check tracked sensitive files
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.run(
              [
                  "git",
                  "ls-files",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()

          suspicious = []

          sensitive_names = {
              ".env",
              "id_rsa",
              "id_ed25519",
              "credentials.json",
          }

          sensitive_suffixes = (
              ".pem",
              ".key",
          )

          for path in tracked:
              filename = path.rsplit(
                  "/",
                  1,
              )[-1]

              if (
                  filename in sensitive_names
                  or filename.startswith(
                      ".env."
                  )
                  or filename.endswith(
                      sensitive_suffixes
                  )
              ):
                  suspicious.append(
                      path
                  )

          print("=" * 40)
          print("TRACKED SENSITIVE FILES")
          print("=" * 40)

          if suspicious:
              for path in suspicious:
                  print(
                      "REVIEW REQUIRED:",
                      path,
                  )

              raise SystemExit(1)

          print(
              "NO SENSITIVE FILES TRACKED"
          )
          PY

      - name: Inspect gitignore
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".gitignore")

          print("=" * 40)
          print("GITIGNORE INSPECTION")
          print("=" * 40)

          if not path.exists():
              print(
                  "NOTICE: .gitignore is missing."
              )

              print(
                  "This does NOT fail the "
                  "read-only audit."
              )

              print(
                  "A production .gitignore "
                  "should be added later."
              )

              raise SystemExit(0)

          text = path.read_text(
              encoding="utf-8",
              errors="replace",
          )

          checks = {
              ".env protection": (
                  ".env" in text
              ),
              "Python cache protection": (
                  "__pycache__" in text
                  or "*.pyc" in text
              ),
              "PEM protection": (
                  "*.pem" in text
              ),
              "KEY protection": (
                  "*.key" in text
              ),
          }

          for label, present in checks.items():
              print(
                  label + ":",
                  "YES"
                  if present
                  else "NOTICE: NOT FOUND",
              )

          print(
              "GITIGNORE INSPECTION COMPLETE"
          )
          PY

      - name: Scan current files for high confidence secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = {
              "Telegram bot token": re.compile(
                  r"(?<![A-Za-z0-9_])"
                  r"[0-9]{6,12}:"
                  r"[A-Za-z0-9_-]{30,}"
              ),
              "Groq API key": re.compile(
                  r"(?<![A-Za-z0-9])"
                  r"gsk_"
                  r"[A-Za-z0-9_-]{20,}"
              ),
              "OpenAI API key": re.compile(
                  r"(?<![A-Za-z0-9])"
                  r"sk-"
                  r"(?:proj-)?"
                  r"[A-Za-z0-9_-]{20,}"
              ),
              "PostgreSQL credential URL": re.compile(
                  r"postgres(?:ql)?://"
                  r"[^:\s/@]+:"
                  r"[^@\s/]+@"
                  r"[^\s\"']+",
                  re.IGNORECASE,
              ),
              "Private key": re.compile(
                  r"-----BEGIN "
                  r"(?:RSA |EC |OPENSSH )?"
                  r"PRIVATE KEY-----"
              ),
          }

          allowed_extensions = {
              ".py",
              ".yml",
              ".yaml",
              ".json",
              ".toml",
              ".ini",
              ".cfg",
              ".conf",
              ".txt",
              ".md",
              ".sh",
          }

          excluded = {
              ".git",
              "__pycache__",
              ".venv",
              "venv",
              "node_modules",
          }

          findings = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if any(
                  part in excluded
                  for part in path.parts
              ):
                  continue

              if (
                  path.suffix
                  and path.suffix.lower()
                  not in allowed_extensions
              ):
                  continue

              content = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              for label, pattern in patterns.items():
                  matches = pattern.findall(
                      content
                  )

                  if matches:
                      findings.append(
                          (
                              str(path),
                              label,
                              len(matches),
                          )
                      )

          print("=" * 40)
          print("CURRENT FILE SECRET SCAN")
          print("=" * 40)

          if not findings:
              print(
                  "NO HIGH CONFIDENCE SECRET "
                  "PATTERNS DETECTED"
              )

              raise SystemExit(0)

          for path, label, count in findings:
              print(
                  "SUSPECT:",
                  label,
                  "| file:",
                  path,
                  "| count:",
                  count,
              )

          print(
              "SECRET VALUES WERE NOT PRINTED"
          )

          raise SystemExit(1)
          PY

      - name: Scan Python assignments
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          fragments = (
              "TOKEN",
              "API_KEY",
              "SECRET",
              "PASSWORD",
              "DATABASE_URL",
              "PRIVATE_KEY",
          )

          known_environment_names = {
              "BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "DATABASE_URL",
              "GROQ_API_KEY",
              "OPENAI_API_KEY",
              "SUPPORT_ADMIN_TELEGRAM_ID",
              "SUPPORT_AI_PROVIDER",
              "SUPPORT_AI_MODEL",
          }

          harmless_values = {
              "",
              "example",
              "placeholder",
              "test",
              "fake",
              "fake-test-key",
              "change-me",
              "changeme",
              "your-key-here",
              "your-secret-here",
          }

          findings = []


          def names_from_target(
              target,
          ):
              if isinstance(
                  target,
                  ast.Name,
              ):
                  return [
                      target.id
                  ]

              if isinstance(
                  target,
                  (
                      ast.Tuple,
                      ast.List,
                  ),
              ):
                  names = []

                  for element in target.elts:
                      names.extend(
                          names_from_target(
                              element
                          )
                      )

                  return names

              return []


          for path in Path(".").rglob("*.py"):
              if (
                  ".git" in path.parts
                  or "__pycache__"
                  in path.parts
              ):
                  continue

              source = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              tree = ast.parse(
                  source
              )

              for node in ast.walk(tree):
                  targets = []
                  value = None

                  if isinstance(
                      node,
                      ast.Assign,
                  ):
                      targets = (
                          node.targets
                      )

                      value = node.value

                  elif isinstance(
                      node,
                      ast.AnnAssign,
                  ):
                      targets = [
                          node.target
                      ]

                      value = node.value

                  if not isinstance(
                      value,
                      ast.Constant,
                  ):
                      continue

                  if not isinstance(
                      value.value,
                      str,
                  ):
                      continue

                  variable_names = []

                  for target in targets:
                      variable_names.extend(
                          names_from_target(
                              target
                          )
                      )

                  for variable_name in variable_names:
                      uppercase = (
                          variable_name.upper()
                      )

                      sensitive = any(
                          fragment in uppercase
                          for fragment
                          in fragments
                      )

                      if not sensitive:
                          continue

                      literal = (
                          value.value.strip()
                      )

                      if not literal:
                          continue

                      if (
                          literal
                          in known_environment_names
                          or literal.lower()
                          in harmless_values
                      ):
                          continue

                      findings.append(
                          (
                              str(path),
                              node.lineno,
                              variable_name,
                          )
                      )

          print("=" * 40)
          print("HARDCODED ASSIGNMENT SCAN")
          print("=" * 40)

          if not findings:
              print(
                  "NO SUSPICIOUS HARDCODED "
                  "ASSIGNMENTS DETECTED"
              )

              raise SystemExit(0)

          for path, line, variable in findings:
              print(
                  "REVIEW REQUIRED:",
                  path,
                  "| line:",
                  line,
                  "| variable:",
                  variable,
              )

          print(
              "ASSIGNED VALUES WERE NOT PRINTED"
          )

          raise SystemExit(1)
          PY

      - name: Inspect expected environment references
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              path
              for path
              in Path(".").rglob("*.py")
              if ".git"
              not in path.parts
              and "__pycache__"
              not in path.parts
          ]

          combined = "\n".join(
              path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )
              for path in files
          )

          names = (
              "BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "DATABASE_URL",
              "GROQ_API_KEY",
              "OPENAI_API_KEY",
              "SUPPORT_ADMIN_TELEGRAM_ID",
              "SUPPORT_AI_PROVIDER",
              "SUPPORT_AI_MODEL",
          )

          print("=" * 40)
          print("ENVIRONMENT REFERENCES")
          print("=" * 40)

          for name in names:
              if name in combined:
                  print(
                      "REFERENCED:",
                      name,
                  )
              else:
                  print(
                      "NOT REFERENCED:",
                      name,
                  )

          print(
              "NO ENVIRONMENT VALUES DISPLAYED"
          )
          PY

      - name: Inspect workflow secret handling
        run: |
          python - <<'PY'
          from pathlib import Path

          sensitive = (
              "BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "DATABASE_URL",
              "GROQ_API_KEY",
              "OPENAI_API_KEY",
              "SUPPORT_ADMIN_TELEGRAM_ID",
          )

          issues = []

          for path in Path(
              ".github/workflows"
          ).glob("*.y*ml"):
              text = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              lowered = text.lower()

              for name in sensitive:
                  if name not in text:
                      continue

                  for command in (
                      "echo",
                      "printf",
                  ):
                      for line_number, line in enumerate(
                          text.splitlines(),
                          start=1,
                      ):
                          if (
                              command
                              in line.lower()
                              and name in line
                          ):
                              issues.append(
                                  (
                                      str(path),
                                      line_number,
                                      name,
                                  )
                              )

          print("=" * 40)
          print("WORKFLOW SECRET HANDLING")
          print("=" * 40)

          if not issues:
              print(
                  "NO SECRET ECHO PATTERNS "
                  "DETECTED"
              )

              raise SystemExit(0)

          for path, line, name in issues:
              print(
                  "REVIEW REQUIRED:",
                  path,
                  "| line:",
                  line,
                  "| variable:",
                  name,
              )

          print(
              "SECRET VALUES WERE NOT PRINTED"
          )

          raise SystemExit(1)
          PY

      - name: Check obsolete OpenAI configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          references = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if (
                  ".git" in path.parts
                  or "__pycache__"
                  in path.parts
              ):
                  continue

              if path.suffix.lower() not in {
                  ".py",
                  ".yml",
                  ".yaml",
                  ".txt",
                  ".md",
              }:
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              if "OPENAI_API_KEY" in text:
                  references.append(
                      str(path)
                  )

          print("=" * 40)
          print("OPENAI CONFIGURATION")
          print("=" * 40)

          if not references:
              print(
                  "NO OPENAI_API_KEY "
                  "REFERENCE FOUND"
              )
          else:
              print(
                  "OPENAI_API_KEY REFERENCES:"
              )

              for path in sorted(
                  set(references)
              ):
                  print(
                      "  ",
                      path,
                  )

              print(
                  "NOTICE: review whether "
                  "the old Render variable "
                  "is still necessary."
              )
          PY

      - name: Verify Groq provider contract
        run: |
          grep -q \
            '"GROQ_API_KEY"' \
            paysupport_ai.py

          grep -q \
            '"SUPPORT_AI_PROVIDER"' \
            paysupport_ai.py

          grep -q \
            "https://api.groq.com/openai/v1" \
            paysupport_ai.py

          grep -q \
            'provider != "groq"' \
            paysupport_ai.py

          echo "GROQ PROVIDER CONTRACT PRESENT"

      - name: Scan Git history for high confidence secrets
        run: |
          python - <<'PY'
          import re
          import subprocess

          patterns = {
              "Telegram bot token": re.compile(
                  rb"(?<![A-Za-z0-9_])"
                  rb"[0-9]{6,12}:"
                  rb"[A-Za-z0-9_-]{30,}"
              ),
              "Groq API key": re.compile(
                  rb"(?<![A-Za-z0-9])"
                  rb"gsk_"
                  rb"[A-Za-z0-9_-]{20,}"
              ),
              "OpenAI API key": re.compile(
                  rb"(?<![A-Za-z0-9])"
                  rb"sk-"
                  rb"(?:proj-)?"
                  rb"[A-Za-z0-9_-]{20,}"
              ),
              "Database credential URL": re.compile(
                  rb"postgres(?:ql)?://"
                  rb"[^:\s/@]+:"
                  rb"[^@\s/]+@"
                  rb"[^\s\"']+",
                  re.IGNORECASE,
              ),
              "Private key": re.compile(
                  rb"-----BEGIN "
                  rb"(?:RSA |EC |OPENSSH )?"
                  rb"PRIVATE KEY-----"
              ),
          }

          history = subprocess.run(
              [
                  "git",
                  "log",
                  "--all",
                  "-p",
                  "--no-color",
                  "--format=commit",
              ],
              check=True,
              capture_output=True,
          ).stdout

          findings = {}

          for label, pattern in patterns.items():
              count = len(
                  pattern.findall(
                      history
                  )
              )

              if count:
                  findings[
                      label
                  ] = count

          print("=" * 40)
          print("GIT HISTORY SECRET SCAN")
          print("=" * 40)

          if not findings:
              print(
                  "NO HIGH CONFIDENCE SECRET "
                  "PATTERNS DETECTED IN HISTORY"
              )

              raise SystemExit(0)

          for label, count in findings.items():
              print(
                  "HISTORY SUSPECT:",
                  label,
                  "| matches:",
                  count,
              )

          print(
              "SECRET VALUES WERE NOT PRINTED"
          )

          raise SystemExit(1)
          PY

      - name: Compile production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile paysupport_ai.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile referral_engine.py
          python -m py_compile level_rewards_engine.py
          python -m py_compile terms_engine.py

          echo "PRODUCTION STACK COMPILES"

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Prove zero repository changes
        run: |
          git diff --exit-code
          git diff --cached --exit-code

          test -z "$(git status --porcelain)"

          echo "NO REPOSITORY FILE CHANGED"

      - name: Final read only confirmation
        run: |
          echo "======================================"
          echo "SECRET AUDIT READ ONLY COMPLETE"
          echo "======================================"
          echo "Secret values printed: 0"
          echo "Files modified: 0"
          echo "Files deleted: 0"
          echo "Database writes: 0"
          echo "Telegram messages: 0"
          echo "Points modified: 0"
          echo "Payments touched: 0"
