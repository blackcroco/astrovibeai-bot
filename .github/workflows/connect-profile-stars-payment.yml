name: Connect AstroVibe Stars Payment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-stars-payment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate current production files
        run: |
          python -m py_compile bot.py
          python -m py_compile profile_stars_payment.py

      - name: Connect Stars payment handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          marker = "# ASTROVIBE REAL STARS PAYMENT"

          if marker in source:
              print("Stars payment already connected.")
              compile(source, "bot.py", "exec")
              raise SystemExit(0)

          tree = ast.parse(
              source,
              filename="bot.py",
          )

          callbacks = [
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name
              == "handle_profile_unlock_preview"
          ]

          if len(callbacks) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one "
                  "handle_profile_unlock_preview, found "
                  + str(len(callbacks))
              )

          callback = callbacks[0]

          decorator_lines = [
              decorator.lineno
              for decorator
              in callback.decorator_list
              if hasattr(decorator, "lineno")
          ]

          start_line = min(
              decorator_lines
              + [callback.lineno]
          )

          end_line = callback.end_lineno

          if end_line is None:
              raise SystemExit(
                  "ERROR: callback end line unavailable."
              )

          replacement_lines = [
              "# ============================================",
              "# ASTROVIBE REAL STARS PAYMENT",
              "# ============================================",
              "",
              "@bot.callback_query_handler(",
              "    func=lambda call: (",
              '        call.data == "unlock_profile_390"',
              "    )",
              ")",
              "def handle_profile_unlock_preview(call):",
              "    bot.answer_callback_query(",
              "        call.id",
              "    )",
              "",
              "    user_id = call.from_user.id",
              "",
              "    language = get_user_language(",
              "        user_id",
              "    )",
              "",
              "    from profile_stars_payment import (",
              "        build_profile_invoice,",
              "    )",
              "",
              "    invoice = build_profile_invoice(",
              "        user_id=user_id,",
              "        language=language,",
              "    )",
              "",
              "    prices = [",
              "        types.LabeledPrice(",
              '            label=item["label"],',
              '            amount=item["amount"],',
              "        )",
              '        for item in invoice["prices"]',
              "    ]",
              "",
              "    bot.send_invoice(",
              "        call.message.chat.id,",
              '        title=invoice["title"],',
              '        description=invoice["description"],',
              '        invoice_payload=invoice["payload"],',
              '        provider_token=invoice["provider_token"],',
              '        currency=invoice["currency"],',
              "        prices=prices,",
              '        start_parameter="astrovibe-profile-v2",',
              "    )",
              "",
          ]

          replacement = "\n".join(
              replacement_lines
          )

          lines = source.splitlines(
              keepends=True
          )

          lines[
              start_line - 1:
              end_line
          ] = [
              replacement
              + "\n"
          ]

          updated = "".join(lines)

          init_marker = "# INITIALISATION"

          if init_marker not in updated:
              raise SystemExit(
                  "ERROR: INITIALISATION marker missing."
              )

          payment_lines = [
