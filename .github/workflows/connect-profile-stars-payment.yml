name: Connect AstroVibe Stars Handlers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-stars-handlers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate current production
        run: |
          python -m py_compile bot.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py

      - name: Apply minimal Stars connection
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          marker = (
              "# ASTROVIBE MINIMAL STARS CONNECTION"
          )

          if marker in source:
              print("Minimal Stars connection already exists.")
              compile(source, "bot.py", "exec")
              raise SystemExit(0)

          tree = ast.parse(
              source,
              filename="bot.py",
          )

          callbacks = [
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "handle_profile_unlock_preview"
          ]

          if len(callbacks) != 1:
              raise SystemExit(
                  "ERROR: expected one unlock callback, found "
                  + str(len(callbacks))
              )

          callback = callbacks[0]

          if not callback.body:
              raise SystemExit(
                  "ERROR: unlock callback body is empty."
              )

          body_start = callback.body[0].lineno - 1
          body_end = callback.end_lineno

          new_body_lines = [
              "    language = get_user_language(",
              "        call.from_user.id",
              "    )",
              "",
              "    from profile_stars_handlers import (",
              "        send_profile_invoice,",
              "    )",
              "",
              "    send_profile_invoice(",
              "        bot,",
              "        call,",
              "        language,",
              "    )",
          ]

          new_body = "\n".join(new_body_lines)

          lines = source.splitlines(keepends=True)

          lines[body_start:body_end] = [
              new_body + "\n"
          ]

          updated = "".join(lines)

          init_marker = "# INITIALISATION"

          if init_marker not in updated:
              raise SystemExit(
                  "ERROR: INITIALISATION marker not found."
              )

          handler_lines = [
              "",
              "# ============================================",
              "# ASTROVIBE MINIMAL STARS CONNECTION",
              "# ============================================",
              "",
              "@bot.pre_checkout_query_handler(",
              "    func=lambda query: (",
              "        isinstance(query.invoice_payload, str)",
              "        and query.invoice_payload.startswith(",
              '            "astrovibe_profile_v2:"',
              "        )",
              "    )",
              ")",
              "def handle_profile_pre_checkout(query):",
              "    from profile_stars_handlers import (",
              "        process_profile_pre_checkout,",
              "    )",
              "",
              "    process_profile_pre_checkout(",
              "        bot,",
              "        query,",
              "    )",
              "",
              "",
              "@bot.message_handler(",
              '    content_types=["successful_payment"]',
              ")",
              "def handle_profile_successful_payment(message):",
              "    payment = message.successful_payment",
              "",
              "    if not isinstance(",
              "        payment.invoice_payload,",
              "        str,",
              "    ):",
              "        return",
              "",
              "    if not payment.invoice_payload.startswith(",
              '        "astrovibe_profile_v2:"',
              "    ):",
              "        return",
              "",
              "    from profile_stars_handlers import (",
              "        process_profile_successful_payment,",
              "    )",
              "",
              "    language = get_user_language(",
              "        message.from_user.id",
              "    )",
              "",
              "    process_profile_successful_payment(",
              "        bot,",
              "        message,",
              "        language,",
              "    )",
              "",
              "",
          ]

          handler_block = "\n".join(handler_lines)

          updated = updated.replace(
              init_marker,
              handler_block + init_marker,
              1,
          )

          compile(
              updated,
              "bot.py",
              "exec",
          )

          required = (
              marker,
              "send_profile_invoice",
              "@bot.pre_checkout_query_handler(",
              "process_profile_pre_checkout",
              '"successful_payment"',
              "process_profile_successful_payment",
          )

          for item in required:
              if item not in updated:
                  raise SystemExit(
                      "ERROR: missing connection element: "
                      + item
                  )

          path.write_text(
              updated,
              encoding="utf-8",
          )

          print("Minimal Stars connection applied.")
          print(
              "Callback body replaced:",
              body_start + 1,
              "-",
              body_end,
          )
          PY

      - name: Compile patched project
        run: |
          python -m py_compile bot.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile personal_profile_v2_engine.py
          python -m py_compile natal_chart_engine.py
          python -m py_compile natal_profile_interpreter.py
          git diff --check

      - name: Verify minimal connection
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          ast.parse(
              source,
              filename="bot.py",
          )

          required = (
              "ASTROVIBE MINIMAL STARS CONNECTION",
              "send_profile_invoice",
              "@bot.pre_checkout_query_handler(",
              "process_profile_pre_checkout",
              '"successful_payment"',
              "process_profile_successful_payment",
          )

          for item in required:
              assert item in source, item
              print("OK:", item)

          assert "handle_profile_unlock_preview" in source

          print("MINIMAL STARS CONNECTION VERIFIED")
          PY

      - name: Verify 390 XTR invoice
        run: |
          python - <<'PY'
          from profile_stars_payment import (
              build_profile_invoice,
          )

          invoice = build_profile_invoice(
              user_id=123456789,
              language="fr",
          )

          assert invoice["currency"] == "XTR"
          assert invoice["provider_token"] == ""
          assert len(invoice["prices"]) == 1
          assert invoice["prices"][0]["amount"] == 390

          assert invoice["payload"] == (
              "astrovibe_profile_v2:123456789"
          )

          print("390 XTR INVOICE VERIFIED")
          PY

      - name: Show changes
        run: |
          git diff --check
          git status --short
          git diff -- bot.py

      - name: Commit validated connection
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Connect tested Stars handlers to Telegram"
          git push origin HEAD:main
