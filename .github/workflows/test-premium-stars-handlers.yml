name: Test Premium Stars Handlers

on:
  workflow_dispatch:

jobs:
  test-premium-stars-handlers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Premium handlers stack
        run: |
          python -m py_compile premium_stars_handlers.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile premium_subscription_engine.py

      - name: Test Premium pre checkout handler
        run: |
          python - <<'PY'
          from premium_stars_handlers import (
              process_premium_pre_checkout,
          )

          result = process_premium_pre_checkout(
              payload="astrovibe_premium:123456789",
              currency="XTR",
              total_amount=199,
              telegram_user_id=123456789,
          )

          assert result["success"] is True
          assert result["reason"] == "valid"

          validation = result["validation"]

          assert validation["valid"] is True
          assert validation["user_id"] == 123456789
          assert validation["amount"] == 199
          assert validation["currency"] == "XTR"

          print("PRE-CHECKOUT HANDLER OK")
          PY

      - name: Test invalid Premium pre checkout handler
        run: |
          python - <<'PY'
          from premium_stars_handlers import (
              process_premium_pre_checkout,
          )

          wrong_amount = process_premium_pre_checkout(
              payload="astrovibe_premium:123456789",
              currency="XTR",
              total_amount=200,
              telegram_user_id=123456789,
          )

          assert wrong_amount["success"] is False
          assert wrong_amount["reason"] == "invalid_amount"

          wrong_currency = process_premium_pre_checkout(
              payload="astrovibe_premium:123456789",
              currency="USD",
              total_amount=199,
              telegram_user_id=123456789,
          )

          assert wrong_currency["success"] is False
          assert wrong_currency["reason"] == "invalid_currency"

          wrong_user = process_premium_pre_checkout(
              payload="astrovibe_premium:123456789",
              currency="XTR",
              total_amount=199,
              telegram_user_id=999999999,
          )

          assert wrong_user["success"] is False
          assert wrong_user["reason"] == "invalid_user"

          wrong_payload = process_premium_pre_checkout(
              payload="wrong:123456789",
              currency="XTR",
              total_amount=199,
              telegram_user_id=123456789,
          )

          assert wrong_payload["success"] is False
          assert wrong_payload["reason"] == "invalid_payload"

          print("INVALID PRE-CHECKOUTS REJECTED")
          PY

      - name: Test Premium expiration normalization
        run: |
          python - <<'PY'
          from datetime import (
              datetime,
              timezone,
          )

          from premium_stars_handlers import (
              _normalize_expiration_date,
          )

          timestamp = 1893456000

          normalized = (
              _normalize_expiration_date(
                  timestamp
              )
          )

          assert isinstance(
              normalized,
              datetime,
          )

          assert normalized.tzinfo is not None

          aware = datetime(
              2030,
              1,
              1,
              tzinfo=timezone.utc,
          )

          assert (
              _normalize_expiration_date(
                  aware
              )
              == aware
          )

          naive = datetime(
              2030,
              1,
              1,
          )

          normalized_naive = (
              _normalize_expiration_date(
                  naive
              )
          )

          assert (
              normalized_naive.tzinfo
              is not None
          )

          assert (
              _normalize_expiration_date(
                  None
              )
              is None
          )

          assert (
              _normalize_expiration_date(
                  "invalid"
              )
              is None
          )

          print("EXPIRATION NORMALIZATION OK")
          PY

      - name: Test successful Premium payment handler
        run: |
          python - <<'PY'
          from datetime import datetime

          import premium_stars_handlers


          captured = {}


          def fake_activate_premium_subscription(
              get_db_connection,
              user_id,
              telegram_payment_charge_id,
              telegram_subscription_id=None,
              expires_at=None,
          ):
              captured["get_db_connection"] = (
                  get_db_connection
              )
              captured["user_id"] = user_id
              captured["charge_id"] = (
                  telegram_payment_charge_id
              )
              captured["subscription_id"] = (
                  telegram_subscription_id
              )
              captured["expires_at"] = (
                  expires_at
              )

              return {
                  "success": True,
                  "reason": "activated",
                  "user_id": user_id,
                  "status": "active",
                  "amount_stars": 199,
                  "currency": "XTR",
                  "expires_at": expires_at,
              }


          premium_stars_handlers.activate_premium_subscription = (
              fake_activate_premium_subscription
          )


          def fake_db_connection():
              return None


          expiration = 1893456000

          result = (
              premium_stars_handlers
              .process_successful_premium_payment(
                  get_db_connection=(
                      fake_db_connection
                  ),
                  payload=(
                      "astrovibe_premium:"
                      "123456789"
                  ),
                  currency="XTR",
                  total_amount=199,
                  telegram_payment_charge_id=(
                      "TEST_PREMIUM_CHARGE_001"
                  ),
                  telegram_user_id=123456789,
                  telegram_subscription_id=(
                      "TEST_SUBSCRIPTION_001"
                  ),
                  subscription_expiration_date=(
                      expiration
                  ),
                  is_recurring=True,
                  is_first_recurring=True,
              )
          )

          assert result["success"] is True

          assert (
              result["reason"]
              == "premium_activated"
          )

          assert result["user_id"] == 123456789
          assert result["amount"] == 199
          assert result["currency"] == "XTR"

          assert (
              result[
                  "telegram_payment_charge_id"
              ]
              == "TEST_PREMIUM_CHARGE_001"
          )

          assert (
              result[
                  "telegram_subscription_id"
              ]
              == "TEST_SUBSCRIPTION_001"
          )

          assert (
              isinstance(
                  result[
                      "subscription_expiration_date"
                  ],
                  datetime,
              )
          )

          assert result["is_recurring"] is True

          assert (
              result["is_first_recurring"]
              is True
          )

          assert captured["user_id"] == 123456789

          assert (
              captured["charge_id"]
              == "TEST_PREMIUM_CHARGE_001"
          )

          assert (
              captured["subscription_id"]
              == "TEST_SUBSCRIPTION_001"
          )

          assert (
              isinstance(
                  captured["expires_at"],
                  datetime,
              )
          )

          print("SUCCESSFUL PAYMENT HANDLER OK")
          print("SUBSCRIPTION ACTIVATION CALLED")
          print("RECURRING DATA PRESERVED")
          PY

      - name: Test invalid successful payment protection
        run: |
          python - <<'PY'
          import premium_stars_handlers


          called = {
              "activation": False,
          }


          def forbidden_activation(*args, **kwargs):
              called["activation"] = True

              raise AssertionError(
                  "Activation must not run "
                  "for invalid payment"
              )


          premium_stars_handlers.activate_premium_subscription = (
              forbidden_activation
          )


          result = (
              premium_stars_handlers
              .process_successful_premium_payment(
                  get_db_connection=lambda: None,
                  payload=(
                      "astrovibe_premium:"
                      "123456789"
                  ),
                  currency="XTR",
                  total_amount=200,
                  telegram_payment_charge_id=(
                      "INVALID_CHARGE"
                  ),
                  telegram_user_id=123456789,
              )
          )

          assert result["success"] is False
          assert result["reason"] == "invalid_amount"

          assert (
              called["activation"]
              is False
          )

          print("INVALID PAYMENT BLOCKED")
          print("ACTIVATION NOT CALLED")
          PY

      - name: Test missing charge ID protection
        run: |
          python - <<'PY'
          import premium_stars_handlers


          called = {
              "activation": False,
          }


          def forbidden_activation(*args, **kwargs):
              called["activation"] = True

              raise AssertionError(
                  "Activation must not run "
                  "without charge ID"
              )


          premium_stars_handlers.activate_premium_subscription = (
              forbidden_activation
          )


          result = (
              premium_stars_handlers
              .process_successful_premium_payment(
                  get_db_connection=lambda: None,
                  payload=(
                      "astrovibe_premium:"
                      "123456789"
                  ),
                  currency="XTR",
                  total_amount=199,
                  telegram_payment_charge_id=None,
                  telegram_user_id=123456789,
              )
          )

          assert result["success"] is False

          assert (
              result["reason"]
              == "missing_charge_id"
          )

          assert (
              called["activation"]
              is False
          )

          print("MISSING CHARGE ID BLOCKED")
          PY

      - name: Test duplicate charge propagation
        run: |
          python - <<'PY'
          import premium_stars_handlers


          def duplicate_activation(
              get_db_connection,
              user_id,
              telegram_payment_charge_id,
              telegram_subscription_id=None,
              expires_at=None,
          ):
              return {
                  "success": False,
                  "reason": "duplicate_charge",
              }


          premium_stars_handlers.activate_premium_subscription = (
              duplicate_activation
          )


          result = (
              premium_stars_handlers
              .process_successful_premium_payment(
                  get_db_connection=lambda: None,
                  payload=(
                      "astrovibe_premium:"
                      "123456789"
                  ),
                  currency="XTR",
                  total_amount=199,
                  telegram_payment_charge_id=(
                      "DUPLICATE_CHARGE"
                  ),
                  telegram_user_id=123456789,
                  telegram_subscription_id=(
                      "TEST_SUBSCRIPTION_001"
                  ),
              )
          )

          assert result["success"] is False

          assert (
              result["reason"]
              == "duplicate_charge"
          )

          assert (
              result["activation"]["reason"]
              == "duplicate_charge"
          )

          print("DUPLICATE CHARGE PROPAGATED")
          PY

      - name: Verify Premium stack remains separate
        run: |
          test -f premium_stars_handlers.py
          test -f premium_stars_payment.py
          test -f premium_subscription_engine.py
          test -f premium_engine.py
          test -f profile_stars_payment.py
          test -f profile_purchase_engine.py
          test -f bot.py

          echo "PREMIUM HANDLERS OK"
          echo "PREMIUM PAYMENT ENGINE PRESERVED"
          echo "PREMIUM SUBSCRIPTION ENGINE PRESERVED"
          echo "PREMIUM V1 PRESERVED"
          echo "PROFILE PURCHASE PRESERVED"
          echo "BOT.PY PRESERVED"

      - name: Final zero cost validation
        run: |
          echo "======================================="
          echo "PREMIUM STARS HANDLERS TEST PASSED"
          echo "======================================="
          echo "Price: 199 XTR"
          echo "Pre-checkout handler: OK"
          echo "Successful payment handler: OK"
          echo "Expiration metadata: OK"
          echo "Recurring metadata: OK"
          echo "Invalid payment protection: OK"
          echo "Duplicate charge propagation: OK"
          echo "Premium V1 preserved: OK"
          echo "Profile purchase preserved: OK"
          echo "Points/referral untouched: OK"
          echo "Real Stars spent: 0"
