name: Remove Debug Commands

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-debug-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f bot.py
          test -f referral_engine.py
          test -f level_rewards_engine.py
          test -f paysupport_engine.py
          test -f paysupport_admin.py
          test -f paysupport_ai.py
          test -f premium_subscription_engine.py
          test -f profile_purchase_engine.py
          test -f terms_engine.py

          echo "REQUIRED FILES OK"

      - name: Verify debug commands exist
        run: |
          grep -q \
            'commands=$$"profile_test"$$' \
            bot.py

          grep -q \
            'def profile_test(message):' \
            bot.py

          grep -q \
            'commands=$$"location_test"$$' \
            bot.py

          grep -q \
            'def location_test(message):' \
            bot.py

          echo "DEBUG COMMANDS FOUND"

      - name: Create debug command removal patch
        run: |
          cat > /tmp/remove_debug_commands.py <<'PY'
          import ast
          from pathlib import Path


          TARGET_COMMANDS = {
              "profile_test",
              "location_test",
          }

          path = Path("bot.py")

          source = path.read_text(
              encoding="utf-8"
          )

          tree = ast.parse(
              source
          )

          lines = source.splitlines(
              keepends=True
          )


          def extract_commands(
              decorator,
          ):
              if not isinstance(
                  decorator,
                  ast.Call,
              ):
                  return set()

              function = decorator.func

              if not (
                  isinstance(
                      function,
                      ast.Attribute,
                  )
                  and function.attr
                  == "message_handler"
              ):
                  return set()

              commands = set()

              for keyword in decorator.keywords:
                  if keyword.arg != "commands":
                      continue

                  value = keyword.value

                  if not isinstance(
                      value,
                      (
                          ast.List,
                          ast.Tuple,
                          ast.Set,
                      ),
                  ):
                      continue

                  for item in value.elts:
                      if (
                          isinstance(
                              item,
                              ast.Constant,
                          )
                          and isinstance(
                              item.value,
                              str,
                          )
                      ):
                          commands.add(
                              item.value
                          )

              return commands


          removals = []
          found_commands = set()

          for node in tree.body:
              if not isinstance(
                  node,
                  (
                      ast.FunctionDef,
                      ast.AsyncFunctionDef,
                  ),
              ):
                  continue

              node_commands = set()

              for decorator in node.decorator_list:
                  node_commands.update(
                      extract_commands(
                          decorator
                      )
                  )

              matched = (
                  node_commands
                  & TARGET_COMMANDS
              )

              if not matched:
                  continue

              if node.end_lineno is None:
                  raise RuntimeError(
                      "Python could not determine "
                      "the end of debug handler: "
                      + node.name
                  )

              if node.decorator_list:
                  start_line = min(
                      decorator.lineno
                      for decorator
                      in node.decorator_list
                  )
              else:
                  start_line = node.lineno

              end_line = node.end_lineno

              while (
                  end_line < len(lines)
                  and not lines[
                      end_line
                  ].strip()
              ):
                  end_line += 1

              removals.append(
                  (
                      start_line - 1,
                      end_line,
                      node.name,
                      sorted(matched),
                  )
              )

              found_commands.update(
                  matched
              )

          missing = (
              TARGET_COMMANDS
              - found_commands
          )

          if missing:
              raise RuntimeError(
                  "Debug commands not found: "
                  + repr(
                      sorted(missing)
                  )
              )

          if len(removals) != 2:
              raise RuntimeError(
                  "Expected exactly two debug "
                  "handlers, found: "
                  + str(len(removals))
              )

          print(
              "DEBUG HANDLERS TO REMOVE:"
          )

          for (
              start,
              end,
              function_name,
              commands,
          ) in removals:
              print(
                  function_name,
                  commands,
                  "lines",
                  start + 1,
                  "to",
                  end,
              )

          for (
              start,
              end,
              function_name,
              commands,
          ) in sorted(
              removals,
              reverse=True,
          ):
              del lines[
                  start:end
              ]

          updated_source = "".join(
              lines
          )

          ast.parse(
              updated_source
          )

          forbidden = (
              'commands=["profile_test"]',
              "def profile_test(message):",
              'commands=["location_test"]',
              "def location_test(message):",
              "/location_test Paris",
          )

          for marker in forbidden:
              if marker in updated_source:
                  raise RuntimeError(
                      "Debug marker survived: "
                      + marker
                  )

          path.write_text(
              updated_source,
              encoding="utf-8",
          )

          print(
              "DEBUG COMMANDS REMOVED"
          )
          PY

      - name: Validate removal patch
        run: |
          python -m py_compile \
            /tmp/remove_debug_commands.py

          echo "REMOVAL PATCH VALID"

      - name: Apply debug command removal
        run: |
          python \
            /tmp/remove_debug_commands.py

      - name: Verify debug commands removed
        run: |
          if grep -q \
            'commands=$$"profile_test"$$' \
            bot.py
          then
            echo "/profile_test decorator survived."
            exit 1
          fi

          if grep -q \
            'def profile_test(message):' \
            bot.py
          then
            echo "profile_test function survived."
            exit 1
          fi

          if grep -q \
            'commands=$$"location_test"$$' \
            bot.py
          then
            echo "/location_test decorator survived."
            exit 1
          fi

          if grep -q \
            'def location_test(message):' \
            bot.py
          then
            echo "location_test function survived."
            exit 1
          fi

          if grep -q \
            '/location_test Paris' \
            bot.py
          then
            echo "location_test usage text survived."
            exit 1
          fi

          echo "DEBUG COMMANDS FULLY REMOVED"

      - name: Compile critical production stack
        run: |
          python -m py_compile bot.py
          python -m py_compile referral_engine.py
          python -m py_compile level_rewards_engine.py
          python -m py_compile paysupport_engine.py
          python -m py_compile paysupport_admin.py
          python -m py_compile paysupport_ai.py
          python -m py_compile premium_subscription_engine.py
          python -m py_compile premium_stars_payment.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_stars_payment.py
          python -m py_compile terms_engine.py

          echo "PRODUCTION STACK COMPILES"

      - name: Verify astrology preserved
        run: |
          grep -q \
            "def start(message):" \
            bot.py

          grep -q \
            "def menu(message):" \
            bot.py

          grep -q \
            "def show_points" \
            bot.py

          grep -q \
            "def show_daily_bonus" \
            bot.py

          echo "CORE ASTROVIBE ROUTING PRESERVED"

      - name: Verify Profile preserved
        run: |
          grep -q \
            "astrovibe_profile_v2:" \
            bot.py

          grep -q \
            "process_profile_pre_checkout" \
            bot.py

          grep -q \
            "process_successful_profile_purchase" \
            bot.py

          grep -q \
            "send_personal_profile" \
            bot.py

          echo "PROFILE 390 STARS PRESERVED"

      - name: Verify Premium preserved
        run: |
          grep -q \
            "astrovibe_premium:" \
            bot.py

          grep -q \
            "createInvoiceLink" \
            bot.py

          grep -q \
            "process_premium_pre_checkout" \
            bot.py

          grep -q \
            "process_successful_premium_payment" \
            bot.py

          echo "PREMIUM 199 STARS PRESERVED"

      - name: Verify points and rewards preserved
        run: |
          grep -q \
            "def calculate_level(points):" \
            bot.py

          grep -q \
            "def show_points" \
            bot.py

          grep -q \
            "def show_daily_bonus" \
            bot.py

          grep -q \
            "base_reward = 10" \
            bot.py

          grep -q \
            "streak_reward" \
            bot.py

          grep -q \
            "ASTROVIBE LEVEL REWARDS ROUTING" \
            bot.py

          echo "POINTS BONUS STREAK REWARDS PRESERVED"

      - name: Verify Referral V1 preserved
        run: |
          grep -q \
            "ASTROVIBE REFERRAL START CAPTURE" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL FINALIZATION" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL INVITE ROUTING" \
            bot.py

          grep -q \
            "ASTROVIBE REFERRAL MENU BUTTON" \
            bot.py

          grep -q \
            'command_name == "/invite"' \
            bot.py

          echo "REFERRAL V1 PRESERVED"

      - name: Verify support and terms preserved
        run: |
          grep -q \
            'command_name == "/terms"' \
            bot.py

          grep -q \
            'command_name == "/paysupport"' \
            bot.py

          grep -q \
            'command_name == "/supportreply"' \
            bot.py

          grep -q \
            "ASTROVIBE SUPPORT AI ROUTING" \
            bot.py

          grep -q \
            "send_ticket_to_admin" \
            bot.py

          echo "TERMS PRESERVED"
          echo "AI SUPPORT PRESERVED"
          echo "HUMAN SUPPORT PRESERVED"

      - name: Verify Premium diagnostics untouched
        run: |
          grep -q \
            "PREMIUM INVOICE DIAGNOSTIC" \
            bot.py

          grep -q \
            "PREMIUM DIAGNOSTIC MESSAGE ERROR:" \
            bot.py

          echo "PREMIUM DIAGNOSTICS LEFT UNCHANGED"

      - name: Remove Python cache
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name "*.pyc" \
            -delete

          echo "PYTHON CACHE REMOVED"

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess


          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line
              in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {
              "bot.py"
          }, (
              "Unexpected changed files: "
              + repr(sorted(changed))
          )

          print(
              "ONLY BOT.PY CHANGED"
          )
          PY

      - name: Show debug removal diff
        run: |
          git diff -- bot.py

      - name: Commit debug command removal
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py changes."
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Remove production debug commands"

          git push

      - name: Final validation
        run: |
          echo "======================================"
          echo "DEBUG COMMAND CLEANUP COMPLETE"
          echo "======================================"
          echo "/profile_test removed: YES"
          echo "/location_test removed: YES"
          echo "Premium diagnostics removed: NO"
          echo "bot.py compilation: OK"
          echo "Profile preserved: YES"
          echo "Premium preserved: YES"
          echo "Points and rewards preserved: YES"
          echo "Referral V1 preserved: YES"
          echo "Support preserved: YES"
          echo "Terms preserved: YES"
          echo "Database writes: 0"
          echo "Telegram messages: 0"
          echo "Payments touched: 0"
