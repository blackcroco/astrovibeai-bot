name: Update Main Menu With Profile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-main-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backup bot.py
        run: cp bot.py bot.py.before-main-menu-update

      - name: Patch main menu
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")

          function_match = re.search(
              r'^def main_menu\s*$$[^)]*$$:',
              source,
              flags=re.MULTILINE,
          )

          if function_match is None:
              raise RuntimeError(
                  "main_menu() introuvable. "
                  "Aucun patch effectue."
              )

          start = function_match.start()

          next_function = re.search(
              r'^def\s+[A-Za-z_][A-Za-z0-9_]*\s*\(',
              source[function_match.end():],
              flags=re.MULTILINE,
          )

          if next_function is None:
              raise RuntimeError(
                  "Fonction suivante introuvable. "
                  "Aucun patch effectue."
              )

          end = (
              function_match.end()
              + next_function.start()
          )

          old_block = source[start:end]

          required_old_markers = (
              "horoscope_button",
              "compatibility_button",
              "bonus_button",
              "points_button",
              "premium_button",
          )

          for marker in required_old_markers:
              if marker not in old_block:
                  raise RuntimeError(
                      f"Marqueur absent du menu actuel: {marker}. "
                      "Aucun patch effectue."
                  )

          settings_candidates = (
              "settings_button",
              "parameters_button",
          )

          settings_key = next(
              (
                  candidate
                  for candidate in settings_candidates
                  if candidate in old_block
              ),
              None,
          )

          if settings_key is None:
              raise RuntimeError(
                  "Cle du bouton Settings introuvable. "
                  "Aucun patch effectue."
              )

          Path(
              "menu_main_before_patch.txt"
          ).write_text(
              old_block,
              encoding="utf-8",
          )

          new_block = f'''def main_menu(language="fr"):
              markup = types.ReplyKeyboardMarkup(
                  resize_keyboard=True
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "horoscope_button"
                      )
                  ),
                  types.KeyboardButton(
                      get_text(
                          language,
                          "compatibility_button"
                      )
                  )
              )

              profile_button = (
                  "✨ My AstroVibe Profile"
                  if language == "en"
                  else "✨ Mon Profil AstroVibe"
              )

              markup.row(
                  types.KeyboardButton(
                      profile_button
                  ),
                  types.KeyboardButton(
                      get_text(
                          language,
                          "premium_button"
                      )
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "bonus_button"
                      )
                  ),
                  types.KeyboardButton(
                      get_text(
                          language,
                          "points_button"
                      )
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "{settings_key}"
                      )
                  )
              )

              return markup


          '''

          patched = (
              source[:start]
              + new_block
              + source[end:]
          )

          if patched == source:
              raise RuntimeError(
                  "Le patch ne produit aucun changement."
              )

          path.write_text(
              patched,
              encoding="utf-8",
          )

          print("MAIN MENU PATCHED")
          print("Settings key:", settings_key)
          print("")
          print("Target layout:")
          print("Horoscope | Compatibility")
          print("Profile   | Premium")
          print("Bonus     | Points")
          print("Settings")
          PY

      - name: Compile bot.py
        run: python -m py_compile bot.py

      - name: Verify new main menu
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          function_match = re.search(
              r'^def main_menu\s*$$[^)]*$$:',
              source,
              flags=re.MULTILINE,
          )

          assert function_match is not None

          next_function = re.search(
              r'^def\s+[A-Za-z_][A-Za-z0-9_]*\s*\(',
              source[function_match.end():],
              flags=re.MULTILINE,
          )

          assert next_function is not None

          end = (
              function_match.end()
              + next_function.start()
          )

          menu = source[
              function_match.start():end
          ]

          required = (
              "horoscope_button",
              "compatibility_button",
              "✨ Mon Profil AstroVibe",
              "✨ My AstroVibe Profile",
              "premium_button",
              "bonus_button",
              "points_button",
              "return markup",
          )

          for marker in required:
              assert marker in menu, marker
              print("OK:", marker)

          assert (
              "settings_button" in menu
              or "parameters_button" in menu
          )

          row_count = menu.count("markup.row(")

          assert row_count == 4, (
              f"Expected 4 menu rows, found {row_count}"
          )

          print("OK: four menu rows")
          print("MAIN MENU VERIFIED")
          PY

      - name: Verify profile entry handler still present
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "✨ Mon Profil AstroVibe",
              "✨ My AstroVibe Profile",
              "unlock_profile_390",
              "handle_profile_unlock_preview",
          )

          for marker in required:
              assert marker in bot, marker
              print("OK:", marker)

          print("PROFILE ENTRY HANDLER PRESERVED")
          PY

      - name: Verify purchase delivery still present
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "process_successful_profile_purchase",
              "has_purchased_profile",
          )

          for marker in required:
              assert marker in bot, marker
              print("OK:", marker)

          print("PURCHASE DELIVERY PRESERVED")
          PY

      - name: Compile profile payment stack
        run: python -m py_compile profile_stars_payment.py profile_stars_handlers.py profile_purchase_engine.py profile_purchase_delivery.py personal_profile_v2_engine.py

      - name: Show bot.py changes
        run: git diff -- bot.py

      - name: Verify protected files unchanged
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "bot.py",
          }

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          }

          unexpected = changed - allowed

          if unexpected:
              raise RuntimeError(
                  "Unexpected tracked files changed: "
                  + ", ".join(sorted(unexpected))
              )

          if "bot.py" not in changed:
              raise RuntimeError(
                  "bot.py was not changed."
              )

          print("ONLY BOT.PY CHANGED")
          PY

      - name: Commit safe main menu update
        run: |
          rm -f bot.py.before-main-menu-update
          rm -f menu_main_before_patch.txt

          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Add AstroVibe Profile to main menu"
          git push
