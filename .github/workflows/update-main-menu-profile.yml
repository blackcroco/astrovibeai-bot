name: Update Main Menu With Profile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-main-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch main menu
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          target = None

          for node in tree.body:
              if (
                  isinstance(node, ast.FunctionDef)
                  and node.name == "main_menu"
              ):
                  target = node
                  break

          if target is None:
              raise RuntimeError(
                  "main_menu() introuvable. Aucun patch effectue."
              )

          if not hasattr(target, "end_lineno"):
              raise RuntimeError(
                  "Impossible de determiner la fin de main_menu()."
              )

          old_block = ast.get_source_segment(
              source,
              target,
          )

          if not old_block:
              raise RuntimeError(
                  "Impossible de lire main_menu()."
              )

          required = (
              "horoscope_button",
              "compatibility_button",
              "bonus_button",
              "points_button",
              "premium_button",
          )

          for marker in required:
              if marker not in old_block:
                  raise RuntimeError(
                      "Marqueur absent de main_menu(): "
                      + marker
                  )

          settings_keys = (
              "settings_button",
              "parameters_button",
          )

          settings_key = next(
              (
                  key
                  for key in settings_keys
                  if key in old_block
              ),
              None,
          )

          if settings_key is None:
              raise RuntimeError(
                  "Bouton Settings introuvable dans main_menu()."
              )

          lines = source.splitlines(keepends=True)

          start = sum(
              len(line)
              for line in lines[:target.lineno - 1]
          )

          end = sum(
              len(line)
              for line in lines[:target.end_lineno]
          )

          new_block = f'''def main_menu(language="fr"):
              markup = types.ReplyKeyboardMarkup(
                  resize_keyboard=True
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "horoscope_button"
                      )
                  ),
                  types.KeyboardButton(
                      get_text(
                          language,
                          "compatibility_button"
                      )
                  )
              )

              profile_button = (
                  "✨ My AstroVibe Profile"
                  if language == "en"
                  else "✨ Mon Profil AstroVibe"
              )

              markup.row(
                  types.KeyboardButton(
                      profile_button
                  ),
                  types.KeyboardButton(
                      get_text(
                          language,
                          "premium_button"
                      )
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "bonus_button"
                      )
                  ),
                  types.KeyboardButton(
                      get_text(
                          language,
                          "points_button"
                      )
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          language,
                          "{settings_key}"
                      )
                  )
              )

              return markup'''

          patched = (
              source[:start]
              + new_block
              + source[end:]
          )

          if patched == source:
              raise RuntimeError(
                  "Aucun changement produit."
              )

          path.write_text(
              patched,
              encoding="utf-8",
          )

          print("MAIN MENU PATCHED")
          print("Settings key:", settings_key)
          PY

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: Verify main menu
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          tree = ast.parse(source)

          target = None

          for node in tree.body:
              if (
                  isinstance(node, ast.FunctionDef)
                  and node.name == "main_menu"
              ):
                  target = node
                  break

          assert target is not None

          menu = ast.get_source_segment(
              source,
              target,
          )

          assert menu

          required = (
              "horoscope_button",
              "compatibility_button",
              "✨ Mon Profil AstroVibe",
              "✨ My AstroVibe Profile",
              "premium_button",
              "bonus_button",
              "points_button",
              "return markup",
          )

          for marker in required:
              assert marker in menu, marker
              print("OK:", marker)

          assert (
              "settings_button" in menu
              or "parameters_button" in menu
          )

          assert menu.count(
              "markup.row("
          ) == 4

          print("OK: 4 menu rows")
          print("MAIN MENU VERIFIED")
          PY

      - name: Verify Profile handlers
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "✨ Mon Profil AstroVibe",
              "✨ My AstroVibe Profile",
              "unlock_profile_390",
              "handle_profile_unlock_preview",
              "process_successful_profile_purchase",
              "has_purchased_profile",
          )

          for marker in required:
              assert marker in source, marker
              print("OK:", marker)

          print("PROFILE HANDLERS PRESERVED")
          PY

      - name: Compile payment stack
        run: |
          python -m py_compile profile_stars_payment.py
          python -m py_compile profile_stars_handlers.py
          python -m py_compile profile_purchase_engine.py
          python -m py_compile profile_purchase_delivery.py
          python -m py_compile personal_profile_v2_engine.py

      - name: Verify purchase workflow files
        run: |
          test -f profile_stars_payment.py
          test -f profile_stars_handlers.py
          test -f profile_purchase_engine.py
          test -f profile_purchase_delivery.py
          echo "PAYMENT FILES OK"

      - name: Show changes
        run: |
          echo "========== BOT.PY DIFF =========="
          git diff -- bot.py
          echo "================================="

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              ["git", "diff", "--name-only"],
              capture_output=True,
              text=True,
              check=True,
          )

          changed = {
              item.strip()
              for item in result.stdout.splitlines()
              if item.strip()
          }

          if changed != {"bot.py"}:
              raise RuntimeError(
                  "Fichiers inattendus modifies: "
                  + repr(sorted(changed))
              )

          print("ONLY BOT.PY CHANGED")
          PY

      - name: Commit safe main menu update
        run: |
          git add bot.py

          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Add AstroVibe Profile to main menu"
          git push
