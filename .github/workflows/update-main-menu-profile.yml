name: Update Main Menu With Profile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-main-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backup bot.py
        run: cp bot.py bot.py.before-main-menu-update

      - name: Locate and patch main menu
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("bot.py")
          source = path.read_text(encoding="utf-8")
          lines = source.splitlines(keepends=True)

          tree = ast.parse(source)

          required_markers = (
              "horoscope_button",
              "compatibility_button",
              "bonus_button",
              "points_button",
              "premium_button",
          )

          candidates = []

          for node in ast.walk(tree):
              if not isinstance(
                  node,
                  (ast.FunctionDef, ast.AsyncFunctionDef),
              ):
                  continue

              if not hasattr(node, "end_lineno"):
                  continue

              block = "".join(
                  lines[
                      node.lineno - 1:
                      node.end_lineno
                  ]
              )

              if all(
                  marker in block
                  for marker in required_markers
              ):
                  candidates.append(
                      (node, block)
                  )

          if len(candidates) == 0:
              raise RuntimeError(
                  "Aucune fonction de menu contenant "
                  "tous les boutons principaux."
              )

          if len(candidates) > 1:
              names = ", ".join(
                  node.name
                  for node, _ in candidates
              )

              raise RuntimeError(
                  "Plusieurs fonctions candidates: "
                  + names
              )

          node, old_block = candidates[0]

          if not node.args.args:
              raise RuntimeError(
                  "Le menu ne possede aucun parametre "
                  "de langue identifiable."
              )

          function_name = node.name
          language_name = node.args.args[0].arg

          settings_candidates = (
              "settings_button",
              "parameters_button",
          )

          settings_key = next(
              (
                  key
                  for key in settings_candidates
                  if key in old_block
              ),
              None,
          )

          if settings_key is None:
              raise RuntimeError(
                  "Cle Settings introuvable dans "
                  "le menu actuel."
              )

          Path(
              "main_menu_before_patch.txt"
          ).write_text(
              old_block,
              encoding="utf-8",
          )

          start_index = sum(
              len(line)
              for line in lines[:node.lineno - 1]
          )

          end_index = sum(
              len(line)
              for line in lines[:node.end_lineno]
          )

          function_header = lines[
              node.lineno - 1
          ].rstrip("\r\n")

          new_block = f'''{function_header}
              markup = types.ReplyKeyboardMarkup(
                  resize_keyboard=True
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          {language_name},
                          "horoscope_button"
                      )
                  ),
                  types.KeyboardButton(
                      get_text(
                          {language_name},
                          "compatibility_button"
                      )
                  )
              )

              profile_button = (
                  "✨ My AstroVibe Profile"
                  if {language_name} == "en"
                  else "✨ Mon Profil AstroVibe"
              )

              markup.row(
                  types.KeyboardButton(
                      profile_button
                  ),
                  types.KeyboardButton(
                      get_text(
                          {language_name},
                          "premium_button"
                      )
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          {language_name},
                          "bonus_button"
                      )
                  ),
                  types.KeyboardButton(
                      get_text(
                          {language_name},
                          "points_button"
                      )
                  )
              )

              markup.row(
                  types.KeyboardButton(
                      get_text(
                          {language_name},
                          "{settings_key}"
                      )
                  )
              )

              return markup
          '''

          patched = (
              source[:start_index]
              + new_block
              + source[end_index:]
          )

          if patched == source:
              raise RuntimeError(
                  "Le patch ne produit aucun changement."
              )

          path.write_text(
              patched,
              encoding="utf-8",
          )

          print(
              "FUNCTION FOUND:",
              function_name,
          )
          print(
              "LANGUAGE PARAMETER:",
              language_name,
          )
          print(
              "SETTINGS KEY:",
              settings_key,
          )
          print("MAIN MENU PATCHED")
          PY

      - name: Compile bot.py
        run: python -m py_compile bot.py

      - name: Verify main menu layout
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("bot.py").read_text(
              encoding="utf-8"
          )

          tree = ast.parse(source)

          required = (
              "horoscope_button",
              "compatibility_button",
              "✨ Mon Profil AstroVibe",
              "✨ My AstroVibe Profile",
              "premium_button",
              "bonus_button",
              "points_button",
          )

          matches = []

          for node in ast.walk(tree):
              if not isinstance(
                  node,
                  (ast.FunctionDef, ast.AsyncFunctionDef),
              ):
                  continue

              block = ast.get_source_segment(
                  source,
                  node,
              )

              if not block:
                  continue

              if all(
                  marker in block
                  for marker in required
              ):
                  matches.append(
                      (node, block)
                  )

          assert len(matches) == 1, (
              "Expected one patched main menu, "
              f"found {len(matches)}"
          )

          node, menu = matches[0]

          assert (
              "settings_button" in menu
              or "parameters_button" in menu
          )

          row_count = menu.count(
              "markup.row("
          )

          assert row_count == 4, (
              "Expected 4 rows, "
              f"found {row_count}"
          )

          for marker in required:
              print("OK:", marker)

          print(
              "FUNCTION:",
              node.name,
          )
          print("OK: four menu rows")
          print("MAIN MENU VERIFIED")
          PY

      - name: Verify profile handlers preserved
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path("bot.py").read_text(
              encoding="utf-8"
          )

          required = (
              "✨ Mon Profil AstroVibe",
              "✨ My AstroVibe Profile",
              "unlock_profile_390",
              "handle_profile_unlock_preview",
              "process_successful_profile_purchase",
              "has_purchased_profile",
          )

          for marker in required:
              assert marker in bot, marker
              print("OK:", marker)

          print("PROFILE HANDLERS PRESERVED")
          PY

      - name: Compile profile payment stack
        run: python -m py_compile profile_stars_payment.py profile_stars_handlers.py profile_purchase_engine.py profile_purchase_delivery.py personal_profile_v2_engine.py

      - name: Show bot.py changes
        run: git diff -- bot.py

      - name: Verify only bot.py changed
        run: |
          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = {
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          }

          assert changed == {"bot.py"}, (
              "Unexpected changed files: "
              + ", ".join(sorted(changed))
          )

          print("ONLY BOT.PY CHANGED")
          PY

      - name: Commit safe main menu update
        run: |
          rm -f bot.py.before-main-menu-update
          rm -f main_menu_before_patch.txt

          git add bot.py

          if git diff --cached --quiet; then
            echo "No bot.py change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Add AstroVibe Profile to main menu"
          git push
